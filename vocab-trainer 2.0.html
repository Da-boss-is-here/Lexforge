  runFreePractice(opts){
    opts = opts || {};
    const queue = Practice.buildDueQueue(opts);
    if(queue.length===0){
      Utils.toast('Nothing to practice right now.');
      App.showTab('dashboard');
      return;
    }
    Practice.session = { queue, idx:0, results:[], mode:'free' };
    Practice.persist();
    this.renderPracticeCard();
  },

  runProductionDrills(){
    const queue = Practice.buildProductionQueue(8);
    if(queue.length===0){ Utils.toast('No words are ready for production drills yet.'); return; }
    Practice.session = { queue, idx:0, results:[], mode:'production' };
    Practice.persist();
    this.renderPracticeCard();
  },

  renderPracticeCard(){
    const el = document.getElementById('view-practice');
    const s = Practice.session;
    if(!s || s.idx>=s.queue.length){
      const results = s ? s.results : [];
      const correct = results.filter(r=>r.correct).length;
      const summary = results.length ? Math.round(correct/results.length*100)+'% correct ('+correct+'/'+results.length+')' : 'No items practiced.';
      el.innerHTML = '<div class="card center"><h2>Session Complete</h2><p>'+summary+'</p>' +
        '<div class="btn-row" style="justify-content:center;"><button class="btn primary" id="doneBtn">Back to Dashboard</button></div></div>';
      el.querySelector('#doneBtn').addEventListener('click', ()=>{
        if(Session.active) Session.finishPhase(results);
        Practice.session = null;
        Practice.clearPersisted();
        if(!Session.active) App.showTab('dashboard');
      });
      return;
    }
    if(s.reviewing){ this.renderPracticeReviewCard(); return; }

    const item = s.queue[s.idx];
    const q = Practice.generateQuestion(item);
    s.currentQuestion = q; s.hintUsed = false;
    const canGoBack = Practice.canGoBack();

    el.innerHTML =
      '<div class="practice-wrap">' +
      '<div class="practice-progress">Item '+(s.idx+1)+' of '+s.queue.length+
      ' <button type="button" class="btn ghost small" id="practiceBackBtn" style="margin-left:8px;"'+(canGoBack?'':' disabled')+'>← Back</button></div>' +
      '<div class="practice-card" id="practiceCard">' +
      '<div class="practice-level">'+trackBadge(q)+'<span>'+levelName(q.level)+(q.drillType?' · Drill: '+q.drillType:'')+'</span></div>' +
      renderMnemonic(q.word) +
      renderMeaningHint(q) +
      '<div class="practice-sub">'+Utils.escapeHtml(q.promptTitle||'')+'</div>' +
      '<div class="practice-prompt">'+renderPrompt(q)+'</div>' +
      (q.sub?'<div class="practice-sub">'+Utils.escapeHtml(q.sub)+'</div>':'') +
      '<div id="answerArea"></div>' +
      '<div id="feedbackArea"></div>' +
      '</div></div>';

    const answerArea = el.querySelector('#answerArea');
    if(q.type==='recognition'){
      answerArea.innerHTML = '<div class="mcq-options">' + q.options.map((o,i)=>'<button data-i="'+i+'">'+Utils.escapeHtml(o)+'</button>').join('') + '</div>';
      answerArea.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const val = q.options[+btn.dataset.i];
          answerArea.querySelectorAll('button').forEach(b=>b.disabled=true);
          const correct = val===q.correctAnswer;
          btn.classList.add(correct?'correct':'incorrect');
          if(!correct){
            const cb = Array.from(answerArea.querySelectorAll('button')).find(b=>b.textContent===q.correctAnswer);
            if(cb) cb.classList.add('correct');
          }
          this.handleGraded(q, correct, val);
        });
      });
    } else if(q.autoGrade){
      answerArea.innerHTML = '<div class="answer-input"><input type="text" id="answerInput" autocomplete="off" spellcheck="false" placeholder="Type your answer…">' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="submitBtn">Check</button></div></div>';
      const input = answerArea.querySelector('#answerInput');
      input.focus();
      const submit = ()=>{
        const val = input.value.trim();
        if(!val) return;
        input.disabled = true; answerArea.querySelector('#submitBtn').disabled = true;
        const correct = Practice.grade(q, val);
        if(!correct && !s.hintUsed){
          this.offerHint(q, val, answerArea);
        } else {
          this.handleGraded(q, correct, val);
        }
      };
      answerArea.querySelector('#submitBtn').addEventListener('click', submit);
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
    } else {
      answerArea.innerHTML = '<div class="answer-input"><textarea id="answerInput" rows="3" placeholder="Write your sentence…"></textarea>' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="submitBtn">Reveal Self-Check</button></div></div>';
      answerArea.querySelector('#submitBtn').addEventListener('click', ()=>{
        const val = answerArea.querySelector('#answerInput').value.trim();
        this.showSelfCheck(q, val, answerArea);
      });
    }

    const backBtn = el.querySelector('#practiceBackBtn');
    if(backBtn && canGoBack){
      backBtn.addEventListener('click', ()=>{ Practice.goBack(); this.renderPracticeCard(); });
    }

    function levelName(l){ return ['','Recognition','Cued Recall','Cloze','Free Production'][l]; }
    function trackBadge(q){
      const cls = q.type==='drill' ? 'drill' : (q.type||'recognition');
      const label = q.type==='drill' ? 'Drill' : levelName(q.level);
      return '<span class="track-badge '+cls+'">'+label+'</span>';
    }
    function renderPrompt(q){
      if(q.type==='recognition') return 'Word: <b>'+Utils.escapeHtml(q.prompt)+'</b>';
      if(q.type==='cloze') return Utils.escapeHtml(q.prompt).replace('_____','<span class="blank">_____</span>');
      return Utils.escapeHtml(q.prompt);
    }
    function renderMnemonic(word){
      if(!word.mnemonic) return '';
      if(WordModel.mnemonicFaded(word)) return '<div class="practice-mnemonic faded">Mnemonic faded — retrieve directly.</div>';
      const safe = WordModel.maskWord(word.mnemonic, word.word);
      return '<div class="practice-mnemonic">💡 '+Utils.escapeHtml(safe)+'</div>';
    }
    function renderMeaningHint(q){
      if(!q.meaningHint) return '';
      return '<div class="practice-mnemonic">🎯 Meaning: '+Utils.escapeHtml(q.meaningHint)+'</div>';
    }
  },

  /* Read-only view of a previously graded card, reached via the practice "← Back"
     control. Reuses the exact stored question (never regenerates one, since several
     question generators are randomized) so the reveal matches what was actually
     answered. Grading is disabled here — the only action is returning to the
     current, still-in-progress card. */
  renderPracticeReviewCard(){
    const el = document.getElementById('view-practice');
    const s = Practice.session;
    const result = s.results.find(r=>r.idx===s.idx);
    if(!result){ Practice.returnToCurrent(); this.renderPracticeCard(); return; }
    const q = result.question;
    const word = result.word;

    function levelName(l){ return ['','Recognition','Cued Recall','Cloze','Free Production'][l]; }
    function renderPrompt(q){
      if(q.type==='recognition') return 'Word: <b>'+Utils.escapeHtml(q.prompt)+'</b>';
      if(q.type==='cloze') return Utils.escapeHtml(q.prompt).replace('_____','<span class="blank">_____</span>');
      return Utils.escapeHtml(q.prompt);
    }

    const gradeLine = result.correct
      ? 'Grade given: <b>'+(result.rating==='easy'?'⚡ Easy':'😅 Hard')+'</b>'
      : 'Marked as: <b>Again</b>'+(result.category?' · Error category: <b>'+Utils.escapeHtml(result.category)+'</b>':'');

    el.innerHTML =
      '<div class="practice-wrap">' +
      '<div class="practice-progress">Item '+(s.idx+1)+' of '+s.queue.length+' <span class="badge" style="margin-left:8px;">Reviewing previous card</span></div>' +
      '<div class="practice-card">' +
      '<div class="practice-level">Level '+q.level+' · '+levelName(q.level)+(q.drillType?' · Drill: '+q.drillType:'')+'</div>' +
      '<div class="reveal-word-row">'+Utils.escapeHtml(word.word)+
        (word.pronunciation ? ' <span class="pronunciation">('+Utils.escapeHtml(word.pronunciation)+')</span>' : '') +
        ' <button type="button" class="speak-btn small" data-word="'+Utils.escapeHtml(word.word)+'" title="Listen">🔊</button></div>' +
      '<div class="practice-sub">'+Utils.escapeHtml(q.promptTitle||'')+'</div>' +
      '<div class="practice-prompt">'+renderPrompt(q)+'</div>' +
      '<div class="self-check">' +
      '<div><b>Your answer:</b> '+Utils.escapeHtml(result.userVal || '(empty)')+'</div>' +
      '<div><b>Meaning:</b> '+Utils.escapeHtml(word.meaning||'—')+'</div>' +
      '<div><b>Collocations:</b> '+Utils.escapeHtml((word.collocations||[]).join(', ')||'—')+'</div>' +
      (word.contexts && word.contexts.length ? '<div><b>Context:</b> '+Utils.escapeHtml(word.contexts[0])+'</div>' : '') +
      '</div>' +
      '<div class="feedback '+(result.correct?'correct':'incorrect')+'" style="margin-top:12px;">' + (result.correct?'✓ Correct':'✗ Not quite') +
      (!result.correct ? '<div class="correct-answer">Correct: '+Utils.escapeHtml(q.correctAnswer || word.word)+'</div>' : '') +
      '</div>' +
      '<div class="practice-sub" style="margin-top:8px;">'+gradeLine+'</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn primary" id="returnCurrentBtn">Return to current card</button></div>' +
      '</div></div>';

    el.querySelector('#returnCurrentBtn').addEventListener('click', ()=>{
      Practice.returnToCurrent();
      this.renderPracticeCard();
    });
  },

  offerHint(q, wrongVal, answerArea){
    const s = Practice.session;
    s.hintUsed = true;
    const answer = q.correctAnswer;
    const hint = answer[0] + '_'.repeat(Math.max(1,answer.length-1));
    answerArea.innerHTML = '<div class="feedback incorrect">Not quite. One more try with a hint:</div>' +
      '<div class="answer-input"><div style="font-family:var(--mono);font-size:20px;letter-spacing:3px;margin-bottom:10px;">'+Utils.escapeHtml(hint)+'</div>' +
      '<input type="text" id="answerInput2" autocomplete="off" spellcheck="false" placeholder="Type your answer…">' +
      '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="submitBtn2">Check</button></div></div>';
    const input = answerArea.querySelector('#answerInput2');
    input.focus();
    const submit = ()=>{
      const val = input.value.trim();
      if(!val) return;
      input.disabled = true;
      const correct = Practice.grade(q, val);
      this.handleGraded(q, correct, val, true);
    };
    answerArea.querySelector('#submitBtn2').addEventListener('click', submit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
  },

  showSelfCheck(question, userText, answerArea){
    const word = question.word;
    answerArea.innerHTML =
      '<div class="reveal-word-row">'+Utils.escapeHtml(word.word)+
      (word.pronunciation ? ' <span class="pronunciation">('+Utils.escapeHtml(word.pronunciation)+')</span>' : '') +
      ' <button type="button" class="speak-btn small" data-word="'+Utils.escapeHtml(word.word)+'" title="Listen">🔊</button></div>' +
      '<div class="feedback"><b>Your sentence:</b><div style="margin-top:4px;">'+Utils.escapeHtml(userText || '(empty)')+'</div></div>' +
      '<div class="self-check">' +
      '<div><b>Meaning:</b> '+Utils.escapeHtml(word.meaning||'—')+'</div>' +
      '<div><b>Collocations:</b> '+Utils.escapeHtml(word.collocations.join(', ')||'—')+'</div>' +
      '<div><b>Grammar:</b> '+Utils.escapeHtml(word.grammar||'—')+'</div>' +
      '<div><b>Contrast:</b> '+Utils.escapeHtml(word.contrast||'—')+'</div>' +
      '<div><b>Register/context fit:</b> does it match a typical context?</div>' +
      '</div>' +
      '<div class="practice-sub" style="margin-top:12px;">Did you use "'+Utils.escapeHtml(word.word)+'" correctly and naturally?</div>' +
      '<div class="rating-row"><button class="btn good" id="selfYesBtn">Yes, correct</button><button class="btn bad" id="selfNoBtn">No, needs work</button></div>';
    answerArea.querySelector('#selfYesBtn').addEventListener('click', ()=>this.handleGraded(question, true, userText));
    answerArea.querySelector('#selfNoBtn').addEventListener('click', ()=>this.handleGraded(question, false, userText));
  },

  handleGraded(question, correct, userVal, hintWasUsed){
    const word = question.word;
    const s = Practice.session;
    const feedbackArea = document.getElementById('feedbackArea');
    let fbHtml = '<div class="feedback '+(correct?'correct':'incorrect')+'">' + (correct?'✓ Correct':'✗ Not quite');
    if(!correct){
      fbHtml += '<div class="correct-answer">Correct: '+Utils.escapeHtml(question.correctAnswer || word.word) +
        (word.pronunciation ? ' <span class="pronunciation">('+Utils.escapeHtml(word.pronunciation)+')</span>' : '') +
        ' <button type="button" class="speak-btn small" data-word="'+Utils.escapeHtml(word.word)+'" title="Listen">🔊</button></div>';
      if(question.correctAnswer && userVal){
        const dist = Utils.levenshtein(Utils.normalize(userVal), Utils.normalize(question.correctAnswer));
        if(dist>0 && dist<=2) fbHtml += '<div class="field-hint">Close — looks like it may be a spelling slip.</div>';
      }
    }
    if(question.autoGrade){
      if(word.meaning) fbHtml += '<div class="field-hint">Meaning: '+Utils.escapeHtml(word.meaning)+'</div>';
      if(word.collocations.length) fbHtml += '<div class="field-hint">Collocations: '+Utils.escapeHtml(word.collocations.join(', '))+'</div>';
    }
    fbHtml += '</div>';

    if(!correct){
      fbHtml += '<div class="practice-sub" style="margin-top:12px;">What kind of error was this?</div>' +
        '<div class="error-cats">' + ERROR_CATEGORIES.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('') + '</div>' +
        '<div class="btn-row" style="justify-content:center;margin-top:14px;"><button class="btn primary" id="continueBtn" disabled>Continue</button></div>';
    } else {
      fbHtml += '<div class="practice-sub" style="margin-top:12px;">How did that feel?</div>' +
        '<div class="rating-row"><button class="btn warn" id="hardBtn">😅 Hard (effortful)</button><button class="btn good" id="easyBtn">⚡ Easy (fluent)</button></div>';
    }
    feedbackArea.innerHTML = fbHtml;

    if(!correct){
      let chosenCat = null;
      const contBtn = feedbackArea.querySelector('#continueBtn');
      feedbackArea.querySelectorAll('.error-cats button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          feedbackArea.querySelectorAll('.error-cats button').forEach(b=>b.classList.remove('picked'));
          btn.classList.add('picked');
          chosenCat = btn.dataset.c;
          contBtn.disabled = false;
        });
      });
      contBtn.addEventListener('click', ()=>{
        WordModel.logAttempt(word, question.level, false, { rating:'again', errorCategory: chosenCat });
        WordModel.logError(word, chosenCat, question.level);
        if(question.track==='fsrs'){
          Practice.gradeFsrs(word, question.dimension, 'again');
        } else {
          WordModel.updateLadder(word, question.level, false);
          WordModel.applyRating(word, 'again');
        }
        Storage.save();
        s.results.push({ idx: s.idx, word, question, userVal, correct:false, category: chosenCat });
        s.idx++;
        Practice.persist();
        this.renderPracticeCard();
      });
    } else {
      const finish = (rating)=>{
        WordModel.logAttempt(word, question.level, true, { rating });
        if(question.track==='fsrs'){
          Practice.gradeFsrs(word, question.dimension, rating);
        } else {
          WordModel.updateLadder(word, question.level, true);
          WordModel.applyRating(word, rating);
        }
        this.recordDimForQuestion(question, true);
        Storage.save();
        s.results.push({ idx: s.idx, word, question, userVal, correct:true, rating });
        s.idx++;
        Practice.persist();
        this.renderPracticeCard();
      };
      feedbackArea.querySelector('#hardBtn').addEventListener('click', ()=>finish('hard'));
      feedbackArea.querySelector('#easyBtn').addEventListener('click', ()=>finish('easy'));
    }
  },

  recordDimForQuestion(question, success){
    const word = question.word;
    if(question.type==='recognition') DimModel.record(word, 'meaningRecognition', success);
    else if(question.type==='cued'){ DimModel.record(word, 'meaningRecall', success); DimModel.record(word, 'formRecall', success); }
    else if(question.type==='cloze') DimModel.record(word, 'contextualComprehension', success);
    else if(question.type==='drill') DimModel.record(word, 'novelApplication', success);
    else if(question.type==='production') DimModel.record(word, 'independentProduction', success);
  }
};

/* ============================== MODAL ============================== */
const Modal = {
  show(title, bodyHtml, onMount){
    const root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal"><h2>'+title+'</h2><div>'+bodyHtml+'</div></div></div>';
    if(onMount) onMount(root.querySelector('.modal'));
    root.querySelector('#modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') this.close(); });
  },
  close(){ document.getElementById('modalRoot').innerHTML=''; },
  confirm(msg, onYes){
    this.show('Confirm', '<p>'+Utils.escapeHtml(msg)+'</p><div class="btn-row"><button class="btn bad small" id="yesBtn">Yes, proceed</button><button class="btn ghost small" id="noBtn">Cancel</button></div>', (m)=>{
      m.querySelector('#yesBtn').addEventListener('click', ()=>{ this.close(); onYes(); });
      m.querySelector('#noBtn').addEventListener('click', ()=>this.close());
    });
  }
};

/* ============================== WEEKLY WRITING AUDIT ============================== */
const Audit = {
  essayText: '',
  tags: [], // {id, start, end, quoted, word, category, correction}
  container: null,

  render(container){
    this.container = container;
    this.draw();
  },

  draw(){
    const el = this.container;
    el.innerHTML =
      '<div class="card"><h2>📝 Weekly Writing Audit</h2>' +
      '<p class="field-hint">Paste an essay or paragraph you wrote. Select any weak or incorrect vocabulary usage, tag it with an error category and a corrected version, then generate targeted review items.</p>' +
      '<label>Your writing</label>' +
      '<textarea id="essayInput" rows="10" placeholder="Paste your essay or paragraph here…">'+Utils.escapeHtml(this.essayText)+'</textarea>' +
      '<div class="btn-row" style="margin-top:10px;">' +
      '<button type="button" class="btn primary small" id="tagSelBtn">🏷 Tag Selected Text</button>' +
      '<button type="button" class="btn ghost small" id="clearEssayBtn">Clear</button>' +
      '</div></div>' +
      (this.tags.length ? this.renderTagList() : '') +
      '<div class="card">' +
      '<div class="btn-row"><button type="button" class="btn good" id="createReviewBtn" '+(this.tags.length?'':'disabled')+'>✓ Create Review Items ('+this.tags.length+')</button></div>' +
      '<p class="field-hint" style="margin-top:8px;">Each tagged error is classified into one of the seven categories (Meaning, Form, Spelling, Grammar, Collocation, Register, Selection) and fed into the same error-diagnosis system and mastery dimensions used by Practice and the Teaching Phase.</p>' +
      '</div>';

    const textarea = el.querySelector('#essayInput');
    textarea.addEventListener('input', ()=>{ this.essayText = textarea.value; });
    el.querySelector('#tagSelBtn').addEventListener('click', ()=>{
      const start = textarea.selectionStart, end = textarea.selectionEnd;
      if(start===end){ Utils.toast('Select some text in your writing first.'); return; }
      const quoted = textarea.value.slice(start,end);
      this.openTagModal(start,end,quoted);
    });
    el.querySelector('#clearEssayBtn').addEventListener('click', ()=>{
      if(!this.essayText && this.tags.length===0) return;
      Modal.confirm('Clear the writing and all tags?', ()=>{
        this.essayText=''; this.tags=[]; this.draw();
      });
    });
    el.querySelectorAll('.tag-remove-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        this.tags = this.tags.filter(t=>t.id!==btn.dataset.id);
        this.draw();
      });
    });
    const createBtn = el.querySelector('#createReviewBtn');
    if(createBtn) createBtn.addEventListener('click', ()=>this.createReviewItems());
  },

  renderTagList(){
    return '<div class="card"><h3>Tagged Errors ('+this.tags.length+')</h3>' +
      this.tags.map(t=>
        '<div class="tag-item">' +
        '<div><span class="quoted">'+Utils.escapeHtml(t.quoted)+'</span><span class="arrow">→</span><span class="corrected">'+Utils.escapeHtml(t.correction)+'</span></div>' +
        '<div class="meta-row"><span class="badge">'+t.category+'</span><span class="field-hint">word: '+Utils.escapeHtml(t.word)+'</span>' +
        '<button type="button" class="btn ghost small tag-remove-btn" data-id="'+t.id+'">Remove</button></div>' +
        '</div>'
      ).join('') + '</div>';
  },

  openTagModal(start,end,quoted){
    const guessWord = (quoted.trim().split(/\s+/)[0]||'').replace(/[^A-Za-z'-]/g,'');
    Modal.show('Tag Vocabulary Error',
      '<p class="field-hint">Selected: &ldquo;'+Utils.escapeHtml(quoted)+'&rdquo;</p>' +
      '<label>Vocabulary word</label><input type="text" id="tagWordInput" value="'+Utils.escapeHtml(guessWord)+'">' +
      '<label>Error category</label><div class="error-cats" id="tagCats">'+ERROR_CATEGORIES.map(c=>'<button type="button" data-c="'+c+'">'+c+'</button>').join('')+'</div>' +
      '<label>Corrected version</label><textarea id="tagCorrection" placeholder="What should it have said?"></textarea>' +
      '<div id="tagModalErr" class="field-error"></div>' +
      '<div class="btn-row" style="margin-top:14px;"><button type="button" class="btn primary small" id="saveTagBtn">Save Tag</button><button type="button" class="btn ghost small" id="cancelTagBtn">Cancel</button></div>',
      (m)=>{
        let cat = null;
        m.querySelectorAll('#tagCats button').forEach(b=>{
          b.addEventListener('click', ()=>{
            m.querySelectorAll('#tagCats button').forEach(x=>x.classList.remove('picked'));
            b.classList.add('picked'); cat = b.dataset.c;
          });
        });
        m.querySelector('#cancelTagBtn').addEventListener('click', ()=>Modal.close());
        m.querySelector('#saveTagBtn').addEventListener('click', ()=>{
          const word = m.querySelector('#tagWordInput').value.trim();
          const correction = m.querySelector('#tagCorrection').value.trim();
          const errEl = m.querySelector('#tagModalErr');
          if(!word){ errEl.textContent='Enter the vocabulary word this error is about.'; return; }
          if(!cat){ errEl.textContent='Choose an error category.'; return; }
          if(!correction){ errEl.textContent='Enter the corrected version.'; return; }
          this.tags.push({ id: Utils.uid(), start, end, quoted, word, category: cat, correction });
          Modal.close();
          this.draw();
        });
      });
  },

  createReviewItems(){
    if(this.tags.length===0) return;
    const matchedCount = { n:0 };
    const unmatched = [];
    this.tags.forEach(t=>{
      const w = WordModel.findByText(t.word);
      if(w){ ErrorIntegration.recordProductionError(w, t.category, 'audit-review'); matchedCount.n++; }
      else unmatched.push(t);
    });
    Storage.state.writingLog.push({
      ts: Date.now(), date: Utils.todayISO(), text: this.essayText,
      errors: this.tags.map(t=>({ quoted:t.quoted, word:t.word, category:t.category, correction:t.correction, matched: !!WordModel.findByText(t.word) }))
    });
    Storage.save();

    this.tags = [];
    this.draw();

    Utils.toast(matchedCount.n ? (matchedCount.n+' word(s) scheduled for targeted retrieval practice.') : 'Review items processed.');

    if(unmatched.length) this.promptAddUnmatched(unmatched);
  },

  promptAddUnmatched(unmatched){
    const uniqueWords = [];
    const seen = new Set();
    unmatched.forEach(t=>{ const k=Utils.normalize(t.word); if(!seen.has(k)){ seen.add(k); uniqueWords.push(t.word); } });
    Modal.show('New Words Found',
      '<p class="field-hint">These tagged words aren\'t in your bank yet. Add one to start its Teaching Phase.</p>' +
      '<div class="btn-row" style="flex-direction:column;align-items:stretch;">' +
      uniqueWords.map(w=>'<button type="button" class="btn ghost small add-unmatched-btn" data-w="'+Utils.escapeHtml(w)+'">＋ Add "'+Utils.escapeHtml(w)+'"</button>').join('') +
      '</div><div class="btn-row" style="margin-top:10px;"><button type="button" class="btn ghost small" id="closeUnmatchedBtn">Close</button></div>',
      (m)=>{
        m.querySelectorAll('.add-unmatched-btn').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            Modal.close();
            App.showTab('add');
            Views.renderAddForm({ word: btn.dataset.w, wordType:'general', meaning:'', form:'', grammar:'', collocations:[], contrast:'', contexts:[], production:'', mnemonic:'', pronunciation:'', cloze:[] });
          });
        });
        m.querySelector('#closeUnmatchedBtn').addEventListener('click', ()=>Modal.close());
      });
  }
};

/* ============================== TIMED EXAM DEPLOYMENT ============================== */
const Exam = {
  PRESETS: [
    'Discuss the advantages and disadvantages of remote work for young professionals.',
    'Describe a time you had to make a difficult decision under pressure.',
    'Argue for or against the increasing use of social media in schools.',
    'Explain how technology has changed the way people communicate with one another.',
    'Discuss whether cities should prioritize public transportation over private cars.'
  ],
  status: 'config', // config | running | review | done
  prompt: '',
  minutes: 20,
  targetWords: [],
  text: '',
  remainingSec: 0,
  timerHandle: null,
  checklist: {}, // wordId -> {outcome, category}
  lastRecord: null,
  container: null,

  render(container){
    this.container = container;
    if(!this.prompt) this.prompt = Utils.pick(this.PRESETS);
    if(this.status==='config') this.drawConfig();
    else if(this.status==='running') this.drawRunning();
    else if(this.status==='review') this.drawReview();
    else this.drawDone();
  },

  computeTargetPool(){
    const eligible = Storage.state.words.filter(w=> w.teaching && w.teaching.completed &&
      w.dims.independentProduction && w.dims.independentProduction.success>=1 &&
      !WordModel.hasRecentError(w,7));
    return Utils.shuffle(eligible).slice(0,8);
  },

  drawConfig(){
    const pool = this.computeTargetPool();
    this.targetWords = pool;
    const el = this.container;
    const presetMinutes = [15,20,30,45];
    el.innerHTML = '<div class="card"><h2>⏱ Timed Exam Deployment</h2>' +
      '<p class="field-hint">Simulate exam conditions: a prompt, a time limit, and target words pulled from your stable vocabulary. You don\'t have to use every word — write naturally.</p>' +
      '<label>Writing prompt</label><textarea id="examPromptInput" rows="2">'+Utils.escapeHtml(this.prompt)+'</textarea>' +
      '<div class="btn-row" style="margin-top:6px;"><button type="button" class="btn ghost small" id="shufflePromptBtn">🎲 New Prompt</button></div>' +
      '<label>Time limit (minutes)</label>' +
      '<div class="btn-row">' + presetMinutes.map(m=>'<button type="button" class="btn '+(this.minutes===m?'primary':'ghost')+' small min-btn" data-m="'+m+'">'+m+'</button>').join('') +
      '<input type="number" id="customMinutes" min="1" max="180" placeholder="Custom" style="width:90px;" value="'+(presetMinutes.includes(this.minutes)?'':this.minutes)+'">' +
      '</div>' +
      '<label>Target vocabulary '+(pool.length? '('+pool.length+' selected — stable, no recent errors)':'')+'</label>' +
      (pool.length ? '<div>'+pool.map(w=>'<span class="target-word-chip">'+Utils.escapeHtml(w.word)+'</span>').join('')+'</div>' :
        '<div class="banner warn">⚠️ Not enough stable words yet (need Independent Production practice with no error in the last 7 days). You can still start with no target words, or teach/practice more words first.</div>') +
      (pool.length ? '<div class="btn-row" style="margin-top:6px;"><button type="button" class="btn ghost small" id="reshuffleBtn">🔄 Reshuffle Words</button></div>' : '') +
      '<div class="btn-row" style="margin-top:16px;"><button type="button" class="btn primary" id="startExamBtn">▶ Start Exam</button></div>' +
      '</div>';

    el.querySelector('#examPromptInput').addEventListener('input', (e)=>{ this.prompt = e.target.value; });
    el.querySelector('#shufflePromptBtn').addEventListener('click', ()=>{ this.prompt = Utils.pick(this.PRESETS); this.drawConfig(); });
    el.querySelectorAll('.min-btn').forEach(b=>b.addEventListener('click', ()=>{ this.minutes = +b.dataset.m; this.drawConfig(); }));
    el.querySelector('#customMinutes').addEventListener('input', (e)=>{ const v=+e.target.value; if(v>0) this.minutes = v; });
    const reshuffleBtn = el.querySelector('#reshuffleBtn');
    if(reshuffleBtn) reshuffleBtn.addEventListener('click', ()=>this.drawConfig());
    el.querySelector('#startExamBtn').addEventListener('click', ()=>this.start());
  },

  start(){
    if(!this.prompt.trim()){ Utils.toast('Enter a writing prompt first.'); return; }
    this.status='running';
    this.text='';
    this.remainingSec = Math.round(this.minutes*60);
    this.checklist = {};
    this.targetWords.forEach(w=>{ this.checklist[w.id] = { outcome:null, category:null }; });
    this.drawRunning();
    this.timerHandle = setInterval(()=>this.tick(), 1000);
  },

  tick(){
    this.remainingSec--;
    const display = document.getElementById('examTimerDisplay');
    if(display){
      display.textContent = this.fmtTime(this.remainingSec);
      display.classList.toggle('low', this.remainingSec<=60);
    }
    if(this.remainingSec<=0){
      clearInterval(this.timerHandle); this.timerHandle=null;
      this.finishWriting();
    }
  },

  fmtTime(sec){
    sec = Math.max(0,sec);
    const m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },

  drawRunning(){
    const el = this.container;
    el.innerHTML = '<div class="card">' +
      '<div class="exam-timer" id="examTimerDisplay">'+this.fmtTime(this.remainingSec)+'</div>' +
      '<div class="teach-box"><h4>Prompt</h4><div>'+Utils.escapeHtml(this.prompt)+'</div></div>' +
      (this.targetWords.length ? '<label>Target vocabulary <span class="opt">(use naturally — not required)</span></label><div>'+this.targetWords.map(w=>'<span class="target-word-chip">'+Utils.escapeHtml(w.word)+'</span>').join('')+'</div>' : '') +
      '<label>Your writing</label><textarea id="examTextArea" rows="14" placeholder="Start writing…">'+Utils.escapeHtml(this.text)+'</textarea>' +
      '<div class="btn-row" style="margin-top:10px;"><button type="button" class="btn bad" id="finishNowBtn">Finish Now</button></div>' +
      '</div>';
    const ta = el.querySelector('#examTextArea');
    ta.addEventListener('input', ()=>{ this.text = ta.value; });
    ta.focus();
    el.querySelector('#finishNowBtn').addEventListener('click', ()=>{
      Modal.confirm('Finish the exam now? The timer will stop and you\'ll move to the review checklist.', ()=>{
        clearInterval(this.timerHandle); this.timerHandle=null;
        this.finishWriting();
      });
    });
  },

  finishWriting(){
    this.status='review';
    this.render(this.container);
  },

  drawReview(){
    const el = this.container;
    let html = '<div class="card"><h2>Time\'s Up — Review</h2>' +
      '<p class="field-hint">Writing area is now locked. For each target word, mark how it went — "Did not use" is not an error.</p>' +
      '<div class="essay-preview">'+Utils.escapeHtml(this.text || '(nothing written)')+'</div></div>';

    if(this.targetWords.length===0){
      html += '<div class="card"><p class="field-hint">No target words were assigned to this exam.</p>' +
        '<button type="button" class="btn primary" id="submitReviewBtn">Finish</button></div>';
    } else {
      html += '<div class="card">' + this.targetWords.map(w=>{
        const c = this.checklist[w.id];
        return '<div class="checklist-item" data-id="'+w.id+'">' +
          '<div class="w">'+Utils.escapeHtml(w.word)+'</div>' +
          '<div class="checklist-row">' +
          '<button type="button" class="outcome-btn '+(c.outcome==='correct'?'picked-correct':'')+'" data-o="correct">✓ Used correctly</button>' +
          '<button type="button" class="outcome-btn '+(c.outcome==='incorrect'?'picked-incorrect':'')+'" data-o="incorrect">✗ Used incorrectly</button>' +
          '<button type="button" class="outcome-btn '+(c.outcome==='none'?'picked-none':'')+'" data-o="none">— Did not use</button>' +
          '</div>' +
          '<div class="cat-wrap" style="margin-top:10px;'+(c.outcome==='incorrect'?'':'display:none;')+'">' +
          '<div class="error-cats">' + ERROR_CATEGORIES.map(cat=>'<button type="button" data-c="'+cat+'" class="'+(c.category===cat?'picked':'')+'">'+cat+'</button>').join('') + '</div>' +
          '</div></div>';
      }).join('') +
      '<div class="btn-row" style="margin-top:10px;"><button type="button" class="btn primary" id="submitReviewBtn" disabled>Submit Review</button></div>' +
      '</div>';
    }
    el.innerHTML = html;

    const submitBtn = el.querySelector('#submitReviewBtn');
    const checkReady = ()=>{
      const ready = this.targetWords.every(w=>{
        const c = this.checklist[w.id];
        if(!c.outcome) return false;
        if(c.outcome==='incorrect' && !c.category) return false;
        return true;
      });
      if(submitBtn) submitBtn.disabled = !ready;
    };
    el.querySelectorAll('.checklist-item').forEach(item=>{
      const wid = item.dataset.id;
      item.querySelectorAll('.outcome-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          this.checklist[wid].outcome = btn.dataset.o;
          if(btn.dataset.o!=='incorrect') this.checklist[wid].category = null;
          this.drawReview();
        });
      });
      item.querySelectorAll('.cat-wrap button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          this.checklist[wid].category = btn.dataset.c;
          this.drawReview();
        });
      });
    });
    checkReady();
    if(this.targetWords.length===0){
      el.querySelector('#submitReviewBtn').addEventListener('click', ()=>this.submitReview());
    } else if(submitBtn){
      submitBtn.addEventListener('click', ()=>this.submitReview());
    }
  },

  submitReview(){
    const record = { ts: Date.now(), date: Utils.todayISO(), prompt: this.prompt, minutes: this.minutes, text: this.text, targetWords: [] };
    this.targetWords.forEach(w=>{
      const c = this.checklist[w.id];
      record.targetWords.push({ word: w.word, wordId: w.id, outcome: c.outcome, category: c.category||null });
      if(c.outcome==='correct') ErrorIntegration.recordProductionSuccess(w, 'timed-exam');
      else if(c.outcome==='incorrect') ErrorIntegration.recordProductionError(w, c.category, 'timed-exam');
      // 'none' (did not use): no mastery change, no error logged
    });
    Storage.state.examLog.push(record);
    Storage.save();
    this.status='done';
    this.lastRecord = record;
    this.render(this.container);
  },

  drawDone(){
    const r = this.lastRecord;
    const correct = r.targetWords.filter(t=>t.outcome==='correct').length;
    const incorrect = r.targetWords.filter(t=>t.outcome==='incorrect').length;
    const notUsed = r.targetWords.filter(t=>t.outcome==='none').length;
    this.container.innerHTML = '<div class="card center"><h2>🎉 Exam Reviewed</h2>' +
      '<div class="grid" style="margin:14px 0;">' +
      '<div class="stat good"><div class="num">'+correct+'</div><div class="label">Used Correctly</div></div>' +
      '<div class="stat bad"><div class="num">'+incorrect+'</div><div class="label">Used Incorrectly</div></div>' +
      '<div class="stat"><div class="num">'+notUsed+'</div><div class="label">Not Used</div></div>' +
      '</div>' +
      (incorrect ? '<p class="field-hint">'+incorrect+' word(s) were scheduled for targeted retrieval practice.</p>' : '') +
      '<button type="button" class="btn primary" id="newExamBtn">Start Another Exam</button></div>';
    this.container.querySelector('#newExamBtn').addEventListener('click', ()=>{
      this.status='config'; this.prompt=''; this.text=''; this.checklist={};
      this.render(this.container);
    });
  }
};

  buildLearningProgressData(){
    const words = Storage.state.words;
    const createdDates = words.map(w=>w.created).filter(Boolean).sort();
    const today = Utils.todayISO();
    const earliest = createdDates[0] || today;
    const spanDays = Utils.diffDays(earliest, today);
    const start = spanDays < 29 ? earliest : Utils.addDays(today, -29);
    const labels = [], data = [];
    let cursor = start;
    let guard = 0;
    while(cursor <= today && guard < 400){
      labels.push(cursor);
      data.push(words.filter(w=>w.created<=cursor).length);
      cursor = Utils.addDays(cursor, 1);
      guard++;
    }
    return { labels, data };
  },

const Session = {
  active: false,
  phase: 0,
  phases: ['Retrieval Review','New Vocabulary','Context / Production','Error Review'],
  log: { reviewed:0, correct:0, newAdded:0, errors:0 },

  start(){
    this.active = true; this.phase = 0;
    this.log = { reviewed:0, correct:0, newAdded:0, errors:0 };

    this.renderPhase();
  },

  renderPhase(){
    const el = document.getElementById('view-practice');
    const nav = '<div class="session-phase-nav">' + this.phases.map((p,i)=>
      '<span class="dot '+(i<this.phase?'done':i===this.phase?'active':'')+'"></span>').join('') + '</div>';

    if(this.phase===0){
      const queue = Practice.buildDueQueue({includeNew:false});
      el.innerHTML = '<div class="practice-wrap">'+nav+'<div class="card center"><h2>Phase 1 · Retrieval Review</h2>' +
        '<p class="field-hint">'+queue.length+' word(s) due or overdue. Aim for ~10–15 minutes.</p>' +
        '<div class="btn-row" style="justify-content:center;">' +
        (queue.length ? '<button class="btn primary" id="beginBtn">Begin</button>' : '') +
        '<button class="btn ghost" id="skipBtn">'+(queue.length?'Skip Phase':'Nothing due — Continue')+'</button></div></div></div>';
      el.querySelector('#skipBtn').addEventListener('click', ()=>this.nextPhase());
      const b = el.querySelector('#beginBtn');
      if(b) b.addEventListener('click', ()=>{
        Practice.session = { queue, idx:0, results:[], mode:'session' };
        Practice.persist();
        Views.renderPracticeCard();
      });
    } else if(this.phase===1){
      el.innerHTML = '<div class="practice-wrap">'+nav+'<div class="card center"><h2>Phase 2 · New Vocabulary</h2>' +
        '<p class="field-hint">Add as many (or as few) new words as feels right — there\'s no fixed quota. Build a full Production Record for each.</p>' +
        '<div class="btn-row" style="justify-content:center;"><button class="btn primary" id="addNowBtn">Add a Word</button><button class="btn ghost" id="contBtn">Continue to Next Phase</button></div>' +
        '<div class="field-hint" style="margin-top:10px;">Added this session: '+this.log.newAdded+'</div></div></div>';
      el.querySelector('#addNowBtn').addEventListener('click', ()=>{
        App.currentTab='add';
        document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
        document.getElementById('view-add').classList.add('active');
        document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='add'));
        Views.renderAddForm();
        const origRenderBeginTeaching = Views.renderBeginTeaching.bind(Views);
        const origHandler = Views.handleSaveWord.bind(Views);
        const backToSession = ()=>{
          Views.handleSaveWord = origHandler;
          Views.renderBeginTeaching = origRenderBeginTeaching;
          App.currentTab='practice';
          document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
          document.getElementById('view-practice').classList.add('active');
          document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='practice'));
          Session.renderPhase();
        };
        Views.handleSaveWord = function(form, existing){
          const before = Storage.state.words.length;
          origHandler(form, existing);
          if(Storage.state.words.length>before) Session.log.newAdded++;
        };
        Views.renderBeginTeaching = function(words, onAllComplete){
          origRenderBeginTeaching(words, backToSession);
        };
      });
      el.querySelector('#contBtn').addEventListener('click', ()=>this.nextPhase());
    } else if(this.phase===2){
      const queue = Practice.buildProductionQueue(6);
      el.innerHTML = '<div class="practice-wrap">'+nav+'<div class="card center"><h2>Phase 3 · Context / Production</h2>' +
        '<p class="field-hint">'+queue.length+' drill(s) ready — varied contexts, collocations, and registers.</p>' +
        '<div class="btn-row" style="justify-content:center;">' +
        (queue.length?'<button class="btn primary" id="beginBtn">Begin</button>':'') +
        '<button class="btn ghost" id="skipBtn">'+(queue.length?'Skip Phase':'Continue')+'</button></div></div></div>';
      el.querySelector('#skipBtn').addEventListener('click', ()=>this.nextPhase());
      const b = el.querySelector('#beginBtn');
      if(b) b.addEventListener('click', ()=>{
        Practice.session = { queue, idx:0, results:[], mode:'session' };
        Practice.persist();
        Views.renderPracticeCard();
      });
    } else if(this.phase===3){
      const queue = Storage.state.words.filter(w=>{
        const today = Utils.todayISO();
        const erroredToday = Object.keys(w.errorCounts||{}).length>0 && Storage.state.errorLog.some(e=>e.wordId===w.id && e.date===today);
        if(!erroredToday) return false;
        const last = w.history[w.history.length-1];
        const resolvedSinceError = last && last.date===today && last.correct;
        return !resolvedSinceError;
      }).map(w=>({word:w, level:Math.max(2,w.levelState.level-1)}));
      el.innerHTML = '<div class="practice-wrap">'+nav+'<div class="card center"><h2>Phase 4 · Error Review</h2>' +
        '<p class="field-hint">'+queue.length+' word(s) had errors today — revisit at a slightly easier level to restore success.</p>' +
        '<div class="btn-row" style="justify-content:center;">' +
        (queue.length?'<button class="btn primary" id="beginBtn">Begin</button>':'') +
        '<button class="btn ghost" id="finishBtn">'+(queue.length?'Skip & Finish':'Finish Session')+'</button></div></div></div>';
      el.querySelector('#finishBtn').addEventListener('click', ()=>this.finish());
      const b = el.querySelector('#beginBtn');
      if(b) b.addEventListener('click', ()=>{
        Practice.session = { queue, idx:0, results:[], mode:'session' };
        Practice.persist();
        Views.renderPracticeCard();
      });
    }
  },

  finishPhase(results){
    results.forEach(r=>{ this.log.reviewed++; if(r.correct) this.log.correct++; else this.log.errors++; });
    if(this.phase===3){ this.finish(); }
    else this.nextPhase();
  },

  nextPhase(){
    this.phase++;
    if(this.phase>=this.phases.length){ this.finish(); return; }
    this.renderPhase();
  },

  finish(){
    this.active = false;
    Storage.state.sessionLog.push({ ts: Date.now(), date: Utils.todayISO(), summary: Object.assign({}, this.log) });
    Storage.save();
    const el = document.getElementById('view-practice');
    el.innerHTML = '<div class="card center"><h2>🎉 Session Complete</h2>' +
      '<div class="grid" style="margin:16px 0;">' +
      '<div class="stat"><div class="num">'+this.log.reviewed+'</div><div class="label">Items Reviewed</div></div>' +
      '<div class="stat good"><div class="num">'+this.log.correct+'</div><div class="label">Correct</div></div>' +
      '<div class="stat bad"><div class="num">'+this.log.errors+'</div><div class="label">Errors</div></div>' +
      '<div class="stat"><div class="num">'+this.log.newAdded+'</div><div class="label">Words Added</div></div>' +
      '</div><button class="btn primary" id="backBtn">Back to Dashboard</button></div>';
    el.querySelector('#backBtn').addEventListener('click', ()=>App.showTab('dashboard'));
  }
};

/* ============================== TEACHING PHASE ============================== */
function showTeachingView(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-teaching').classList.add('active');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
}

const STEP_NAMES = ['','Introduce the Word','Core Meaning','Contextual Examples','Guided Processing','Supported Retrieval','Constrained Production','Independent Production','Entering Retrieval'];

const Teaching = {
  state: null,
  queue: [],
  queueIdx: 0,
  onAllComplete: null,

  startQueue(words, onAllComplete){
    words = words.filter(Boolean);
    if(words.length===0){ if(onAllComplete) onAllComplete(); return; }
    this.queue = words.slice();
    this.queueIdx = 0;
    this.onAllComplete = onAllComplete;
    this._next();
  },

  _next(){
    if(this.queueIdx >= this.queue.length){
      const cb = this.onAllComplete;
      this.queue = []; this.queueIdx = 0; this.onAllComplete = null;
      if(cb) cb();
      return;
    }
    this.start(this.queue[this.queueIdx]);
  },

  start(word){
    const step = (word.teaching && word.teaching.currentStep) || 1;
    this.state = { word, step, retry:0, inputs:{} };
    word.teaching.currentStep = step;
    Storage.save();
    this.render();
  },

  goStep(n){
    this.state.step = n;
    this.state.retry = 0;
    this.state.word.teaching.currentStep = Math.max(this.state.word.teaching.currentStep||1, Math.min(n,8));
    Storage.save();
    this.render();
  },

  /* Navigates to the previous step. Cached generated content (state.stepXData) and
     typed input values (state.inputs) are preserved; word.teaching.currentStep only
     ever tracks the furthest step reached, so stepping back never re-opens skipping. */
  goBack(){
    if(!this.state || this.state.step<=1) return;
    this.goStep(this.state.step-1);
  },

  /* Restores a cached value into an input/textarea (if any was saved for `key`) and
     wires it to keep caching on every keystroke, so Back → Forward restores the text. */
  _cacheInput(el, key){
    if(!el) return;
    if(this.state.inputs[key]!=null) el.value = this.state.inputs[key];
    el.addEventListener('input', ()=>{ this.state.inputs[key] = el.value; });
  },

  finishWord(){
    const word = this.state.word;
    word.teaching.completed = true;
    word.teaching.currentStep = 8;
    word.srs.nextReview = Utils.todayISO();
    Storage.save();
    Utils.toast('"'+word.word+'" is ready for retrieval practice.');
    this.state = null;
    this.queueIdx++;
    this._next();
  },

  render(){
    showTeachingView();
    const el = document.getElementById('view-teaching');
    const s = this.state, word = s.word;
    const pct = Math.round(((Math.min(s.step,8)-1)/7)*100);
    let body = '';
    if(s.step===1) body = this.renderStep1();
    else if(s.step===2) body = this.renderStep2();
    else if(s.step===3) body = this.renderStep3();
    else if(s.step===4) body = this.renderStep4();
    else if(s.step===5) body = this.renderStep5();
    else if(s.step===6) body = this.renderStep6();
    else if(s.step===7) body = this.renderStep7();
    else body = this.renderCompletion();

    const queueNote = this.queue.length>1 ? ' · word '+(this.queueIdx+1)+' of '+this.queue.length : '';
    const showBack = s.step>1;
    const backRow = showBack ? '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button type="button" class="btn ghost small" id="teachBackBtn">← Back</button></div>' : '';
    el.innerHTML = '<div class="practice-wrap">' +
      '<div class="step-progress-wrap"><div class="practice-progress">Teaching &ldquo;'+Utils.escapeHtml(word.word)+'&rdquo;'+queueNote+' — Step '+Math.min(s.step,8)+' of 8: '+STEP_NAMES[Math.min(s.step,8)]+'</div>' +
      '<div class="step-progress-track"><div class="step-progress-fill" style="width:'+pct+'%"></div></div></div>' +
      '<div class="practice-card" id="teachCard">' + body + backRow + '</div></div>';
    this._wireCurrentStep();
    if(showBack){
      const backBtn = document.getElementById('teachBackBtn');
      if(backBtn) backBtn.addEventListener('click', ()=>this.goBack());
    }
  },

  /* ---- Step 1: Introduce ---- */
  renderStep1(){
    const word = this.state.word;
    let note = '';
    if(word.wordType==='concreteNoun') note = '<div class="teach-note">🖼️ Before continuing, picture a typical example of "'+Utils.escapeHtml(word.word)+'" in your mind.</div>';
    else if(word.wordType==='polysemous') note = '<div class="teach-note">This word has more than one sense. This lesson focuses on one specific sense — others exist but aren\'t the focus here.</div>';
    else if(word.wordType==='nearSynonym') note = '<div class="teach-note">This word has close near-synonyms — pay special attention to the Contrast in the next step.</div>';
    return '<div class="teach-step-label">Step 1 · Introduce the Word</div>' +
      '<div class="teach-headword-row">' +
      '<div class="teach-headword">'+Utils.escapeHtml(word.word)+'</div>' +
      (word.pronunciation ? '<span class="pronunciation">('+Utils.escapeHtml(word.pronunciation)+')</span>' : '') +
      '<button type="button" class="speak-btn" data-word="'+Utils.escapeHtml(word.word)+'" title="Listen">🔊</button>' +
      '</div>' +
      '<div class="teach-sub">'+Utils.escapeHtml(word.form||'(part of speech / word family not recorded)')+'</div>' +
      note +
      '<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn primary" id="nextBtn">Continue</button></div>';
  },

  /* ---- Step 2: Core meaning ---- */
  renderStep2(){
    const word = this.state.word;
    const contrastBox = word.contrast ? '<div class="teach-box contrast"><h4>Contrast</h4><div>'+Utils.escapeHtml(word.contrast)+'</div></div>' : '';
    return '<div class="teach-step-label">Step 2 · Core Meaning</div>' +
      '<div class="teach-headword" style="font-size:20px;">'+Utils.escapeHtml(word.word)+'</div>' +
      '<div class="teach-box emph"><h4>Core Meaning</h4><div style="font-size:15px;font-weight:600;">'+Utils.escapeHtml(word.meaning)+'</div></div>' +
      contrastBox +
      (word.wordType==='abstractVerb' ? '<div class="teach-note">Abstract words like this are learned through definition + contrast + grammar, not imagery — focus on the boundary above.</div>' : '') +
      '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="nextBtn">Continue</button></div>';
  },

  /* ---- Step 3: Contextual examples ---- */
  renderStep3(){
    const word = this.state.word;
    const contexts = word.contexts.map(c=>'<li>'+Utils.escapeHtml(c)+'</li>').join('');
    const colloc = word.collocations.length ? '<div class="teach-box"><h4>Collocations</h4><div>'+word.collocations.map(c=>'<span class="badge" style="margin:2px;">'+Utils.escapeHtml(c)+'</span>').join(' ')+'</div></div>' : '';
    const sentences = (word.cloze||[]).concat(word.production ? [word.production] : []).filter(Boolean);
    const wb = new RegExp('\\b'+Utils.escapeRegex(word.word)+'\\b','ig');
    const examples = sentences.length ? '<div class="teach-box"><h4>Example Sentences</h4><ul class="teach-list">' +
      sentences.map(s=>'<li>'+Utils.escapeHtml(s).replace(wb, m=>'<b>'+m+'</b>')+'</li>').join('') + '</ul></div>' : '';
    return '<div class="teach-step-label">Step 3 · Contextual Examples</div>' +
      '<div class="teach-box"><h4>Typical Contexts</h4><ul class="teach-list">'+contexts+'</ul>' +
      '<div class="field-hint" style="margin-top:6px;">Grammar pattern: '+Utils.escapeHtml(word.grammar||'—')+'</div></div>' +
      colloc +
      examples +
      '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="nextBtn">Continue</button></div>';
  },

  /* ---- Step 4: Guided processing ---- */
  genStep4(){
    if(this.state.step4Data) return this.state.step4Data;
    const word = this.state.word;
    const types = ['mcq','explain'];
    if(WordModel.getClozeSentence(word)) types.push('cloze');
    const type = Utils.pick(types);
    const data = { type };
    if(type==='mcq'){
      const others = Storage.state.words.filter(w=>w.id!==word.id && w.production);
      let incorrectText = null;
      if(others.length){
        const other = Utils.pick(others);
        const re = new RegExp('\\b'+Utils.escapeRegex(other.word)+'\\b','i');
        if(re.test(other.production)) incorrectText = other.production.replace(re, word.word);
      }
      if(!incorrectText) incorrectText = 'Yesterday she decided to ' + word.word + ' the ' + (word.form.toLowerCase().includes('noun')?'idea':'meeting') + ' without any reason.';
      data.options = Utils.shuffle([{ text: word.production, correct:true }, { text: incorrectText, correct:false }]);
    } else if(type==='cloze'){
      data.cloze = WordModel.getClozeSentence(word);
    }
    this.state.step4Data = data;
    return data;
  },
  renderStep4(){
    const word = this.state.word;
    const data = this.genStep4();
    let inner;
    if(data.type==='mcq'){
      inner = '<div class="practice-sub">Which sentence uses "'+Utils.escapeHtml(word.word)+'" correctly?</div>' +
        '<div class="mcq-options" id="mcqOptions">' + data.options.map(o=>'<button>'+Utils.escapeHtml(o.text)+'</button>').join('') + '</div>';
    } else if(data.type==='explain'){
      inner = '<div class="practice-sub">Explain "'+Utils.escapeHtml(word.word)+'" in your own words.</div>' +
        '<div class="answer-input"><textarea id="explainInput" rows="2" placeholder="Your explanation…"></textarea>' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="explainSubmit">Check My Understanding</button></div></div>';
    } else {
      inner = '<div class="practice-sub">Complete the sentence:</div>' +
        '<div class="practice-prompt">'+Utils.escapeHtml(data.cloze.display).replace('_____','<span class="blank">_____</span>')+'</div>' +
        '<div class="answer-input"><input type="text" id="clozeInput" autocomplete="off" spellcheck="false" placeholder="Type the missing word…">' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="clozeSubmit">Check</button></div></div>';
    }
    return '<div class="teach-step-label">Step 4 · Guided Processing</div>' + inner + '<div id="teachFeedback"></div>';
  },
  wireStep4(){
    const data = this.state.step4Data;
    const word = this.state.word;
    if(data.type==='mcq'){
      const btns = Array.from(document.querySelectorAll('#mcqOptions button'));
      btns.forEach((btn,i)=>{
        btn.addEventListener('click', ()=>{
          btns.forEach(b=>b.disabled=true);
          const opt = data.options[i];
          btn.classList.add(opt.correct?'correct':'incorrect');
          if(!opt.correct){
            const correctIdx = data.options.findIndex(o=>o.correct);
            btns[correctIdx].classList.add('correct');
          }
          this.handleStepOutcome(opt.correct, { dims:['meaningRecognition','contextualComprehension'], correctAnswerText: data.options.find(o=>o.correct).text });
        });
      });
    } else if(data.type==='explain'){
      this._cacheInput(document.getElementById('explainInput'), 'step4_explain');
      document.getElementById('explainSubmit').addEventListener('click', ()=>{
        const feedbackEl = document.getElementById('teachFeedback');
        feedbackEl.innerHTML = '<div class="teach-box"><h4>Core Meaning (compare)</h4><div>'+Utils.escapeHtml(word.meaning)+'</div></div>' +
          '<div class="practice-sub">Did your explanation capture this correctly?</div>' +
          '<div class="rating-row"><button class="btn good" id="selfYes">Yes</button><button class="btn bad" id="selfNo">Not quite</button></div>';
        feedbackEl.querySelector('#selfYes').addEventListener('click', ()=>this.handleStepOutcome(true, { dims:['meaningRecall','semanticDiscrimination'], successMsg:'Good — that matches the core meaning.' }));
        feedbackEl.querySelector('#selfNo').addEventListener('click', ()=>this.handleStepOutcome(false, { correctAnswerText: word.meaning }));
      });
    } else {
      const input = document.getElementById('clozeInput');
      this._cacheInput(input, 'step4_cloze');
      const submit = ()=>{
        const val = input.value.trim();
        if(!val) return;
        const correct = Utils.normalize(val)===Utils.normalize(data.cloze.answer);
        this.handleStepOutcome(correct, { dims:['contextualComprehension','meaningRecognition'], correctAnswerText: data.cloze.answer });
      };
      document.getElementById('clozeSubmit').addEventListener('click', submit);
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
      input.focus();
    }
  },

  /* ---- Step 5: Supported retrieval ---- */
  genStep5(){
    if(this.state.step5Data) return this.state.step5Data;
    const word = this.state.word;
    const cueOptions = ['Meaning: ' + word.meaning];
    if(word.contexts.length) cueOptions.push('Context: ' + Utils.pick(word.contexts));
    const cue = Utils.pick(cueOptions);
    this.state.step5Data = { cue, hintLevel: 0 };
    return this.state.step5Data;
  },
  renderStep5(){
    const word = this.state.word;
    const needsSpellFirst = word.wordType==='difficultSpelling' && !this.state.spellDone;
    if(needsSpellFirst){
      return '<div class="teach-step-label">Step 5 · Supported Retrieval — Spelling Check</div>' +
        '<div class="practice-sub">This word has tricky spelling. Study it, then type it from memory.</div>' +
        '<div class="teach-headword">'+Utils.escapeHtml(word.word)+'</div>' +
        '<div class="answer-input"><input type="text" id="spellInput" autocomplete="off" spellcheck="false" placeholder="Now type it from memory…">' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="spellSubmit">Check Spelling</button></div></div>' +
        '<div id="teachFeedback"></div>';
    }
    const data = this.genStep5();
    return '<div class="teach-step-label">Step 5 · Supported Retrieval</div>' +
      '<div class="practice-sub">Cue — '+Utils.escapeHtml(data.cue)+'</div>' +
      '<div class="answer-input"><input type="text" id="retrieveInput" autocomplete="off" spellcheck="false" placeholder="Type the word…">' +
      '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="retrieveSubmit">Check</button></div></div>' +
      '<div id="teachFeedback"></div>';
  },
  wireStep5(){
    const word = this.state.word;
    if(word.wordType==='difficultSpelling' && !this.state.spellDone){
      const input = document.getElementById('spellInput');
      this._cacheInput(input, 'step5_spell');
      document.getElementById('spellSubmit').addEventListener('click', ()=>{
        const val = input.value.trim();
        const correct = Utils.normalize(val)===Utils.normalize(word.word);
        this.state.spellDone = true;
        DimModel.record(word, 'formRecall', correct);
        if(!correct) WordModel.logError(word, 'Spelling', 0);
        WordModel.logAttempt(word, 0, correct, { phase:'teaching', step:5, part:'spelling' });
        Storage.save();
        const feedbackEl = document.getElementById('teachFeedback');
        feedbackEl.innerHTML = (correct ? '<div class="feedback correct">✓ Spelled correctly.</div>' : '<div class="feedback incorrect">Correct spelling: <b>'+Utils.escapeHtml(word.word)+'</b></div>') +
          '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="spellContinueBtn">Continue</button></div>';
        document.getElementById('spellContinueBtn').addEventListener('click', ()=>this.render());
      });
      input.focus();
      return;
    }
    const data = this.state.step5Data;
    const input = document.getElementById('retrieveInput');
    this._cacheInput(input, 'step5_retrieve');
    const submit = document.getElementById('retrieveSubmit');
    const feedbackEl = document.getElementById('teachFeedback');
    const hints = [
      'Grammatical clue: ' + (word.grammar || '(no grammar note available)'),
      'Semantic clue: ' + word.meaning,
      'First letter: ' + word.word[0].toUpperCase(),
      'Partial form: ' + word.word[0] + '_'.repeat(Math.max(1, word.word.length-2)) + word.word.slice(-1),
      'Answer: ' + word.word
    ];
    const doCheck = ()=>{
      const val = input.value.trim();
      if(!val) return;
      const correct = Utils.normalize(val)===Utils.normalize(word.word);
      if(correct){
        input.disabled = true; submit.disabled = true;
        this.handleStepOutcome(true, { dims:['formRecall','meaningRecall'], successMsg:'Retrieved successfully.', askCategoryOnSuccess: data.hintLevel>0 });
      } else {
        if(data.hintLevel < hints.length) data.hintLevel++;
        WordModel.logAttempt(word, 0, false, { phase:'teaching', step:5 });
        Storage.save();
        const ladder = '<div class="hint-ladder">' + hints.slice(0, data.hintLevel).map(h=>'<div class="hint-line">'+Utils.escapeHtml(h)+'</div>').join('') + '</div>';
        const more = data.hintLevel>=hints.length ? '<div class="practice-sub">Now type it once more to lock it in.</div>' : '';
        feedbackEl.innerHTML = '<div class="feedback incorrect">Not yet — here\'s a hint:</div>' + ladder + more;
        input.value = ''; input.focus();
      }
    };
    submit.addEventListener('click', doCheck);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') doCheck(); });
    input.focus();
  },

  /* ---- Step 6: Constrained production ---- */
  genStep6(){
    if(this.state.step6Data) return this.state.step6Data;
    const word = this.state.word;
    let prompt;
    if(word.collocations.length && Math.random()<0.5) prompt = 'Write a sentence using "'+word.word+'" together with "'+Utils.pick(word.collocations)+'".';
    else if(word.contexts.length) prompt = 'Write a sentence about "'+Utils.pick(word.contexts)+'" using "'+word.word+'".';
    else prompt = 'Write a sentence using "'+word.word+'".';
    this.state.step6Data = { prompt };
    return this.state.step6Data;
  },
  renderStep6(){
    const data = this.genStep6();
    return '<div class="teach-step-label">Step 6 · Constrained Production</div>' +
      '<div class="practice-prompt">'+Utils.escapeHtml(data.prompt)+'</div>' +
      '<div class="answer-input"><textarea id="constrainedInput" rows="2" placeholder="Write your sentence…"></textarea>' +
      '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="constrainedSubmit">Check My Sentence</button></div></div>' +
      '<div id="teachFeedback"></div>';
  },
  wireStep6(){
    const word = this.state.word;
    this._cacheInput(document.getElementById('constrainedInput'), 'step6_constrained');
    document.getElementById('constrainedSubmit').addEventListener('click', ()=>{
      const val = document.getElementById('constrainedInput').value.trim();
      const feedbackEl = document.getElementById('teachFeedback');
      feedbackEl.innerHTML = '<div class="feedback"><b>Your sentence:</b><div style="margin-top:4px;">'+Utils.escapeHtml(val||'(empty)')+'</div></div>' +
        '<div class="self-check"><div><b>Grammar:</b> '+Utils.escapeHtml(word.grammar||'—')+'</div><div><b>Collocations:</b> '+Utils.escapeHtml(word.collocations.join(', ')||'—')+'</div></div>' +
        '<div class="practice-sub" style="margin-top:10px;">Did it satisfy the constraint and use the word correctly?</div>' +
        '<div class="rating-row"><button class="btn good" id="selfYes">Yes</button><button class="btn bad" id="selfNo">No, needs work</button></div>';
      feedbackEl.querySelector('#selfYes').addEventListener('click', ()=>this.handleStepOutcome(true, { dims:['guidedProduction','grammar','collocation'], successMsg:'Nice — constraint satisfied.' }));
      feedbackEl.querySelector('#selfNo').addEventListener('click', ()=>this.handleStepOutcome(false, { correctAnswerText: word.production }));
    });
  },

  /* ---- Step 7: Independent production ---- */
  renderStep7(){
    return '<div class="teach-step-label">Step 7 · Independent Production</div>' +
      '<div class="practice-prompt">Write an original sentence using "'+Utils.escapeHtml(this.state.word.word)+'" — no constraints.</div>' +
      '<div class="answer-input"><textarea id="independentInput" rows="2" placeholder="Write your sentence…"></textarea>' +
      '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="independentSubmit">Check My Sentence</button></div></div>' +
      '<div id="teachFeedback"></div>';
  },
  wireStep7(){
    const word = this.state.word;
    this._cacheInput(document.getElementById('independentInput'), 'step7_independent');
    document.getElementById('independentSubmit').addEventListener('click', ()=>{
      const val = document.getElementById('independentInput').value.trim();
      const feedbackEl = document.getElementById('teachFeedback');
      feedbackEl.innerHTML = '<div class="feedback"><b>Your sentence:</b><div style="margin-top:4px;">'+Utils.escapeHtml(val||'(empty)')+'</div></div>' +
        '<div class="practice-sub" style="margin-top:10px;">Original and correct?</div>' +
        '<div class="rating-row"><button class="btn good" id="selfYes">Yes</button><button class="btn bad" id="selfNo">No, needs work</button></div>';
      feedbackEl.querySelector('#selfYes').addEventListener('click', ()=>this.handleStepOutcome(true, { dims:['independentProduction'], successMsg:'Great — independent production achieved.' }));
      feedbackEl.querySelector('#selfNo').addEventListener('click', ()=>this.handleStepOutcome(false, { correctAnswerText: word.production }));
    });
  },

  /* ---- Step 8: completion ---- */
  renderCompletion(){
    const word = this.state.word;
    return '<div class="teach-step-label">Step 8 · Entering Retrieval Queue</div>' +
      '<div class="teach-headword">'+Utils.escapeHtml(word.word)+'</div>' +
      '<div class="practice-sub">Teaching complete. This word now enters your spaced-retrieval schedule.</div>' +
      '<div class="dim-grid">' + DIMENSIONS.map(d=>'<div class="dim-item"><div class="name">'+d.label+'</div><span class="dim-badge '+word.dims[d.key].status.replace(' ','')+'">'+word.dims[d.key].status+'</span></div>').join('') + '</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn primary" id="finishTeachBtn">'+(this.queueIdx<this.queue.length-1?'Continue to Next Word':'Done')+'</button></div>';
  },

  /* ---- Shared outcome / diagnosis handler for steps 4, 6, 7 ---- */
  handleStepOutcome(success, opts){
    opts = opts || {};
    const word = this.state.word;
    const feedbackEl = document.getElementById('teachFeedback');
    if(success){
      (opts.dims||[]).forEach(d=>DimModel.record(word, d, true));
      WordModel.logAttempt(word, 0, true, { phase:'teaching', step:this.state.step });
      Storage.save();
      if(opts.askCategoryOnSuccess){
        feedbackEl.innerHTML = '<div class="feedback correct">✓ '+(opts.successMsg||'Correct.')+'</div>' +
          '<div class="practice-sub" style="margin-top:10px;">What kind of slip was that, before it clicked?</div>' +
          '<div class="error-cats">' + ERROR_CATEGORIES.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('') + '</div>';
        feedbackEl.querySelectorAll('.error-cats button').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            WordModel.logError(word, btn.dataset.c, 0);
            word.teaching.errorHistory.push({ ts: Date.now(), step: this.state.step, category: btn.dataset.c });
            Storage.save();
            feedbackEl.innerHTML = '<div class="feedback correct">✓ Logged.</div><div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="advanceBtn">Continue</button></div>';
            document.getElementById('advanceBtn').addEventListener('click', ()=>this.goStep(this.state.step+1));
          });
        });
      } else {
        feedbackEl.innerHTML = '<div class="feedback correct">✓ '+(opts.successMsg||'Correct.')+'</div>' +
          '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="advanceBtn">Continue</button></div>';
        document.getElementById('advanceBtn').addEventListener('click', ()=>this.goStep(this.state.step+1));
      }
    } else {
      this.state.retry = (this.state.retry||0)+1;
      feedbackEl.innerHTML = '<div class="feedback incorrect">✗ Not quite.' +
        (opts.correctAnswerText ? '<div class="correct-answer">Correct: '+Utils.escapeHtml(opts.correctAnswerText)+'</div>' : '') + '</div>' +
        '<div class="practice-sub" style="margin-top:10px;">What kind of error was this?</div>' +
        '<div class="error-cats">' + ERROR_CATEGORIES.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('') + '</div>';
      feedbackEl.querySelectorAll('.error-cats button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const cat = btn.dataset.c;
          WordModel.logError(word, cat, 0);
          WordModel.logAttempt(word, 0, false, { phase:'teaching', step:this.state.step, errorCategory:cat });
          word.teaching.errorHistory.push({ ts: Date.now(), step: this.state.step, category: cat });
          Storage.save();
          const secondFailure = this.state.retry>=2;
          feedbackEl.innerHTML = '<div class="diag-box"><b>'+cat+' error.</b><div class="expl">'+ERROR_EXPLANATIONS[cat]+'</div></div>' +
            (secondFailure ?
              ('<div class="teach-box"><h4>Why this is correct</h4><div>'+Utils.escapeHtml(opts.correctAnswerText||word.meaning)+'</div></div>' +
               '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="advanceBtn">I understand — Continue</button></div>')
              : '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="retryBtn">Try This Step Again</button></div>');
          const adv = feedbackEl.querySelector('#advanceBtn');
          if(adv) adv.addEventListener('click', ()=>this.goStep(this.state.step+1));
          const rt = feedbackEl.querySelector('#retryBtn');
          if(rt) rt.addEventListener('click', ()=>{ this.state.step4Data=null; this.state.step6Data=null; this.render(); });
        });
      });
    }
  },

  _wireCurrentStep(){
    const s = this.state;
    if(s.step===1 || s.step===2 || s.step===3){
      const btn = document.getElementById('nextBtn');
      if(btn) btn.addEventListener('click', ()=>this.goStep(s.step+1));
    } else if(s.step===4) this.wireStep4();
    else if(s.step===5) this.wireStep5();
    else if(s.step===6) this.wireStep6();
    else if(s.step===7) this.wireStep7();
    else {
      const b = document.getElementById('finishTeachBtn');
      if(b) b.addEventListener('click', ()=>this.finishWord());
    }
  }
};

/* ============================== BOOT ============================== */
document.addEventListener('DOMContentLoaded', ()=>App.init());
})();
</script>
</body>
</html>
