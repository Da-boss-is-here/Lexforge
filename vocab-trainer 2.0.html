<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Vocabulary Trainer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ==============================================================================
   Design system. System font stack only — no webfonts, no network dependency
   for type. --serif and --mono are kept as the same names the rest of this
   file's markup already references (font-family:var(--serif)/var(--mono) shows
   up ~100+ times across the view templates below); they now resolve to the
   system stack too, differentiated by weight/tracking/size instead of typeface,
   so none of that markup needed to change for this pass.
   ============================================================================== */
:root{
  --bg:#F5F5F7; --bg-elev:#FFFFFF; --bg-elev-2:#F7F7F8; --text:#1D1D1F; --text-dim:#6E6E73;
  --border:#E3E3E6; --border-strong:#D3D3D8;
  --accent:#0071E3; --accent-ink:#FFFFFF; --accent-wash:rgba(0,113,227,.1);
  --highlight:#FF9F0A; --warn-ink:#8A5300; --warn:#FF9F0A;
  --good:#1FA34A; --good-wash:rgba(31,163,74,.12);
  --bad:#E0342A; --bad-wash:rgba(224,52,42,.1);
  --radius:14px; --radius-sm:10px; --radius-xs:7px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 24px -8px rgba(0,0,0,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-pop:0 4px 10px rgba(0,0,0,.06), 0 20px 40px -12px rgba(0,0,0,.16);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:var(--sans);
  --serif:var(--sans);
  --ease:cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-elev:#1C1C1E; --bg-elev-2:#2C2C2E; --text:#F5F5F7; --text-dim:#98989D;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
    --accent:#409CFF; --accent-ink:#00193A; --accent-wash:rgba(64,156,255,.16);
    --highlight:#FFB340; --warn-ink:#FFD08A; --warn:#FFB340;
    --good:#32D74B; --good-wash:rgba(50,215,75,.16);
    --bad:#FF453A; --bad-wash:rgba(255,69,58,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -8px rgba(0,0,0,.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-pop:0 4px 10px rgba(0,0,0,.35), 0 20px 40px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-elev:#1C1C1E; --bg-elev-2:#2C2C2E; --text:#F5F5F7; --text-dim:#98989D;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
  --accent:#409CFF; --accent-ink:#00193A; --accent-wash:rgba(64,156,255,.16);
  --highlight:#FFB340; --warn-ink:#FFD08A; --warn:#FFB340;
  --good:#32D74B; --good-wash:rgba(50,215,75,.16);
  --bad:#FF453A; --bad-wash:rgba(255,69,58,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -8px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-pop:0 4px 10px rgba(0,0,0,.35), 0 20px 40px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; min-height:100vh;
  transition:background-color .2s var(--ease), color .2s var(--ease);
}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}
.hidden{display:none!important;}
a{color:var(--accent);}
::selection{background:var(--accent-wash);}

/* App shell */
#app{max-width:920px;margin:0 auto;padding:0 20px 80px;}
header.topbar{
  position:sticky;top:0;z-index:40;background:rgba(245,245,247,.82);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--border);
  padding:18px 20px 0;margin:0 -20px 24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.topbar{background:rgba(28,28,30,.72);}}
:root[data-theme="dark"] header.topbar{background:rgba(28,28,30,.72);}
.topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;max-width:920px;margin:0 auto;padding:0;}
.topbar h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:700;letter-spacing:-0.015em;}
.topbar .sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;letter-spacing:-0.005em;}
.due-stamp{
  font-family:var(--mono);letter-spacing:-0.01em;font-size:12.5px;font-weight:600;
  background:var(--accent-wash);color:var(--accent);border:none;border-radius:99px;
  padding:6px 13px;white-space:nowrap;
}
nav.tabs{display:flex;gap:4px;max-width:920px;margin:16px auto 0;padding:0 0 12px;overflow-x:auto;scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  font-family:var(--sans);background:none;border:none;color:var(--text-dim);padding:8px 13px;font-size:13px;font-weight:590;
  cursor:pointer;border-radius:99px;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease);
}
nav.tabs button.active{color:var(--accent-ink);background:var(--accent);font-weight:600;}
nav.tabs button:not(.active):hover{color:var(--text);background:var(--bg-elev-2);}

.view{display:none;}
.view.active{display:block;animation:fadeIn .25s var(--ease);}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.view.active{animation:none;}}

/* Cards */
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;}
.hero-card{background:linear-gradient(155deg, var(--accent-wash), var(--bg-elev) 60%);border-color:var(--border-strong);}
.card h2{margin:0 0 14px;font-family:var(--serif);font-size:17px;font-weight:650;letter-spacing:-0.01em;}
.card h3{margin:0 0 8px;font-family:var(--mono);font-size:11.5px;font-weight:650;color:var(--text-dim);text-transform:none;letter-spacing:0;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.stat{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 15px;transition:border-color .15s var(--ease);}
.stat .num{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-0.02em;}
.stat .label{font-family:var(--mono);font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-dim);margin-top:5px;}
.stat.warn .num{color:var(--warn-ink);}
.stat.bad .num{color:var(--bad);}
.stat.good .num{color:var(--good);}
.stat.bad{border-color:var(--bad-wash);}
.stat.good{border-color:var(--good-wash);}

.banner{border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500;display:flex;gap:8px;align-items:flex-start;line-height:1.45;}
.banner.warn{background:rgba(255,159,10,.1);color:var(--warn-ink);border-color:rgba(255,159,10,.25);}
.banner.info{background:var(--accent-wash);color:var(--accent);border-color:transparent;}
.banner.bad{background:var(--bad-wash);color:var(--bad);border-color:transparent;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);border-radius:99px;
  padding:10px 18px;font-size:13.5px;font-weight:590;cursor:pointer;transition:transform .1s var(--ease),opacity .15s var(--ease),background-color .15s var(--ease);
  background:var(--bg-elev);color:var(--text);letter-spacing:-0.005em;
}
.btn:hover{opacity:.85;}
.btn:active{transform:scale(.97);opacity:1;}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.good{background:var(--good);color:#fff;border-color:var(--good);}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad);}
.btn.warn{background:var(--highlight);color:#3A2400;border-color:var(--highlight);}
.btn.ghost{background:transparent;border:1px solid var(--border-strong);}
.btn.small{padding:6px 13px;font-size:12px;}
.btn:disabled{opacity:.38;cursor:not-allowed;}
.btn:disabled:hover{opacity:.38;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* Forms */
label{display:block;font-family:var(--mono);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text-dim);margin:16px 0 6px;}
label .req{color:var(--bad);}
label .opt{font-weight:400;color:var(--text-dim);text-transform:none;}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-xs);
  padding:11px 13px;font-size:14.5px;font-family:var(--sans);color:var(--text);outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);}
textarea{resize:vertical;min-height:52px;}
.field-hint{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-top:5px;line-height:1.5;}
.field-error{font-family:var(--mono);font-size:11.5px;color:var(--bad);margin-top:5px;font-weight:600;}
.repeat-group .row{display:flex;gap:8px;margin-bottom:8px;}
.repeat-group .row input{flex:1;}
fieldset{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin:16px 0 0;}
legend{font-family:var(--mono);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text-dim);padding:0 6px;}

/* Badges */
.badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;text-transform:none;letter-spacing:0;padding:4px 10px;border-radius:99px;border:1px solid transparent;background:var(--bg-elev-2);color:var(--text-dim);}
.badge.New{background:var(--bg-elev-2);color:var(--text-dim);border-color:var(--border);}
.badge.Learning{background:var(--accent-wash);color:var(--accent);}
.badge.Unstable{background:rgba(255,159,10,.14);color:var(--warn-ink);}
.badge.Stable{background:var(--good-wash);color:var(--good);}
.badge.ExamReady{background:var(--highlight);color:#3A2400;font-weight:700;}
.badge.level{background:var(--bg-elev-2);}
.track-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:650;letter-spacing:0;padding:4px 10px 4px 8px;border-radius:99px;}
.track-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.track-badge.recognition{background:var(--accent-wash);color:var(--accent);}
.track-badge.production{background:rgba(255,159,10,.14);color:var(--warn-ink);}
.track-badge.cued,.track-badge.cloze{background:var(--bg-elev-2);color:var(--text-dim);}
.track-badge.drill{background:rgba(255,159,10,.14);color:var(--warn-ink);}

/* Word bank list */
.word-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);}
.word-row:last-child{border-bottom:none;}
.word-row .w{font-family:var(--serif);font-weight:650;font-size:15.5px;letter-spacing:-0.005em;}
.pronunciation{font-family:var(--mono);font-size:13px;color:var(--text-dim);}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg-elev-2);border-radius:99px;cursor:pointer;font-size:13px;line-height:1;padding:5px 8px;color:var(--text);transition:border-color .15s var(--ease);}
.speak-btn:hover{border-color:var(--accent);}
.speak-btn.small{padding:3px 6px;font-size:11px;}
.teach-headword-row{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;}
.reveal-word-row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;font-weight:700;}
.word-row .meta{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-top:3px;}
.word-row .right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.examples-panel{padding:0 0 12px;margin-top:-6px;}
.examples-panel .teach-list li{margin-bottom:4px;}

/* Practice screen */
.practice-wrap{max-width:600px;margin:0 auto;}
.practice-progress{font-family:var(--mono);font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-dim);text-align:center;margin-bottom:12px;}
.practice-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:32px 28px;box-shadow:var(--shadow-pop);text-align:center;}
.practice-level{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:650;letter-spacing:0;text-transform:none;color:var(--text-dim);margin-bottom:16px;background:var(--bg-elev-2);padding:5px 12px;border-radius:99px;}
.practice-prompt{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.01em;line-height:1.45;margin-bottom:18px;}
.practice-prompt .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--text-dim);}
.practice-sub{font-size:13.5px;color:var(--text-dim);margin-bottom:16px;}
.practice-mnemonic{font-size:13px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:16px;color:var(--text-dim);text-align:left;}
.practice-mnemonic.faded{font-style:italic;}
.mcq-options{display:grid;gap:8px;margin-top:10px;}
.mcq-options button{
  text-align:left;padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elev-2);
  font-size:14.5px;cursor:pointer;color:var(--text);transition:border-color .15s var(--ease),background-color .15s var(--ease);
}
.mcq-options button:hover{border-color:var(--accent);background:var(--accent-wash);}
.mcq-options button.correct{background:var(--good-wash);border-color:var(--good);}
.mcq-options button.incorrect{background:var(--bad-wash);border-color:var(--bad);}
.answer-input{margin-top:6px;}
.answer-input input,.answer-input textarea{text-align:center;font-size:16px;}
.feedback{margin-top:16px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;text-align:left;font-size:14px;animation:fadeIn .2s var(--ease);}
.feedback.correct{background:var(--good-wash);border-color:var(--good);}
.feedback.incorrect{background:var(--bad-wash);border-color:var(--bad);}
.feedback .correct-answer{font-weight:700;margin-top:4px;}
.rating-row{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.self-check{text-align:left;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;margin-top:14px;font-size:13px;}
.self-check div{margin-bottom:4px;}
.self-check b{color:var(--text-dim);font-weight:700;}
.error-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px;}
.error-cats button{padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elev-2);cursor:pointer;font-size:13px;font-weight:600;color:var(--text);transition:border-color .15s var(--ease);}
.error-cats button:hover{border-color:var(--bad);}
.error-cats button.picked{background:var(--bad-wash);border-color:var(--bad);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fadeIn .15s var(--ease);}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:480px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--shadow-pop);}
.modal h2{margin-top:0;font-family:var(--serif);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:11px 20px;border-radius:99px;border:none;font-size:13.5px;font-weight:590;z-index:200;box-shadow:var(--shadow-pop);}
.empty-state{text-align:center;padding:40px 16px;color:var(--text-dim);}
.empty-state .big{font-size:34px;margin-bottom:10px;}
.empty-state h2{font-family:var(--serif);}
.session-phase-nav{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
.session-phase-nav .dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background-color .2s var(--ease);}
.session-phase-nav .dot.active{background:var(--accent);}
.session-phase-nav .dot.done{background:var(--good);}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;}
.bar-track{flex:1;height:8px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);transition:width .3s var(--ease);}
.small-link{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:0;font-weight:600;}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.mt0{margin-top:0;}
.center{text-align:center;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:520px){.two-col{grid-template-columns:1fr;}}

/* Teaching phase */
.teach-step-label{font-family:var(--mono);font-size:11.5px;font-weight:650;letter-spacing:0;text-transform:none;color:var(--accent);margin-bottom:6px;}
.teach-headword{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-0.015em;margin-bottom:2px;}
.teach-sub{font-size:13.5px;color:var(--text-dim);margin-bottom:14px;}
.teach-box{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin:10px 0;text-align:left;}
.teach-box h4{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--text-dim);}
.teach-box.emph{border:1.5px solid var(--accent);}
.teach-box.contrast{border:1.5px solid var(--highlight);background:rgba(255,159,10,.1);}
.teach-list{margin:0;padding-left:18px;font-size:14px;line-height:1.6;}
.teach-list li{margin-bottom:4px;}
.teach-note{font-size:12.5px;color:var(--text-dim);margin-top:8px;font-style:italic;}
.hint-ladder{text-align:left;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:10px 0;font-size:13.5px;}
.hint-ladder .hint-line{margin-bottom:6px;}
.hint-ladder .hint-line b{color:var(--text-dim);}
.diag-box{text-align:left;background:var(--bad-wash);border:1px solid var(--bad);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0;}
.diag-box .expl{margin-top:8px;font-size:13.5px;}
.step-progress-wrap{max-width:520px;margin:0 auto 14px;}
.step-progress-track{height:6px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:99px;overflow:hidden;}
.step-progress-fill{height:100%;background:var(--accent);transition:width .2s var(--ease);}
.dim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px;}
.dim-item{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;}
.dim-item .name{font-size:12px;font-weight:650;margin-bottom:6px;}
.dim-item .track{height:6px;border-radius:99px;background:var(--border);overflow:hidden;display:flex;}
.dim-item .track .seg{height:100%;transition:width .3s var(--ease);}
.dim-badge{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:650;text-transform:none;letter-spacing:0;padding:3px 9px;border-radius:99px;margin-top:6px;}
.dim-badge.Achieved{background:var(--good-wash);color:var(--good);}
.dim-badge.Developing{background:rgba(255,159,10,.14);color:var(--warn-ink);}
.dim-badge.Notassessed{background:var(--bg-elev-2);color:var(--text-dim);}
.badge.Untaught{background:var(--bad-wash);color:var(--bad);border-color:transparent;}
.word-type-tag{font-family:var(--mono);font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:650;color:var(--text-dim);background:var(--bg-elev-2);border:1px solid var(--border);padding:3px 9px;border-radius:99px;}

/* Writing module */
.essay-preview{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.6;text-align:left;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;}
.essay-preview mark{background:rgba(255,159,10,.4);border-radius:3px;padding:0 2px;cursor:default;}
.tag-item{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px;text-align:left;font-size:13.5px;}
.tag-item .quoted{font-weight:700;text-decoration:line-through;text-decoration-color:var(--bad);}
.tag-item .arrow{color:var(--text-dim);margin:0 6px;}
.tag-item .corrected{font-weight:700;color:var(--good);}
.tag-item .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:8px;}
.target-word-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:99px;padding:7px 13px;font-weight:650;font-size:13.5px;margin:3px;}
.exam-timer{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:40px;font-weight:700;letter-spacing:-0.02em;text-align:center;margin:6px 0 14px;}
.exam-timer.low{color:var(--bad);}
.checklist-item{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:10px;text-align:left;}
.checklist-item .w{font-family:var(--serif);font-weight:650;font-size:16px;margin-bottom:8px;}
.checklist-row{display:flex;gap:8px;flex-wrap:wrap;}
.checklist-row button{padding:8px 12px;border-radius:99px;border:1px solid var(--border);background:var(--bg-elev);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text);transition:border-color .15s var(--ease);}
.checklist-row button.picked-correct{background:var(--good-wash);border-color:var(--good);}
.checklist-row button.picked-incorrect{background:var(--bad-wash);border-color:var(--bad);}
.checklist-row button.picked-none{background:var(--bg-elev-2);border-color:var(--text-dim);}

/* Analytics */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:720px){.analytics-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.chart-card h3{margin:0 0 4px;font-family:var(--serif);font-size:15.5px;font-weight:650;text-transform:none;letter-spacing:-0.005em;}
.chart-card .chart-sub{font-family:var(--mono);font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-dim);margin-bottom:12px;}
.chart-wrap{position:relative;height:240px;}
.achv-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.achv-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.achv-card{flex:0 0 auto;width:132px;background:var(--bg-elev-2);border-radius:var(--radius-sm);padding:15px 11px;text-align:center;border:1px solid var(--border);transition:border-color .15s var(--ease);}
.achv-card.unlocked{border-color:var(--accent);background:linear-gradient(160deg, var(--accent-wash), rgba(255,159,10,.1));}
.achv-card.locked{opacity:.4;filter:grayscale(.7);}
.achv-card .icon{font-size:28px;margin-bottom:6px;}
.achv-card .name{font-size:12px;font-weight:650;line-height:1.3;}
.achv-card .desc{font-size:10.5px;color:var(--text-dim);margin-top:4px;line-height:1.3;}
.achv-card .lock{font-family:var(--mono);font-size:10px;text-transform:none;color:var(--text-dim);margin-top:4px;}
.streak-banner{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:16px;font-weight:650;}
.streak-banner .flame{font-size:24px;}

/* Interaction polish: consistent keyboard focus, subtle hover feedback.
   Kept as one block at the end so it layers on top of the component rules
   above without needing to touch any of them individually. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px;}
.btn:focus-visible,nav.tabs button:focus-visible{outline-offset:2px;}
.stat,.achv-card,.chart-card,.dim-item{transition:border-color .15s var(--ease),transform .15s var(--ease);}
.achv-card.unlocked:hover{transform:translateY(-2px);}
.word-row .right .btn:hover,.word-row .right .speak-btn:hover{transform:translateY(-1px);}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}

<!-- Vendored locally (not CDN) so the app keeps working with no network access.
     lib/fsrs.umd.js is ts-fsrs, implementing FSRS-6 (see lib/fsrs-scheduler.js
     for why not FSRS-7). lib/fsrs-scheduler.js and lib/due-queue.js are also
     plain classic scripts sharing this page's global scope, same as every
     other module below (WordModel, DimModel, etc.) -- no bundler, no ES
     modules, so this keeps working when the file is opened directly. -->
<script src="lib/fsrs.umd.js"></script>
<script src="lib/fsrs-scheduler.js"></script>
<script src="lib/due-queue.js"></script>
<script>
(function(){
"use strict";

/* ============================== UTILITIES ============================== */
const Utils = {
  uid(){ return 'w_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9); },
  // Dates are stored as plain "YYYY-MM-DD" calendar strings (no timezone attached).
  // todayISO() reads the user's local wall-clock date; every other helper below
  // manipulates the Y/M/D components via Date.UTC so the arithmetic never gets
  // reinterpreted through a local<->UTC conversion (which used to silently cancel
  // out addDays() for anyone east of Greenwich, freezing SRS/chart dates in place).
  todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  addDays(iso, n){ const [y,m,d] = iso.split('-').map(Number); const dt = new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+n); return dt.toISOString().slice(0,10); },
  diffDays(a,b){ const [ay,am,ad]=a.split('-').map(Number), [by,bm,bd]=b.split('-').map(Number); return Math.round((Date.UTC(by,bm-1,bd)-Date.UTC(ay,am-1,ad))/86400000); },
  fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}); },
  clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); },
  escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); },
  normalize(s){ return String(s||'').trim().toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/g,''); },
  pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; },
  shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; },
  levenshtein(a,b){
    a=a.toLowerCase(); b=b.toLowerCase();
    const m=a.length,n=b.length;
    if(!m) return n; if(!n) return m;
    const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
    for(let j=0;j<=n;j++) dp[0][j]=j;
    for(let i=1;i<=m;i++){
      for(let j=1;j<=n;j++){
        dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
      }
    }
    return dp[m][n];
  },
  toast(msg, ms){
    const root = document.getElementById('toastRoot');
    const el = document.createElement('div');
    el.className='toast'; el.textContent=msg;
    root.appendChild(el);
    setTimeout(()=>el.remove(), ms||2400);
  }
};

/* ============================== SPEECH (TEXT-TO-SPEECH) ============================== */
const Speech = {
  available(){ return typeof window!=='undefined' && 'speechSynthesis' in window; },
  pickVoice(){
    if(!this.available()) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v=>v.lang==='en-US') || voices.find(v=>v.lang==='en-GB') ||
      voices.find(v=>/^en/i.test(v.lang)) || null;
  },
  speak(text){
    if(!text) return;
    if(!this.available()){ console.warn('SpeechSynthesis is not available in this browser.'); return; }
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const voice = this.pickVoice();
      if(voice) utter.voice = voice;
      utter.lang = voice ? voice.lang : 'en-US';
      window.speechSynthesis.speak(utter);
    }catch(e){ console.warn('SpeechSynthesis failed:', e); }
  }
};

const AI_GENERATOR_PROMPT = `You are generating advanced vocabulary entries for a spaced-repetition trainer. For each word I give you, output exactly ONE line in this pipe-delimited format, with NO extra commentary, headers, numbering, or markdown — just the raw lines, one word per line:

Word | Core Meaning & Nuance | Form | Grammar | Collocations | Contrast | Typical Contexts | Production Sentence | Mnemonic | Cloze Sentences | Pronunciation

Field rules:
1. Word — the headword exactly as I gave it.
2. Core Meaning & Nuance — a precise definition (not a vague synonym), including any nuance that distinguishes it from near-synonyms.
3. Form — part of speech and word family, e.g. "verb (trans.); noun form: abduction; adj form: abducted".
4. Grammar — the patterns it takes: prepositions, transitivity, sentence structure, e.g. "~ sb from somewhere", "~ into + noun".
5. Collocations — 3 to 4 natural word-partners, separated by ";". Vary them (verb+noun, adj+noun, noun+prep, etc.) rather than near-duplicates.
6. Contrast — one closely related word it's often confused with, plus a one-line distinction.
7. Typical Contexts — 3 to 4 short situations/topics where this word naturally comes up, separated by ";" (e.g. "true crime reporting", "a courtroom drama"). These are topic tags, NOT sentences, and must NOT contain the target word.
8. Production Sentence — one clean original sentence using the word naturally.
9. Mnemonic — a short, vivid memory hook (can reference sound, spelling, or a related word). Leave blank only if none is genuinely useful.
10. Cloze Sentences — exactly 5 DIFFERENT original sentences, separated by ";", each containing the exact target word (so it can be auto-blanked). Each one must show a genuinely different use: a different collocation, a different register (casual vs. formal vs. academic), a different sentence structure (statement, question, subordinate clause), and ideally a different real-world domain (news, dialogue, narrative, science, etc.) so repeated practice never feels repetitive.
11. Pronunciation (optional, may be omitted entirely along with its preceding "|") — a simple phonetic respelling, e.g. "ab-DUKT".

Constraints:
- Every field must be non-empty except Mnemonic and Pronunciation.
- Never let a Typical Context or Collocation give away the word by accident-checking is fine, but Typical Contexts must read as topics, not sentences containing the word.
- Keep tone and difficulty consistent with an advanced/exam-prep vocabulary list.
- Output one line per word, nothing else — I will paste your output directly into the app's Paste Import box.

Words to generate: `;

const ERROR_CATEGORIES = ['Meaning','Form','Spelling','Grammar','Collocation','Register','Selection'];

const ERROR_EXPLANATIONS = {
  Meaning: 'The core sense got mixed up with a related but different idea. Re-read the Core Meaning and Contrast before retrying.',
  Form: 'This is about the word\'s part of speech or word family (e.g. noun vs. verb form) — the wrong family was used.',
  Spelling: 'The meaning and usage were fine, but the written form wasn\'t exact. Focus purely on the letters.',
  Grammar: 'The pattern the word takes (prepositions, sentence structure) wasn\'t quite right — check the Grammar note.',
  Collocation: 'The word itself was right, but the natural word-partners around it were off.',
  Register: 'The tone or formality level didn\'t match the situation described.',
  Selection: 'A near-synonym might have fit better here — review the Contrast to see the boundary.'
};

const CATEGORY_TO_DIM = {
  Meaning:'meaningRecall', Form:'formRecognition', Spelling:'formRecall',
  Grammar:'grammar', Collocation:'collocation', Register:'contextualComprehension', Selection:'semanticDiscrimination'
};

const DIMENSIONS = [
  {key:'formRecognition', label:'Form Recognition'},
  {key:'formRecall', label:'Form Recall (Spelling)'},
  {key:'meaningRecognition', label:'Meaning Recognition'},
  {key:'meaningRecall', label:'Meaning Recall'},
  {key:'semanticDiscrimination', label:'Semantic Discrimination'},
  {key:'grammar', label:'Grammar'},
  {key:'collocation', label:'Collocation'},
  {key:'contextualComprehension', label:'Contextual Comprehension'},
  {key:'guidedProduction', label:'Guided Production'},
  {key:'independentProduction', label:'Independent Production'},
  {key:'novelApplication', label:'Novel Application'}
];
const DIM_KEYS = DIMENSIONS.map(d=>d.key);

const WORD_TYPES = [
  {key:'general', label:'General / mixed'},
  {key:'concreteNoun', label:'Concrete noun'},
  {key:'abstractVerb', label:'Abstract academic verb'},
  {key:'polysemous', label:'Polysemous (multiple senses)'},
  {key:'nearSynonym', label:'Near-synonym (needs boundary work)'},
  {key:'difficultSpelling', label:'Difficult spelling'}
];

function freshDims(){
  const d = {};
  DIM_KEYS.forEach(k=>{ d[k] = { status:'Not assessed', success:0, fail:0 }; });
  return d;
}
function repairDims(raw){
  const d = freshDims();
  if(raw && typeof raw==='object'){
    DIM_KEYS.forEach(k=>{
      if(raw[k] && typeof raw[k]==='object'){
        d[k].status = ['Not assessed','Developing','Achieved'].includes(raw[k].status) ? raw[k].status : 'Not assessed';
        d[k].success = Number(raw[k].success)||0;
        d[k].fail = Number(raw[k].fail)||0;
      }
    });
  }
  return d;
}
const DimModel = {
  record(word, dimKey, success){
    const d = word.dims && word.dims[dimKey];
    if(!d) return;
    if(success){
      d.success++;
      d.status = d.success>=2 ? 'Achieved' : 'Developing';
    } else {
      d.fail++;
      d.status = d.status==='Achieved' ? 'Developing' : 'Developing';
    }
  }
};

/* ============================== BULK PASTE IMPORT ============================== */
const BulkImport = {
  FIELD_COUNT: 10,
  FIELD_COUNT_WITH_PRONUNCIATION: 11,
  parseLine(line){
    const parts = line.split('|').map(s=>s.trim());
    if(parts.length !== this.FIELD_COUNT && parts.length !== this.FIELD_COUNT_WITH_PRONUNCIATION){
      throw new Error('Expected ' + this.FIELD_COUNT + ' fields (or ' + this.FIELD_COUNT_WITH_PRONUNCIATION + ' with an optional trailing Pronunciation field) separated by "|", found ' + parts.length + '.');
    }
    const [word, meaning, form, grammar, collocRaw, contrast, contextsRaw, production, mnemonic, clozeRaw, pronunciationRaw] = parts;
    const splitSemi = s => s.split(';').map(x=>x.trim()).filter(Boolean);
    const collocations = splitSemi(collocRaw);
    const contexts = splitSemi(contextsRaw);
    const cloze = splitSemi(clozeRaw);
    const pronunciation = (pronunciationRaw||'').trim();

    if(!word) throw new Error('Word is missing.');
    if(!meaning) throw new Error('Core Meaning is missing.');
    if(!form) throw new Error('Form is missing.');
    if(!grammar) throw new Error('Grammar is missing.');
    if(collocations.length<2) throw new Error('At least 2 collocations required (separate with ";").');
    if(!contrast) throw new Error('Contrast is missing.');
    if(contexts.length<2) throw new Error('At least 2 typical contexts required (separate with ";").');
    if(!production) throw new Error('Production sentence is missing.');

    return { word, meaning, form, grammar, collocations, contrast, contexts, production, mnemonic: mnemonic||'', cloze, pronunciation };
  }
};

/* ============================== STORAGE ============================== */
const STORAGE_KEY = 'coreVocabTrainer.v1';
const STORAGE_BACKUP_KEY = 'coreVocabTrainer.v1.corrupted_backup';
const FSRS_REVIEW_LOG_CAP = 5000;

function defaultState(){
  return {
    version: 2,
    words: [],
    errorLog: [], // {ts, wordId, word, category, level}
    settings: {
      examDate: null, theme: 'system',
      fsrs: FSRSScheduler.defaultSettings()
    },
    sessionLog: [], // {ts, summary}
    writingLog: [], // {ts, date, text, errors:[{quoted,word,wordId,category,correction,matched}]}
    examLog: [], // {ts, date, prompt, minutes, text, targetWords:[{word,wordId,outcome,category}]}
    // Per-review measurement log for FSRS-scheduled dimensions (Phase 5 groundwork). Separate from
    // word.history so analytics doesn't need to filter mixed-type entries. Capped, see Storage.save.
    fsrsReviewLog: [], // {ts, wordId, dimension, rating, predictedR, outcome, desiredRetentionAtSchedule, stabilityBefore, stabilityAfter, difficultyBefore, difficultyAfter, elapsedDays, scheduledDays}
    practiceSession: null // in-progress practice queue, so a page refresh mid-session can resume (see Practice.persist/restore)
  };
}

function validateAndRepair(raw){
  const base = defaultState();
  if(!raw || typeof raw !== 'object') return base;
  const out = base;
  if(Array.isArray(raw.words)){
    out.words = raw.words.filter(w=>w && typeof w==='object' && w.word).map(repairWord);
  }
  if(Array.isArray(raw.errorLog)) out.errorLog = raw.errorLog.filter(e=>e && e.category && ERROR_CATEGORIES.includes(e.category));
  if(raw.settings && typeof raw.settings==='object'){
    out.settings.examDate = typeof raw.settings.examDate==='string' ? raw.settings.examDate : null;
    out.settings.theme = ['system','light','dark'].includes(raw.settings.theme) ? raw.settings.theme : 'system';
    out.settings.fsrs = FSRSScheduler.repairSettings(raw.settings.fsrs);
  }
  if(Array.isArray(raw.sessionLog)) out.sessionLog = raw.sessionLog.filter(s=>s && s.ts);
  if(Array.isArray(raw.writingLog)) out.writingLog = raw.writingLog.filter(s=>s && s.ts);
  if(Array.isArray(raw.examLog)) out.examLog = raw.examLog.filter(s=>s && s.ts);
  if(Array.isArray(raw.fsrsReviewLog)) out.fsrsReviewLog = raw.fsrsReviewLog.filter(s=>s && s.ts).slice(-FSRS_REVIEW_LOG_CAP);
  if(raw.practiceSession && typeof raw.practiceSession==='object' && Array.isArray(raw.practiceSession.queue)){
    out.practiceSession = raw.practiceSession;
  }
  return out;
}

function repairWord(w){
  const d = {
    id: w.id || Utils.uid(),
    word: String(w.word||'').trim(),
    meaning: String(w.meaning||'').trim(),
    form: String(w.form||'').trim(),
    grammar: String(w.grammar||'').trim(),
    collocations: Array.isArray(w.collocations) ? w.collocations.filter(Boolean) : [],
    contrast: String(w.contrast||'').trim(),
    contexts: Array.isArray(w.contexts) ? w.contexts.filter(Boolean) : [],
    production: String(w.production||'').trim(),
    mnemonic: String(w.mnemonic||'').trim(),
    pronunciation: String(w.pronunciation||'').trim(),
    cloze: Array.isArray(w.cloze) ? w.cloze.filter(Boolean) : [],
    created: w.created || Utils.todayISO(),
    srs: w.srs && typeof w.srs==='object' ? {
      interval: Number(w.srs.interval)||1,
      nextReview: w.srs.nextReview || Utils.todayISO(),
      easeStreak: Number(w.srs.easeStreak)||0,
      lastPracticed: w.srs.lastPracticed || null
    } : { interval:1, nextReview: Utils.todayISO(), easeStreak:0, lastPracticed:null },
    levelState: w.levelState && typeof w.levelState==='object' ? { level: Utils.clamp(Number(w.levelState.level)||2,1,4) } : { level:2 },
    history: Array.isArray(w.history) ? w.history.filter(h=>h && typeof h==='object') : [],
    errorCounts: w.errorCounts && typeof w.errorCounts==='object' ? w.errorCounts : {},
    lastClozeIndex: typeof w.lastClozeIndex==='number' ? w.lastClozeIndex : -1,
    wordType: WORD_TYPES.some(t=>t.key===w.wordType) ? w.wordType : 'general',
    dims: repairDims(w.dims),
    fsrs: FSRSScheduler.repairWordFsrs(w.fsrs),
    teaching: (w.teaching && typeof w.teaching==='object') ? {
      completed: !!w.teaching.completed,
      currentStep: Utils.clamp(Number(w.teaching.currentStep)||1, 1, 8),
      errorHistory: Array.isArray(w.teaching.errorHistory) ? w.teaching.errorHistory : [],
      stepResults: (w.teaching.stepResults && typeof w.teaching.stepResults==='object') ? w.teaching.stepResults : {}
    } : { completed: (w.history && w.history.length>0) || false, currentStep: 8, errorHistory: [], stepResults: {} }
  };
  return d;
}

const Storage = {
  state: null,
  load(){
    let raw = null;
    try{
      const txt = localStorage.getItem(STORAGE_KEY);
      if(txt) raw = JSON.parse(txt);
    }catch(e){
      try{ localStorage.setItem(STORAGE_BACKUP_KEY, localStorage.getItem(STORAGE_KEY)||''); }catch(e2){}
      Utils.toast('Saved data was corrupted — started fresh (old data backed up).', 4000);
      raw = null;
    }
    this.state = validateAndRepair(raw);
    this.save();
  },
  save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); }
    catch(e){ Utils.toast('Could not save — storage may be full.'); }
  },
  exportJSON(){
    const blob = new Blob([JSON.stringify(this.state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'vocab-trainer-backup-'+Utils.todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  },
  importJSON(text, mode){
    let parsed;
    try{ parsed = JSON.parse(text); }
    catch(e){ Utils.toast('Import failed: invalid JSON.'); return false; }
    const incoming = validateAndRepair(parsed);
    if(incoming.words.length===0 && (!parsed.words || parsed.words.length===0)){
      Utils.toast('Import failed: no valid words found in file.'); return false;
    }
    if(mode==='replace'){
      this.state = incoming;
    } else {
      const existingIds = new Set(this.state.words.map(w=>w.id));
      const merged = this.state.words.slice();
      incoming.words.forEach(w=>{ if(!existingIds.has(w.id)) merged.push(w); });
      this.state.words = merged;
      this.state.errorLog = this.state.errorLog.concat(incoming.errorLog);
      if(incoming.settings.examDate) this.state.settings.examDate = incoming.settings.examDate;
    }
    this.save();
    return true;
  }
};

/* ============================== WORD MODEL / SRS / MASTERY ============================== */
const WordModel = {
  create(fields){
    return {
      id: Utils.uid(),
      word: fields.word.trim(),
      meaning: fields.meaning.trim(),
      form: fields.form.trim(),
      grammar: fields.grammar.trim(),
      collocations: fields.collocations,
      contrast: fields.contrast.trim(),
      contexts: fields.contexts,
      production: fields.production.trim(),
      mnemonic: (fields.mnemonic||'').trim(),
      pronunciation: (fields.pronunciation||'').trim(),
      cloze: fields.cloze,
      created: Utils.todayISO(),
      srs: { interval: 1, nextReview: Utils.todayISO(), easeStreak: 0, lastPracticed: null },
      levelState: { level: 2 },
      history: [],
      errorCounts: {},
      lastClozeIndex: -1,
      wordType: WORD_TYPES.some(t=>t.key===fields.wordType) ? fields.wordType : 'general',
      dims: freshDims(),
      fsrs: FSRSScheduler.freshWordFsrs(),
      teaching: { completed: false, currentStep: 1, errorHistory: [], stepResults: {} }
    };
  },

  blank(sentence, word){
    const esc = Utils.escapeRegex(word);
    const wb = new RegExp('\\b'+esc+'\\b','i');
    if(wb.test(sentence)){
      const answer = sentence.match(wb)[0];
      return { display: sentence.replace(wb, '_____'), answer };
    }
    // fallback: try to find an inflected token sharing the first 4 chars
    const stem = word.slice(0, Math.min(4, word.length)).toLowerCase();
    const tokens = sentence.match(/[A-Za-z']+/g) || [];
    const match = tokens.find(t => t.length>=stem.length && t.toLowerCase().startsWith(stem));
    if(match){
      const tokRe = new RegExp('\\b'+Utils.escapeRegex(match)+'\\b');
      return { display: sentence.replace(tokRe, '_____'), answer: match };
    }
    return null;
  },

  // Display-only masking for hint surfaces (mnemonics, collocation cues, drill
  // sentences) — NOT used for Cloze grading, which needs blank()'s strict
  // one-blank/one-gradable-answer contract. Unlike blank(), this also catches a
  // multi-word target phrase (e.g. "morally compromised") when only one of its
  // component words appears (e.g. a mnemonic that just says "Compromised = ..."),
  // and tolerates inflected endings via a short stem match.
  maskWord(text, word){
    if(!text || !word) return text;
    let masked = text.replace(new RegExp('\\b'+Utils.escapeRegex(word)+'\\b','ig'), '_____');
    const stopwords = new Set(['a','an','the','of','to','in','on','for','and','or','is','was','be','been','its',"it's",'his','her','their']);
    word.split(/\s+/).filter(p=>p.length>=3 && !stopwords.has(p.toLowerCase())).forEach(p=>{
      const stem = Utils.escapeRegex(p.slice(0, Math.min(6, p.length)));
      masked = masked.replace(new RegExp('\\b'+stem+"[a-z']*",'ig'), '_____');
    });
    return masked;
  },

  getClozeSentence(word){
    let candidates = word.cloze.length ? word.cloze.slice() : [];
    if(!candidates.length){
      if(word.production) candidates = [word.production];
    }
    if(!candidates.length) return null;
    let idx;
    if(candidates.length===1) idx = 0;
    else {
      do { idx = Math.floor(Math.random()*candidates.length); } while(idx === word.lastClozeIndex && candidates.length>1);
    }
    word.lastClozeIndex = idx;
    const sentence = candidates[idx];
    const blanked = this.blank(sentence, word.word);
    if(blanked) return blanked;
    // sentence may already have been authored with a blank placeholder (e.g. "___")
    if(/_{2,}/.test(sentence)){
      return { display: sentence.replace(/_{2,}/, '_____'), answer: word.word };
    }
    // can't safely blank the word out of this sentence without revealing it — bail out,
    // caller (genCloze) falls back to a cued-recall prompt instead
    return null;
  },

  logAttempt(word, level, correct, meta){
    word.history.push(Object.assign({ ts: Date.now(), date: Utils.todayISO(), level, correct }, meta||{}));
    if(word.history.length>200) word.history = word.history.slice(-200);
  },

  logError(word, category, level){
    word.errorCounts[category] = (word.errorCounts[category]||0)+1;
    Storage.state.errorLog.push({ ts: Date.now(), date: Utils.todayISO(), wordId: word.id, word: word.word, category, level });
    const dimKey = CATEGORY_TO_DIM[category];
    if(dimKey) DimModel.record(word, dimKey, false);
  },

  updateLadder(word, level, correct){
    const last5 = word.history.slice(-5);
    const rate = last5.length ? last5.filter(h=>h.correct).length/last5.length : 1;
    if(last5.length>=3 && rate<0.5){
      word.levelState.level = Math.max(2, word.levelState.level-1);
      return;
    }
    if(correct){
      const recentAtLevel = word.history.filter(h=>h.level===level).slice(-2);
      if(recentAtLevel.length>=2 && recentAtLevel.every(h=>h.correct) && level===word.levelState.level && word.levelState.level<4){
        word.levelState.level = Math.min(4, word.levelState.level+1);
      }
    }
  },

  applyRating(word, rating){
    const prev = word.srs.interval || 1;
    let interval;
    if(rating==='again'){ interval = 1; word.srs.easeStreak = 0; }
    else if(rating==='hard'){ interval = Utils.clamp(Math.round(prev*0.75)||1, 1, 2); word.srs.easeStreak = 0; }
    else { interval = Utils.clamp(Math.round(prev*1.75), 2, 30); word.srs.easeStreak = (word.srs.easeStreak||0)+1; }

    let nextReview = Utils.addDays(Utils.todayISO(), interval);
    const examDate = Storage.state.settings.examDate;
    if(examDate && examDate >= Utils.todayISO()){
      const stage = this.computeMastery(word);
      if(stage!=='Exam Ready' && nextReview > examDate){
        const daysToExam = Utils.diffDays(Utils.todayISO(), examDate);
        if(daysToExam>0){
          interval = Utils.clamp(Math.min(interval, Math.ceil(daysToExam/2)), 1, 30);
          nextReview = Utils.addDays(Utils.todayISO(), interval);
        }
      }
    }
    word.srs.interval = interval;
    word.srs.nextReview = nextReview;
    word.srs.lastPracticed = Utils.todayISO();
  },

  mnemonicFaded(word){
    return (word.srs.easeStreak||0) >= 4 && !!word.mnemonic;
  },

  computeMastery(word){
    const h = word.history;
    if(!word.teaching || !word.teaching.completed) return 'New';
    if(h.length===0) return 'New';
    const rh = h.filter(a=>a.phase!=='teaching');
    if(rh.length===0) return 'Learning';
    const last5 = rh.slice(-5);
    const last5Rate = last5.filter(a=>a.correct).length/last5.length;
    const hasRecentFail = last5.some(a=>!a.correct);
    const last3 = rh.slice(-3);
    const noRecentErrors = last3.length>=3 && last3.every(a=>a.correct);
    const dims = word.dims || {};
    const indepOk = dims.independentProduction && dims.independentProduction.success>=2;
    const novelOk = dims.novelApplication && dims.novelApplication.success>=1;
    const examReady = !!(indepOk && novelOk && noRecentErrors);
    const strong = last5Rate>=0.8 && !hasRecentFail && word.levelState.level>=3 && word.srs.interval>=10;
    if(examReady){
      const examDate = Storage.state.settings.examDate;
      if(!examDate) return 'Exam Ready';
      const srsOk = word.srs.nextReview && word.srs.nextReview<=examDate;
      // Phase 4: an exam-ready word shouldn't have any FSRS-scheduled dimension
      // (recognition/meaningRecall/production) currently lapsing or due past the
      // exam -- otherwise "Exam Ready" would ignore what FSRS already knows about
      // this word. A dimension that's never been reviewed yet (reps===0) doesn't
      // count against readiness -- "hasn't started" isn't "failing".
      const examEndMs = new Date(examDate+'T23:59:59.999').getTime();
      const fsrsOk = Object.keys(word.fsrs||{}).every(dim=>{
        const card = word.fsrs[dim];
        if(!card || card.reps===0) return true;
        if(card.state===FSRSScheduler.State.Relearning) return false;
        return new Date(card.due).getTime()<=examEndMs;
      });
      return (srsOk && fsrsOk) ? 'Exam Ready' : 'Stable';
    }
    if(strong) return 'Stable';
    if(rh.length<3 || word.levelState.level<=2) return 'Learning';
    if(last5Rate<0.6 || hasRecentFail) return 'Unstable';
    return 'Learning';
  },

  isOverdue(word){ return word.history.length>0 && word.srs.nextReview < Utils.todayISO(); },
  isDueToday(word){ return word.history.length>0 && word.srs.nextReview === Utils.todayISO(); },
  isNew(word){ return word.history.length===0; },

  findByText(text){
    const norm = Utils.normalize(text);
    if(!norm) return null;
    return Storage.state.words.find(w=>Utils.normalize(w.word)===norm) || null;
  },

  hasRecentError(word, days){
    days = days==null ? 7 : days;
    return Storage.state.errorLog.some(e=>e.wordId===word.id && Utils.diffDays(e.date, Utils.todayISO())<=days);
  },

  resetDim(word, dimKey){
    if(word.dims && word.dims[dimKey]) word.dims[dimKey] = { status:'Not assessed', success:0, fail:0 };
  }
};

/* ============================== WRITING ERROR INTEGRATION ==============================
   Shared bridge used by the Weekly Writing Audit and Timed Exam Deployment modules so
   they reuse the same error-diagnosis system / mastery dimensions as the Teaching Phase
   and Practice Engine, rather than keeping a separate error model. */
const ErrorIntegration = {
  /* Records a production-context vocabulary error found outside normal practice
     (a writing audit tag, or an exam "used incorrectly" mark), and schedules the
     word for targeted retrieval by resetting its production dimensions and pulling
     it into today's due queue. */
  recordProductionError(word, category, source){
    WordModel.logError(word, category, 4);
    WordModel.logAttempt(word, 4, false, { phase: source||'writing', errorCategory: category });
    WordModel.resetDim(word, 'independentProduction');
    WordModel.resetDim(word, 'novelApplication');
    word.srs.interval = 1;
    word.srs.nextReview = Utils.todayISO();
    word.levelState.level = Utils.clamp(word.levelState.level, 2, 3);
  },
  /* Records a confirmed-correct production-context usage (exam "used correctly"). */
  recordProductionSuccess(word, source){
    WordModel.logAttempt(word, 4, true, { phase: source||'writing' });
    WordModel.updateLadder(word, 4, true);
    WordModel.applyRating(word, 'easy');
    DimModel.record(word, 'independentProduction', true);
    DimModel.record(word, 'novelApplication', true);
  }
};

/* ============================== PRACTICE ENGINE ============================== */
const DRILL_TYPES = ['combo','confusable','rewrite'];

const Practice = {
  session: null, // {queue:[{word,level,drillType}], idx, results:[], hintUsed, mode, phase}

  buildDueQueue(opts){
    opts = opts || {};
    const words = Storage.state.words;
    let pool = words.filter(w=>w.teaching && w.teaching.completed);
    if(opts.category) pool = pool.filter(w => (w.errorCounts[opts.category]||0) > 0);
    // Group by SRS priority (overdue first, then recently-failed, then due-today), but
    // shuffle within each group so the word order isn't the same every session — only
    // the exact due date should break ties, not each word's position in the word list.
    const overdue = Utils.shuffle(pool.filter(w=>WordModel.isOverdue(w))).sort((a,b)=>a.srs.nextReview.localeCompare(b.srs.nextReview));
    const failedRecent = Utils.shuffle(pool.filter(w=>{
      const last = w.history[w.history.length-1];
      return last && !last.correct && Utils.diffDays(last.date, Utils.todayISO())<=1 && !overdue.includes(w);
    }));
    const dueToday = Utils.shuffle(pool.filter(w=>WordModel.isDueToday(w) && !overdue.includes(w) && !failedRecent.includes(w)));
    let queue = overdue.concat(failedRecent, dueToday);
    if(opts.includeNew){
      const newWords = Utils.shuffle(pool.filter(w=>WordModel.isNew(w)));
      queue = queue.concat(newWords.slice(0, opts.newLimit==null?newWords.length:opts.newLimit));
    }
    // dedupe
    const seen = new Set();
    queue = queue.filter(w=>{ if(seen.has(w.id)) return false; seen.add(w.id); return true; });
    const legacyItems = queue.map(w=>({ track:'legacy', word:w, level: opts.category ? Math.max(2, w.levelState.level-1) : w.levelState.level }));

    // Category-specific drilling (e.g. "practice my Collocation errors") stays legacy-only —
    // FSRS-scheduled recognition isn't tied to an error category today.
    if(opts.category) return legacyItems;

    // Recognition, meaningRecall (cued recall), and production are each scheduled
    // independently by FSRS now (their own due dates, not gated by word.levelState.level),
    // so they're selected separately here and merged in — everything else above is exactly
    // the pre-FSRS logic, untouched. meaningRecall is ungated, same as recognition: cued
    // recall has no real prerequisite in this app today (every word starts at legacy ladder
    // level 2, the cued-recall level, and never falls below it), unlike production, which
    // is gated because it's genuinely downstream of climbing the ladder. Production's gate
    // is an engineering sequencing policy, not a validated learning principle, recomputed
    // live (not a persisted "unlocked" flag).
    const now = new Date();
    const recognitionItems = DueQueue.buildDimensionItems(pool, 'recognition', now);
    const meaningRecallItems = DueQueue.buildDimensionItems(pool, 'meaningRecall', now);
    const productionItems = DueQueue.buildDimensionItems(pool, 'production', now,
      w => w.fsrs.recognition.stability >= FSRSScheduler.PRODUCTION_UNLOCK_STABILITY);
    const fsrsItems = DueQueue.mergeQueues(DueQueue.mergeQueues(recognitionItems, meaningRecallItems), productionItems);
    return DueQueue.mergeQueues(fsrsItems, legacyItems);
  },

  buildProductionQueue(limit){
    const today = Utils.todayISO();
    const eligible = Storage.state.words.filter(w=>w.teaching && w.teaching.completed && w.history.length>0 &&
      !w.history.some(h=>h.date===today && h.level===4));
    const shuffled = Utils.shuffle(eligible);
    return shuffled.slice(0, limit||8).map(w=>({ word:w, level:4, drillType: Utils.pick(DRILL_TYPES) }));
  },

  generateQuestion(item){
    if(item.track==='fsrs'){
      // Reuses the existing per-dimension question generators/UI unchanged — only what
      // happens after grading (see handleGraded) differs for an FSRS-track item.
      const q = item.dimension==='production' ? this.genProduction(item.word) :
        item.dimension==='meaningRecall' ? this.genCuedRecall(item.word) :
        this.genRecognition(item.word);
      q.track = 'fsrs';
      q.dimension = item.dimension;
      return q;
    }
    const word = item.word;
    const level = item.level;
    if(item.drillType) return this.generateDrill(item);
    if(level<=1) return this.genRecognition(word);
    if(level===2) return this.genCuedRecall(word);
    if(level===3) return this.genCloze(word);
    return this.genProduction(word);
  },

  // Grades one FSRS-scheduled dimension for a word. Updates only word.fsrs[dimension] --
  // never word.srs or word.levelState, which the legacy dimensions still own exclusively.
  gradeFsrs(word, dimension, ratingKey){
    const settings = Storage.state.settings.fsrs;
    const before = word.fsrs[dimension];
    const result = FSRSScheduler.grade(before, ratingKey, {
      now: new Date(),
      desiredRetention: settings.desiredRetention,
      maxIntervalDays: settings.maxIntervalDays || undefined,
      params: settings.params || undefined
    });
    // Write this review's result first. The "already Exam Ready?" gate below reads
    // word.fsrs[dimension] via computeMastery -- it must see the fresh grade (this
    // review may itself be what makes the word ready), not the pre-review card.
    word.fsrs[dimension] = result.card;

    const logEntry = {
      ts: Date.now(), wordId: word.id, dimension, rating: ratingKey,
      predictedR: result.predictedR, outcome: ratingKey!=='again',
      desiredRetentionAtSchedule: settings.desiredRetention,
      stabilityBefore: before.stability, stabilityAfter: result.card.stability,
      difficultyBefore: before.difficulty, difficultyAfter: result.card.difficulty,
      elapsedDays: result.card.elapsed_days, scheduledDays: result.card.scheduled_days
    };
    // Debug breadcrumb for the production promotion policy: what recognition's stability
    // was at the moment production got its first-ever review. Not used by any analysis
    // this app builds — just inspectable if the unlock threshold ever needs revisiting.
    if(dimension==='production' && before.state===0){
      logEntry.recognitionStabilityAtUnlock = word.fsrs.recognition.stability;
    }

    // Phase 4: exam-date compression. Gated on the word's mastery AFTER this review's
    // grade has been written (see comment above) -- computeMastery reads word.fsrs.*
    // as part of its Exam Ready check (Phase 4), so it must see this review's outcome,
    // not stale pre-grade state. No-op entirely when no exam date is set, same as the
    // legacy compression in WordModel.applyRating.
    const examDate = Storage.state.settings.examDate;
    if(examDate && examDate >= Utils.todayISO() && WordModel.computeMastery(word)!=='Exam Ready'){
      const compressed = FSRSScheduler.compressForExam(word.fsrs[dimension], examDate, new Date());
      if(compressed){
        logEntry.examCompressed = true;
        logEntry.naturalDue = word.fsrs[dimension].due;
        logEntry.naturalScheduledDays = word.fsrs[dimension].scheduled_days;
        word.fsrs[dimension] = compressed;
        logEntry.scheduledDays = compressed.scheduled_days;
      }
    }

    Storage.state.fsrsReviewLog.push(logEntry);
    if(Storage.state.fsrsReviewLog.length>FSRS_REVIEW_LOG_CAP){
      Storage.state.fsrsReviewLog = Storage.state.fsrsReviewLog.slice(-FSRS_REVIEW_LOG_CAP);
    }
  },

  genRecognition(word){
    const others = Storage.state.words.filter(w=>w.id!==word.id && w.meaning);
    const distractors = Utils.shuffle(others).slice(0,3).map(w=>w.meaning);
    const options = Utils.shuffle([word.meaning, ...distractors]);
    return { type:'recognition', word, level:1, promptTitle:'Warm-up: choose the meaning', prompt: word.word,
      options, correctAnswer: word.meaning, autoGrade:true };
  },

  genCuedRecall(word){
    const meaning = (word.meaning||'').trim();
    const contexts = (word.contexts||[]).map(c=>(c||'').trim()).filter(Boolean);
    const collocations = (word.collocations||[]).map(c=>(c||'').trim()).filter(Boolean);

    const variants = [];
    if(meaning) variants.push('Meaning: ' + meaning);
    if(contexts.length) variants.push('Context: ' + WordModel.maskWord(Utils.pick(contexts), word.word) + (meaning ? '  (Meaning: ' + meaning + ')' : ''));
    if(collocations.length && meaning){
      const masked = WordModel.maskWord(Utils.pick(collocations), word.word);
      variants.push('It often appears with "' + masked + '". Meaning: ' + meaning);
    }

    const cue = variants.length ? Utils.pick(variants) : 'No stored definition or context for this word yet — type the word from memory.';
    return { type:'cued', word, level:2, promptTitle:'Type the word', prompt: cue, correctAnswer: word.word, autoGrade:true };
  },

  genCloze(word){
    const c = WordModel.getClozeSentence(word);
    if(!c) return this.genCuedRecall(word);
    return { type:'cloze', word, level:3, promptTitle:'Fill in the blank', prompt: c.display, correctAnswer: c.answer, autoGrade:true };
  },

  genProduction(word){
    const meaning = (word.meaning||'').trim();
    const contexts = (word.contexts||[]).map(c=>(c||'').trim()).filter(Boolean);
    const collocations = (word.collocations||[]).map(c=>(c||'').trim()).filter(Boolean);
    const topic = WordModel.maskWord(contexts.length ? Utils.pick(contexts) : meaning, word.word);

    const twists = [
      'Write an original sentence using the target word.',
      'Write it as a question.',
      'Use a more formal register than usual.',
      'Use it in a casual, spoken-style sentence.'
    ];
    if(collocations.length){
      const maskedColloc = WordModel.maskWord(Utils.pick(collocations), word.word);
      twists.push('Try to naturally work in the pattern "'+maskedColloc+'".');
    }
    const twist = Utils.pick(twists);
    return { type:'production', word, level:4, promptTitle:'Free production', prompt: 'Situation: ' + topic,
      sub: twist, meaningHint: meaning, autoGrade:false };
  },

  generateDrill(item){
    const word = item.word;
    const type = item.drillType;
    const meaningHint = (word.meaning||'').trim();
    if(type==='combo'){
      const others = Storage.state.words.filter(w=>w.id!==word.id && w.history.length>0);
      const partner = others.length ? Utils.pick(others) : null;
      if(!partner) return this.genProduction(word);
      return { type:'drill', drillType:'combo', word, partner, level:4, promptTitle:'Combine two words',
        prompt: 'Write ONE natural sentence using both the target word and "'+partner.word+'".', meaningHint, autoGrade:false };
    }
    if(type==='confusable' && word.contrast){
      return { type:'drill', drillType:'confusable', word, level:4, promptTitle:'Distinguish confusables',
        prompt: 'Contrast: ' + WordModel.maskWord(word.contrast, word.word), sub: 'Write one or two sentences that clearly show the difference, using the target word.', meaningHint, autoGrade:false };
    }
    if(type==='rewrite' && word.production){
      const original = WordModel.maskWord(word.production, word.word);
      return { type:'drill', drillType:'rewrite', word, level:4, promptTitle:'Rewrite in a new register',
        prompt: 'Original: "' + original + '"', sub:'Rewrite the same idea using the target word in a different register or context.', meaningHint, autoGrade:false };
    }
    return this.genProduction(word);
  },

  grade(question, userInput){
    if(!question.autoGrade) return null;
    if(question.type==='recognition') return userInput === question.correctAnswer;
    const norm = Utils.normalize(userInput);
    const target = Utils.normalize(question.correctAnswer);
    if(norm===target) return true;
    return false;
  },

  /* View-only navigation to a previously graded card. Never mutates SRS state —
     it only points the renderer at the already-graded result for idx-1 and
     remembers where to snap back to. Refuses to move if the previous slot has no
     graded result yet (an ungraded card can never be reached this way). */
  canGoBack(){
    const s = this.session;
    if(!s || s.idx<=0) return false;
    return s.results.some(r=>r.idx===s.idx-1);
  },
  goBack(){
    const s = this.session;
    if(!this.canGoBack()) return;
    s.savedIdx = s.idx;
    s.idx = s.idx-1;
    s.reviewing = true;
  },
  returnToCurrent(){
    const s = this.session;
    if(!s || !s.reviewing) return;
    s.idx = s.savedIdx!=null ? s.savedIdx : s.idx+1;
    s.reviewing = false;
    s.savedIdx = null;
  },

  /* ---- Session persistence (survive a page refresh mid-practice) ----
     Practice.session holds live word object references, which can't go through
     JSON.stringify as-is (circular-ish, and would duplicate the whole word into
     Storage). persist() swaps those for word ids before saving into
     Storage.state.practiceSession; restore() looks the ids back up against the
     current word list on load. If a referenced word was deleted in the meantime
     it's silently dropped from the resumed queue rather than crashing. */
  serializeQuestion(q){
    if(!q) return null;
    const copy = Object.assign({}, q);
    copy.wordId = copy.word ? copy.word.id : null; delete copy.word;
    if(copy.partner){ copy.partnerId = copy.partner.id; delete copy.partner; }
    return copy;
  },
  deserializeQuestion(sq){
    if(!sq) return null;
    const copy = Object.assign({}, sq);
    copy.word = Storage.state.words.find(w=>w.id===copy.wordId) || null;
    delete copy.wordId;
    if(copy.partnerId){ copy.partner = Storage.state.words.find(w=>w.id===copy.partnerId) || null; delete copy.partnerId; }
    return copy.word ? copy : null;
  },
  persist(){
    if(!this.session){ this.clearPersisted(); return; }
    const s = this.session;
    Storage.state.practiceSession = {
      mode: s.mode,
      idx: s.idx,
      reviewing: !!s.reviewing,
      savedIdx: s.savedIdx==null ? null : s.savedIdx,
      queue: s.queue.map(item=>({ wordId: item.word.id, level: item.level, drillType: item.drillType||null })),
      results: s.results.map(r=>({
        idx: r.idx, wordId: r.word.id, userVal: r.userVal, correct: r.correct,
        rating: r.rating||null, category: r.category||null, question: this.serializeQuestion(r.question)
      }))
    };
    Storage.save();
  },
  clearPersisted(){
    if(Storage.state.practiceSession){ Storage.state.practiceSession = null; Storage.save(); }
  },
  restore(){
    const saved = Storage.state.practiceSession;
    if(!saved) return;
    const queue = saved.queue.map(item=>{
      const word = Storage.state.words.find(w=>w.id===item.wordId);
      return word ? { word, level: item.level, drillType: item.drillType||undefined } : null;
    }).filter(Boolean);
    if(!queue.length){ this.clearPersisted(); return; }
    const results = (saved.results||[]).map(r=>{
      const word = Storage.state.words.find(w=>w.id===r.wordId);
      if(!word) return null;
      return { idx:r.idx, word, question:this.deserializeQuestion(r.question), userVal:r.userVal, correct:r.correct, rating:r.rating, category:r.category };
    }).filter(Boolean);
    this.session = {
      queue, results, mode: saved.mode,
      idx: Utils.clamp(saved.idx, 0, queue.length),
      reviewing: !!saved.reviewing,
      savedIdx: saved.savedIdx
    };
  }
};

const App = {
  currentTab: 'dashboard',
  practiceState: null,

  init(){
    Storage.load();
    this.applyTheme();
    Practice.restore();
    document.getElementById('tabs').addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-tab]');
      if(btn) this.showTab(btn.dataset.tab);
    });
    document.getElementById('app').addEventListener('click', (e)=>{
      const btn = e.target.closest('.speak-btn');
      if(btn) Speech.speak(btn.dataset.word);
    });
    this.showTab(Practice.session ? 'practice' : 'dashboard');
  },

  updateDueBadge(){
    const el = document.getElementById('dueBadge');
    if(!el) return;
    const words = Storage.state.words;
    const overdue = words.filter(w=>WordModel.isOverdue(w)).length;
    const dueToday = words.filter(w=>WordModel.isDueToday(w)).length;
    const total = overdue + dueToday;
    el.textContent = total + (total===1 ? ' word due today' : ' words due today');
  },

  applyTheme(){
    const t = Storage.state.settings.theme;
    if(t==='system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  },
  cycleTheme(){
    const order = ['system','light','dark'];
    const i = order.indexOf(Storage.state.settings.theme);
    Storage.state.settings.theme = order[(i+1)%order.length];
    Storage.save(); this.applyTheme();
    Utils.toast('Theme: ' + Storage.state.settings.theme);
  },

  showTab(tab){
    this.currentTab = tab;
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+tab).classList.add('active');
    this.updateDueBadge();
    if(tab==='dashboard') Views.renderDashboard();
    else if(tab==='practice') Views.renderPracticeHome();
    else if(tab==='add') Views.renderAddForm();
    else if(tab==='bank') Views.renderBank();
    else if(tab==='errors') Views.renderErrors();
    else if(tab==='writing') Views.renderWriting();
    else if(tab==='analytics') Analytics.render();
    else if(tab==='settings') Views.renderSettings();
  }
};

  handleParseFill(el){
    const textarea = el.querySelector('#pasteArea');
    const errBox = el.querySelector('#pasteErrors');
    const okBox = el.querySelector('#pasteSuccess');
    errBox.innerHTML = ''; okBox.textContent = '';

    const rawLines = textarea.value.split(/\r?\n/);
    const lines = rawLines.map((l,i)=>({ text:l, num:i+1 })).filter(l=>l.text.trim().length>0);
    if(lines.length===0){
      errBox.textContent = 'Paste at least one line of structured text first.';
      return;
    }

    if(lines.length===1){
      let data;
      try{
        data = BulkImport.parseLine(lines[0].text);
      }catch(e){
        errBox.textContent = 'Line ' + lines[0].num + ': ' + e.message;
        return;
      }
      if(Storage.state.words.some(w2=>Utils.normalize(w2.word)===Utils.normalize(data.word))){
        errBox.textContent = 'Line ' + lines[0].num + ': "' + data.word + '" already exists in your bank.';
        return;
      }
      this.renderAddForm(data, null);
      Utils.toast('Parsed — review and save below.');
      return;
    }

    // multiple lines: parse each, add valid ones directly, report failures
    const seen = new Set(Storage.state.words.map(w2=>Utils.normalize(w2.word)));
    const failures = [];
    const addedWords = [];
    lines.forEach(line=>{
      let data;
      try{
        data = BulkImport.parseLine(line.text);
      }catch(e){
        failures.push({ line, message: e.message });
        return;
      }
      const key = Utils.normalize(data.word);
      if(seen.has(key)){
        failures.push({ line, message: '"'+data.word+'" already exists or is duplicated in this batch.' });
        return;
      }
      seen.add(key);
      const w2 = WordModel.create(data);
      Storage.state.words.push(w2);
      addedWords.push(w2);
    });

    if(addedWords.length) Storage.save();

    if(failures.length){
      errBox.innerHTML = failures.map(f=>'Line '+f.line.num+': '+Utils.escapeHtml(f.message)).join('<br>');
      textarea.value = failures.map(f=>f.line.text).join('\n');
      okBox.textContent = addedWords.length ? ('Added ' + addedWords.length + ' word(s): ' + addedWords.map(w=>w.word).join(', ') + '. Fix the remaining line(s) above, or begin teaching the added words now.') : '';
      if(addedWords.length){
        const beginRow = document.createElement('div');
        beginRow.className = 'btn-row';
        beginRow.style.marginTop = '10px';
        beginRow.innerHTML = '<button type="button" class="btn primary small" id="beginTeachPartialBtn">▶ Begin Teaching Added Word(s)</button>';
        okBox.after(beginRow);
        beginRow.querySelector('#beginTeachPartialBtn').addEventListener('click', ()=>{
          Teaching.startQueue(addedWords, ()=>{ App.showTab('bank'); Utils.toast('Teaching complete for all imported words.'); });
        });
      }
      return;
    }
    textarea.value = '';
    okBox.textContent = addedWords.length ? ('Added ' + addedWords.length + ' word(s): ' + addedWords.map(w=>w.word).join(', ')) : '';
    if(addedWords.length){
      this.renderBeginTeaching(addedWords, ()=>{ App.showTab('bank'); Utils.toast('Teaching complete for all imported words.'); });
    }
  },

  renderBeginTeaching(words, onAllComplete){
    const el = document.getElementById('view-add');
    const list = words.map(w=>'<li>'+Utils.escapeHtml(w.word)+'</li>').join('');
    el.innerHTML = '<div class="card center">' +

      '<p class="field-hint">Before these enter your spaced-review queue, each one goes through a short Teaching Phase — introduce, define, contextualize, then guided → supported → constrained → independent practice.</p>' +

  handleSaveWord(form, existing){
    const fd = new FormData(form);
    const word = (fd.get('word')||'').trim();
    const meaning = (fd.get('meaning')||'').trim();
    const formField = (fd.get('form')||'').trim();
    const grammar = (fd.get('grammar')||'').trim();
    const contrast = (fd.get('contrast')||'').trim();
    const production = (fd.get('production')||'').trim();
    const mnemonic = (fd.get('mnemonic')||'').trim();
    const pronunciation = (fd.get('pronunciation')||'').trim();
    const wordType = (fd.get('wordType')||'general').trim();
    const collocations = readRepeat(form, 'collocations');
    const contexts = readRepeat(form, 'contexts');
    const cloze = readRepeatPlain(form, 'cloze');

    const errors = [];
    if(!word) errors.push('Word is required.');
    if(!meaning) errors.push('Core meaning is required.');
    if(!formField) errors.push('Form is required.');
    if(!grammar) errors.push('Grammar is required.');
    if(collocations.length<2) errors.push('At least 2 collocations are required.');
    if(!contrast) errors.push('Contrast is required.');
    if(contexts.length<2) errors.push('At least 2 typical contexts are required.');
    if(!production) errors.push('A production sentence is required.');
    if(!existing && word && Storage.state.words.some(w2=>Utils.normalize(w2.word)===Utils.normalize(word))){
      errors.push('This word already exists in your bank.');
    }

    const errEl = document.getElementById('formErrors');
    if(errors.length){
      errEl.innerHTML = errors.map(Utils.escapeHtml).join('<br>');
      return;
    }
    errEl.innerHTML = '';

    let finalCloze = cloze.filter(Boolean);
    if(finalCloze.length===0 && production) finalCloze = [];

    if(existing){
      Object.assign(existing, { word, meaning, form: formField, grammar, collocations, contrast, contexts, production, mnemonic, pronunciation, cloze: finalCloze, wordType });
      Storage.save();
      Utils.toast('Word updated.');
      App.showTab('bank');
    } else {
      const w = WordModel.create({ word, meaning, form: formField, grammar, collocations, contrast, contexts, production, mnemonic, pronunciation, cloze: finalCloze, wordType });
      Storage.state.words.push(w);
      Storage.save();
      this.renderBeginTeaching([w], ()=>App.showTab('bank'));
    }

    function readRepeat(form, name){
      const group = form.querySelector('.repeat-group[data-name="'+name+'"]');
      return Array.from(group.querySelectorAll('input')).map(i=>i.value.trim()).filter(Boolean);
    }
    function readRepeatPlain(form, name){
      const group = form.querySelector('.repeat-group[data-name="'+name+'"]');
      return Array.from(group.querySelectorAll('input')).map(i=>i.value.trim());
    }
  },

        const achieved = DIM_KEYS.filter(k=>w.dims && w.dims[k] && w.dims[k].status==='Achieved').length;
        const typeLabel = (WORD_TYPES.find(t=>t.key===w.wordType)||WORD_TYPES[0]).label;

        Teaching.startQueue([w], ()=>App.showTab('bank'));
      });
      const examplesBtn = row.querySelector('.examples-btn');
      if(examplesBtn) examplesBtn.addEventListener('click', ()=>{
        const w = Storage.state.words.find(x=>x.id===id);
        const panel = row.querySelector('.examples-panel');
        const opening = panel.classList.contains('hidden');
        if(opening){
          const sentences = (w.cloze||[]).concat(w.production ? [w.production] : []).filter(Boolean);
          const wb = new RegExp('\\b'+Utils.escapeRegex(w.word)+'\\b','ig');
          panel.innerHTML = sentences.length ?
            '<ul class="teach-list">' + sentences.map(s=>'<li>'+Utils.escapeHtml(s).replace(wb, m=>'<b>'+m+'</b>')+'</li>').join('') + '</ul>' :

          Storage.state.words = Storage.state.words.filter(x=>x.id!==id);

    });
