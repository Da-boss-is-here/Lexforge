  // Extracted so Achievements.evaluate (write path, Phase C) and this render (read path)
  // compute the unlock context identically, rather than keeping two copies of this logic
  // in sync by hand.
  buildAchievementContext(){
    const words = Storage.state.words;
    const taughtCount = words.filter(w=>w.teaching && w.teaching.completed).length;
    const examReadyCount = words.filter(w=>WordModel.computeMastery(w)==='Exam Ready').length;
    // computeStreakFromActivity feeds both the display (streak-banner, Study Streak tile)
    // and the Consistent Learner achievement's check()/metric, in the same ctx -- avoids the
    // achievements card ever showing two different streak numbers for the same concept.
    // (Phase E removed the old Analytics.computeStreak/activityDates, which this replaced.)
    const streak = computeStreakFromActivity(Storage.state.dailyActivity||{}, Utils.todayISO()).current;
    const errorLogCount = Storage.state.errorLog.length;
    const writingSessions = (Storage.state.writingLog||[]).length + (Storage.state.examLog||[]).length;
    return { taughtCount, examReadyCount, streak, errorLogCount, writingSessions };
  },

  renderAchievementsSection(){
    const words = Storage.state.words;
    const totalAttempts = words.reduce((sum,w)=>sum+w.history.length, 0);
    // Headline accuracy is retrieval-only (phase!=='teaching'): teaching-phase attempts are
    // scaffolded MCQ/self-graded steps with the answer visible, so folding them into the
    // headline number inflates it. Teaching accuracy is kept as its own secondary stat.
    const retrievalAttempts = words.reduce((sum,w)=>sum+w.history.filter(h=>h.phase!=='teaching').length, 0);
    const retrievalCorrect = words.reduce((sum,w)=>sum+w.history.filter(h=>h.phase!=='teaching'&&h.correct).length, 0);
    const accuracy = retrievalAttempts ? Math.round(retrievalCorrect/retrievalAttempts*100) : 0;
    const teachingAttempts = totalAttempts - retrievalAttempts;
    const teachingCorrect = words.reduce((sum,w)=>sum+w.history.filter(h=>h.phase==='teaching'&&h.correct).length, 0);
    const teachingAccuracy = teachingAttempts ? Math.round(teachingCorrect/teachingAttempts*100) : 0;
    const fullSessionCount = (Storage.state.sessionLog||[]).length;

    const ctx = this.buildAchievementContext();
    const { streak, examReadyCount } = ctx;

    const cards = this.ACHIEVEMENTS.map(a=>{
      const rec = Storage.state.achievements[a.id];
      const unlocked = a.check(ctx) || !!(rec && rec.unlockedAt);
      const progress = (!unlocked && a.metric && a.target) ? '<div class="achv-progress"><div class="achv-progress-bar" style="width:'+Math.round(Utils.clamp(a.metric(ctx)/a.target,0,1)*100)+'%"></div></div><div class="achv-progress-label">'+Math.min(a.metric(ctx),a.target)+'/'+a.target+' '+Utils.escapeHtml(a.unit||'')+'</div>' : '';
      return '<div class="achv-card '+(unlocked?'unlocked':'locked')+'">' +
        '<div class="icon">'+a.icon+'</div>' +
        '<div class="name">'+Utils.escapeHtml(a.name)+'</div>' +
        '<div class="desc">'+Utils.escapeHtml(a.desc)+'</div>' +
        (unlocked?'':'<div class="lock">🔒 Locked</div>'+progress) +
        '</div>';
    }).join('');

    return '<div class="card">' +
      '<div class="streak-banner"><span class="flame">🔥</span> '+streak+'-day study streak</div>' +
      '<div class="achv-stats-grid" style="margin-top:14px;">' +
      '<div class="stat"><div class="num">'+streak+'</div><div class="label">Study Streak</div></div>' +
      '<div class="stat"><div class="num">'+totalAttempts+'</div><div class="label">Practice Attempts</div></div>' +
      '<div class="stat '+(accuracy>=80?'good':accuracy>0&&accuracy<50?'bad':'')+'"><div class="num">'+accuracy+'%</div><div class="label">Retrieval Accuracy</div></div>' +
      '<div class="stat good"><div class="num">'+examReadyCount+'</div><div class="label">Exam Ready</div></div>' +
      '<div class="stat"><div class="num">'+teachingAccuracy+'%</div><div class="label">Teaching Accuracy</div></div>' +
      '<div class="stat"><div class="num">'+fullSessionCount+'</div><div class="label">Full Sessions</div></div>' +
      '</div>' +
      '<h3 style="margin-top:18px;">🏆 Achievements</h3>' +
      '<div class="achv-scroll">' + cards + '</div>' +
      '</div>';
  },

  // Phase D un-defers Phase A's item #3: the "reached Stable+" line was pulled entirely
  // (rather than shipped on a last-history-entry-date heuristic) because there was no real
  // per-word "became Stable" timestamp then. Phase C added word.firstMasteryAt for exactly
  // this, so the line now uses that real date as its x-coordinate instead of a proxy. Words
  // with firstMasteryAt===null are excluded from this line only (they still count in the
  // "added" line via word.created).
  buildLearningProgressData(){
    const words = Storage.state.words;
    const createdDates = words.map(w=>w.created).filter(Boolean).sort();
    const today = Utils.todayISO();
    const earliest = createdDates[0] || today;
    const spanDays = Utils.diffDays(earliest, today);
    const start = spanDays < 29 ? earliest : Utils.addDays(today, -29);
    // isoFromMs reads the local calendar date, matching `cursor`/`today` (both built from
    // Utils.todayISO()/addDays, local) -- toISOString().slice(0,10) reads the UTC date instead,
    // which disagreed with the local frame by up to a day and could push a late-evening-local
    // firstMasteryAt past the `cursor <= today` cutoff, collapsing this line to 0 for that word.
    const masteryDates = words
      .filter(w=>typeof w.firstMasteryAt==='number')
      .map(w=>Utils.isoFromMs(w.firstMasteryAt));
    const labels = [], added = [], reached = [];
    let cursor = start;
    let guard = 0;
    while(cursor <= today && guard < 400){
      labels.push(cursor);
      added.push(words.filter(w=>w.created<=cursor).length);
      reached.push(masteryDates.filter(d=>d<=cursor).length);
      cursor = Utils.addDays(cursor, 1);
      guard++;
    }
    return { labels, added, reached };
  },

  renderProgressChart(theme){
    const { labels, added, reached } = this.buildLearningProgressData();
    this.charts.progress = new Chart(document.getElementById('chartProgress'), {
      type: 'line',
      data: {
        labels: labels.map(d=>Utils.fmtDate(d)),
        datasets: [{
          label: 'Words Added',
          data: added,
          borderColor: theme.accent,
          backgroundColor: theme.accentWash,
          borderWidth: 2,
          fill: true,
          tension: .35,
          pointRadius: labels.length>20 ? 0 : 3,
          pointBackgroundColor: theme.accent,
          pointBorderWidth: 0
        }, {
          label: 'Reached Stable+',
          data: reached,
          borderColor: theme.good,
          backgroundColor: 'transparent',
          borderWidth: 2,
          fill: false,
          tension: .35,
          pointRadius: labels.length>20 ? 0 : 3,
          pointBackgroundColor: theme.good,
          pointBorderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        // Card header above already names the chart, so the built-in title is skipped
        // (Analytics layout pass) -- but the legend stays on here, unlike most other
        // charts, since two series now need distinguishing.
        plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 8, usePointStyle: true, pointStyle: 'circle', font: { size: 11 }, padding: 12 } }, title: { display: false } },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } },
          y: { grid: { color: theme.grid }, border: { display: false }, beginAtZero: true, ticks: { precision: 0 } }
        }
      }
    });
  },

  renderMasteryChart(theme){
    const words = Storage.state.words;
    const stages = ['New','Learning','Unstable','Stable','Exam Ready'];
    // Exam Ready used to be theme.text, which goes near-white in dark mode and reads as
    // the doughnut's empty/background color. Use a fixed hue instead of a theme-relative
    // one so the slice stays visible and distinct (from grid/accent/highlight/good) in
    // both themes.
    const colors = [theme.grid, theme.accent, theme.highlight, theme.good, '#8E5CF7'];
    const counts = stages.map(s=>words.filter(w=>WordModel.computeMastery(w)===s).length);
    const total = words.length;
    this.charts.mastery = new Chart(document.getElementById('chartMastery'), {
      type: 'doughnut',
      data: {
        labels: stages.map((s,i)=>s+' — '+counts[i]+' ('+(total?Math.round(counts[i]/total*100):0)+'%)'),
        datasets: [{ data: counts, backgroundColor: colors, borderWidth: 2, borderColor: theme.bgElev || '#fff' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '68%',
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 8, usePointStyle: true, pointStyle: 'circle', font: { size: 11 }, padding: 12 } },
          title: { display: false }

  renderForecastChart(theme){
    const buckets = [1,3,7,14,30];

    this.charts.forecast = new Chart(document.getElementById('chartForecast'), {
      type: 'bar',
      data: { labels: buckets.map(n=>'Next '+n+'d'), datasets: [{ label: 'Words due', data: counts, backgroundColor: theme.accent, borderRadius: 6, barThickness: 16 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, title: { display: false } },
        scales: { x: { grid: { color: theme.grid }, border: { display: false }, beginAtZero: true, ticks: { precision: 0 } }, y: { grid: { display: false }, border: { display: false } } }
      }
    });
  },

  // Kept but no longer called from render() (Phase E) -- see the "Weakest Vocabulary
  // Dimensions" note where its call used to be. Data source is computeFailuresByDimension,
  // the named pure function Phase E extracted so this stays available/testable.
  renderErrorChart(theme){

      options: {

        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, title: { display: false } },
        scales: { x: { grid: { color: theme.grid }, border: { display: false }, beginAtZero: true, ticks: { precision: 0 } }, y: { grid: { display: false }, border: { display: false } } }
      }
    });
  },

  LH_DIM_LABELS: { recognition:'Recognition', production:'Production', meaningRecall:'Meaning Recall' },
  LH_DIM_COLORS(theme){ return { recognition: theme.accent, production: theme.good, meaningRecall: theme.highlight }; },

  renderCalibrationChart(theme, log){
    const calibration = computeCalibration(log);
    const points = calibration.filter(b=>b.n>0).map(b=>({ x: Math.min((b.min+b.max)/2, 1), y: b.actual, n: b.n, label: b.label }));
    this.charts.calibration = new Chart(document.getElementById('chartCalibration'), {
      data: {

          { type:'scatter', label:'Buckets', data: points, backgroundColor: theme.accent, pointRadius: 6, pointHoverRadius: 7 },

        ]

  renderStabilityGrowthChart(theme, log, precomputedGrowth){

    const colors = this.LH_DIM_COLORS(theme);
    // A dimension's line is hidden entirely below 5 points -- a 1- or 2-point "line" is
    // just noise, not a trend.

    const maxLen = dims.reduce((m,d)=>Math.max(m, growth[d].length), 0);

        }))

          y: { grid: { color: theme.grid }, border: { display:false }, beginAtZero:true, title: { display:true, text:'Median stability (days)' } }
        }

  },

  renderRetentionIntervalChart(theme, log){
    const buckets = computeRetentionByInterval(log);
    this.charts.retentionInterval = new Chart(document.getElementById('chartRetentionInterval'), {
      type: 'bar',
      data: { labels: buckets.map(b=>b.label), datasets: [{ label:'Retention', data: buckets.map(b=>b.rate===null?null:Math.round(b.rate*100)), backgroundColor: theme.accent, borderRadius: 6, barThickness: 22 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => {
            const b = buckets[ctx.dataIndex];
            return b.n ? (Math.round(b.rate*100)+'% (n='+b.n+')') : 'no data';
          } } }
        },
        scales: {
          x: { grid: { display:false }, border: { display:false } },
          y: { grid: { color: theme.grid }, border: { display:false }, beginAtZero:true, max:100, ticks: { callback:v=>v+'%' } }

};

/* ============================== DAILY SESSION FLOW ============================== */
// Above this many items, Phase 1's due queue is no longer "a focused session" -- see
// renderPhase's phase-0 branch, which offers a 25-most-urgent option instead of forcing the
// full queue.
const MAX_SESSION = 25;
const Session = {
  active: false,
  phase: 0,
  phases: ['Retrieval Review','New Vocabulary','Context / Production','Error Review'],
  log: { reviewed:0, correct:0, newAdded:0, errors:0 },
  // Stash for the Phase 2 "Add a Word" monkey-patch (see renderPhase's addNowBtn handler /
  // _patch below). Holds the raw, unbound Views methods -- not bind(Views) copies, since
  // bind() returns a fresh function every call, and stashing a fresh bound copy on a
  // re-entry after _unpatch already ran would defeat the point of stashing a stable
  // reference. The wrapper below calls through with .call(Views, ...) instead.
  _origHandleSaveWord: null,
  _origRenderBeginTeaching: null,

  // Wraps Views.handleSaveWord/renderBeginTeaching for the duration of the Phase 2 Add
  // flow, so a save made from inside the session counts toward this.log.newAdded and
  // finishing teaching returns to the session instead of wherever Views.renderBeginTeaching
  // would normally send it. Idempotent: if either field is already stashed, patches are
  // already live (e.g. "Add a Word" clicked again without an intervening _unpatch), so this
  // returns without re-stashing -- re-stashing here would capture the *wrapper* as "the
  // original" and every save would double-wrap from then on.
  _patch(){
    if(this._origHandleSaveWord || this._origRenderBeginTeaching) return;
    this._origHandleSaveWord = Views.handleSaveWord;
    this._origRenderBeginTeaching = Views.renderBeginTeaching;
    Views.handleSaveWord = function(form, existing){
      const before = Storage.state.words.length;
      Session._origHandleSaveWord.call(Views, form, existing);
      if(Storage.state.words.length>before) Session.noteWordsAdded(1);
    };
    Views.renderBeginTeaching = function(words, onAllComplete){
      Session._origRenderBeginTeaching.call(Views, words, ()=>Session._backToSession());
    };
  },

  // Restores Views.handleSaveWord/renderBeginTeaching to their pre-patch originals.
  // Null-guarded per field, so a call when nothing (or only one field) is patched is a
  // no-op rather than overwriting a real method with null. Three call sites reach this:
  // _backToSession (the normal exit from the Phase 2 Add flow), App.showTab (covers
  // leaving via any tab button while patches are live), and finish (covers ending the
  // whole session while patches are live). Each is independently necessary -- don't
  // remove one thinking it's now redundant with another; each covers an exit path the
  // others don't reach.
  _unpatch(){
    if(this._origHandleSaveWord){ Views.handleSaveWord = this._origHandleSaveWord; this._origHandleSaveWord = null; }
    if(this._origRenderBeginTeaching){ Views.renderBeginTeaching = this._origRenderBeginTeaching; this._origRenderBeginTeaching = null; }
  },

  // Normal exit from the Phase 2 Add flow (teaching finished, or the word was saved without
  // starting teaching -- see Views.renderBeginTeaching's wrapper above). Direct DOM
  // navigation, same as the rest of this file's tab-switching, not a call through
  // App.showTab -- so unpatching has to happen here explicitly rather than relying on
  // App.showTab's own _unpatch call (see _unpatch's comment for the other call sites).
  _backToSession(){
    this._unpatch();
    App.currentTab='practice';
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-practice').classList.add('active');
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='practice'));
    Session.renderPhase();
  },

  // Durable state for the Daily Session itself (active flag / phase index / running log) --
  // separate from Practice.persist/restore, which only covers the in-progress practice queue
  // and gets nulled at every phase boundary (#doneBtn -> Practice.clearPersisted). Without a
  // carrier of its own, a refresh on any interstitial screen (where Practice.session is null
  // by design) silently dropped the whole Daily Session back to these defaults.
  persist(){
    Storage.state.sessionState = { active: this.active, phase: this.phase, log: Object.assign({}, this.log) };
    Storage.save();
  },
  clearPersisted(){
    if(Storage.state.sessionState){ Storage.state.sessionState = null; Storage.save(); }
  },
  restore(){
    const saved = Storage.state.sessionState;
    if(!saved || saved.active!==true) return;
    this.active = true;
    this.phase = (Number.isInteger(saved.phase) && saved.phase>=0 && saved.phase<this.phases.length) ? saved.phase : 0;
    this.log = {
      reviewed: Number(saved.log.reviewed)||0,
      correct: Number(saved.log.correct)||0,
      newAdded: Number(saved.log.newAdded)||0,
      errors: Number(saved.log.errors)||0
    };
  },

  // Bumps log.newAdded and flushes it durably when a session is live -- shared by the Phase 2
  // Add-flow patch below and by a paste-import made while a session is active (see
  // Views.handleParseFill), so both paths keep Storage.state.sessionState's newAdded count in
  // sync with what renderPhase's Phase 2 screen displays.
  noteWordsAdded(n){
    this.log.newAdded += n;
    if(this.active) this.persist();
  },

  start(){
    // Same confirm-before-overwrite guard as _beginQueue/Views.runFreePractice/
    // runDimensionPractice/runProductionDrills -- #startDailyBtn used to call this
    // unconditionally, so a live standalone Practice.session survived a Daily Session start
    // untouched: Skip Phase would advance past it, and finishing the stale card later would
    // misroute into finishPhase with that unrelated queue's results. Cancelling here leaves
    // both the live Practice.session and Session's own state untouched -- active is not set,
    // nothing is persisted, and there's no navigation.
    const proceed = ()=>{
      Practice.session = null;
      Practice.clearPersisted();
      this.active = true; this.phase = 0;
      this.log = { reviewed:0, correct:0, newAdded:0, errors:0 };
      this.persist();
      App.showTab('practice');
      this.renderPhase();
    };
    if(Practice.session) Modal.confirm('You have a practice session in progress. Start the Daily Session instead and lose your progress on the current one?', proceed);
    else proceed();
  },

  // Same confirm-before-overwrite guard as Views.runFreePractice/runProductionDrills/
  // runDimensionPractice -- renderPhase's three #beginBtn handlers used to assign
  // Practice.session unconditionally, bypassing those guards. Phase 1 is the reachable case
  // (a free-practice session left in progress, then Dashboard -> Start Daily Session ->
  // Begin); Phases 2/3 can only be reached after the prior phase already cleared
  // Practice.session on its own way in, so guarding them too is defense-in-depth rather than
  // a live bug. Confirm wraps the whole mutation, same as the run* guards: cancelling leaves
  // both the live Practice.session and Session's own state untouched.
  _beginQueue(queue){
    const proceed = ()=>{
      Practice.session = { queue, idx:0, results:[], mode:'session' };
      Practice.persist();
      Views.renderPracticeCard();
    };
    if(Practice.session) Modal.confirm('You have a practice session in progress. Start this one instead and lose your progress on the current one?', proceed);
    else proceed();
  },

  renderPhase(){
    const el = document.getElementById('view-practice');
    const nav = '<div class="session-phase-nav">' + this.phases.map((p,i)=>
      '<span class="dot '+(i<this.phase?'done':i===this.phase?'active':'')+'"></span>').join('') + '</div>';

    if(this.phase===0){
      const queue = Practice.buildDueQueue({includeNew:false});
      // Items, not words -- a word due in two dimensions (e.g. recognition and production)
      // contributes two entries to this queue. ~30s/item, floored at 2 minutes, same estimate
      // Dashboard's hero card uses -- the old static "~10-15 minutes" was written for a
      // bounded legacy-only queue and undersells (or lies about) the time an FSRS-heavy
      // queue actually takes.
      const estMinutes = queue.length ? Math.max(2, Math.round(queue.length*30/60)) : 0;
      const long = queue.length > MAX_SESSION;
      el.innerHTML = '<div class="practice-wrap">'+nav+'<div class="card center"><h2>Phase 1 · Retrieval Review</h2>' +
        '<p class="field-hint">'+queue.length+' review(s) due or overdue'+(queue.length ? ' — about ~'+estMinutes+' minute'+(estMinutes===1?'':'s')+'.' : '.')+'</p>' +
        (long ? '<div class="banner warn">⚠️ That\'s a long queue for one sitting. Practice just the most urgent items now, or take on the full queue.</div>' : '') +
        '<div class="btn-row" style="justify-content:center;">' +
        (queue.length===0 ? '' : long
          ? '<button class="btn primary" id="beginTopBtn">Begin '+MAX_SESSION+' Most Urgent</button><button class="btn ghost" id="beginAllBtn">Begin All ('+queue.length+')</button>'
          : '<button class="btn primary" id="beginBtn">Begin</button>') +
        '<button class="btn ghost" id="skipBtn">'+(queue.length?'Skip Phase':'Nothing due — Continue')+'</button></div></div></div>';
      el.querySelector('#skipBtn').addEventListener('click', ()=>this.nextPhase());
      if(long){
        // Both routes still go through _beginQueue -- slicing to the top MAX_SESSION
        // preserves buildDueQueue's own urgency ordering (overdue, sorted by nextReview,
        // before failedRecent, before dueToday), it's just a prefix of the same queue.
        el.querySelector('#beginTopBtn').addEventListener('click', ()=>this._beginQueue(queue.slice(0,MAX_SESSION)));
        el.querySelector('#beginAllBtn').addEventListener('click', ()=>this._beginQueue(queue));
      } else {
        const b = el.querySelector('#beginBtn');
        if(b) b.addEventListener('click', ()=>this._beginQueue(queue));
      }
    } else if(this.phase===1){
      el.innerHTML = '<div class="practice-wrap">'+nav+'<div class="card center"><h2>Phase 2 · New Vocabulary</h2>' +
        '<p class="field-hint">Add as many (or as few) new words as feels right — there\'s no fixed quota. Build a full Production Record for each.</p>' +
        '<div class="btn-row" style="justify-content:center;"><button class="btn primary" id="addNowBtn">Add a Word</button><button class="btn ghost" id="contBtn">Continue to Next Phase</button></div>' +
        '<div class="field-hint" style="margin-top:10px;">Added this session: '+this.log.newAdded+'</div></div></div>';
      el.querySelector('#addNowBtn').addEventListener('click', ()=>{
        App.currentTab='add';
        document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
        document.getElementById('view-add').classList.add('active');
        document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='add'));
        Views.renderAddForm();
        this._patch();
      });
      el.querySelector('#contBtn').addEventListener('click', ()=>this.nextPhase());
    } else if(this.phase===2){
      const queue = Practice.buildProductionQueue(6);
      el.innerHTML = '<div class="practice-wrap">'+nav+'<div class="card center"><h2>Phase 3 · Context / Production</h2>' +
        '<p class="field-hint">'+queue.length+' drill(s) ready — varied contexts, collocations, and registers.</p>' +
        '<div class="btn-row" style="justify-content:center;">' +
        (queue.length?'<button class="btn primary" id="beginBtn">Begin</button>':'') +
        '<button class="btn ghost" id="skipBtn">'+(queue.length?'Skip Phase':'Continue')+'</button></div></div></div>';
      el.querySelector('#skipBtn').addEventListener('click', ()=>this.nextPhase());
      const b = el.querySelector('#beginBtn');
      if(b) b.addEventListener('click', ()=>this._beginQueue(queue));
    } else if(this.phase===3){
      const queue = Storage.state.words.filter(w=>{
        const today = Utils.todayISO();
        // Same gate every other queue builder applies (buildDueQueue, buildProductionQueue):
        // a word still in teaching can log errors from its teaching steps, but it hasn't
        // entered retrieval yet, so it must not be pulled into Phase 4's retrieval practice.
        if(!(w.teaching && w.teaching.completed)) return false;
        // errorCounts[category]>0 is implied by having a matching errorLog entry at all
        // (WordModel.logError increments both together), so checking it separately here was
        // redundant.
        const erroredToday = Storage.state.errorLog.some(e=>e.wordId===w.id && e.date===today);
        if(!erroredToday) return false;
        const last = w.history[w.history.length-1];
        const resolvedSinceError = last && last.date===today && last.correct;
        return !resolvedSinceError;
      }).map(w=>({word:w, level:Math.max(2,w.levelState.level-1)}));
      el.innerHTML = '<div class="practice-wrap">'+nav+'<div class="card center"><h2>Phase 4 · Error Review</h2>' +
        '<p class="field-hint">'+queue.length+' word(s) had errors today — revisit at a slightly easier level to restore success.</p>' +
        '<div class="btn-row" style="justify-content:center;">' +
        (queue.length?'<button class="btn primary" id="beginBtn">Begin</button>':'') +
        '<button class="btn ghost" id="finishBtn">'+(queue.length?'Skip & Finish':'Finish Session')+'</button></div></div></div>';
      el.querySelector('#finishBtn').addEventListener('click', ()=>this.finish());
      const b = el.querySelector('#beginBtn');
      if(b) b.addEventListener('click', ()=>this._beginQueue(queue));
    }
  },

  finishPhase(results){
    results.forEach(r=>{ this.log.reviewed++; if(r.correct) this.log.correct++; else this.log.errors++; });
    this.persist();
    if(this.phase===3){ this.finish(); }
    else this.nextPhase();
  },

  nextPhase(){
    this.phase++;
    if(this.phase>=this.phases.length){ this.finish(); return; }
    this.persist();
    this.renderPhase();
  },

  finish(){
    // Covers ending the session (e.g. via Phase 4's "Skip & Finish") while the Phase 2
    // Add-flow patch is still live -- doesn't rely on the finish path having gone through
    // App.showTab first. See _unpatch's comment for the other call sites (_backToSession,
    // App.showTab).
    this._unpatch();
    this.active = false;
    // Storage.state.sessionState carried this Daily Session durably across every phase
    // boundary (see Session.persist/restore) -- clear it now so a stale active:true doesn't
    // linger into whatever practice runs next. practiceSession is cleared too in case a
    // Phase 4 queue was still in progress when "Skip & Finish" was clicked.
    Session.clearPersisted();
    Practice.clearPersisted();
    // Phase C/D: NOT bumping DailyActivity from this.log at all here. reviews/correct are
    // already covered per-attempt by Practice.handleGraded during the session (this.log is
    // built from the same `results` that handleGraded pushed to s.results, see finishPhase).
    // newAdded used to be bumped here (Phase C), but Phase D moved that bump into
    // WordModel.create itself so words added OUTSIDE a session count too -- since every
    // word added during a session also goes through WordModel.create, re-bumping newWords
    // from this.log here now would double-count it.
    Achievements.evaluate(Analytics.buildAchievementContext());
    Storage.state.sessionLog.push({ ts: Date.now(), date: Utils.todayISO(), summary: Object.assign({}, this.log) });
    Storage.save();
    const el = document.getElementById('view-practice');
    el.innerHTML = '<div class="card center"><h2>🎉 Session Complete</h2>' +
      '<div class="grid" style="margin:16px 0;">' +
      '<div class="stat"><div class="num">'+this.log.reviewed+'</div><div class="label">Items Reviewed</div></div>' +
      '<div class="stat good"><div class="num">'+this.log.correct+'</div><div class="label">Correct</div></div>' +
      '<div class="stat bad"><div class="num">'+this.log.errors+'</div><div class="label">Errors</div></div>' +
      '<div class="stat"><div class="num">'+this.log.newAdded+'</div><div class="label">Words Added</div></div>' +
      '</div><button class="btn primary" id="backBtn">Back to Dashboard</button></div>';
    el.querySelector('#backBtn').addEventListener('click', ()=>App.showTab('dashboard'));
  }
};

/* ============================== TEACHING PHASE ============================== */
function showTeachingView(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-teaching').classList.add('active');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
}

const STEP_NAMES = ['','Introduce the Word','Core Meaning','Contextual Examples','Guided Processing','Supported Retrieval','Constrained Production','Independent Production','Entering Retrieval'];

const Teaching = {
  state: null,
  queue: [],
  queueIdx: 0,
  onAllComplete: null,

  startQueue(words, onAllComplete){
    words = words.filter(Boolean);
    if(words.length===0){ if(onAllComplete) onAllComplete(); return; }
    this.queue = words.slice();
    this.queueIdx = 0;
    this.onAllComplete = onAllComplete;
    this._next();
  },

  _next(){
    if(this.queueIdx >= this.queue.length){
      const cb = this.onAllComplete;
      this.queue = []; this.queueIdx = 0; this.onAllComplete = null;
      if(cb) cb();
      return;
    }
    this.start(this.queue[this.queueIdx]);
  },

  start(word){
    const step = (word.teaching && word.teaching.currentStep) || 1;
    this.state = { word, step, retry:0, inputs:{}, stepLogged: new Set() };
    word.teaching.currentStep = step;
    Storage.save();
    this.render();
  },

  goStep(n){
    this.state.step = n;
    this.state.retry = 0;
    this.state.word.teaching.currentStep = Math.max(this.state.word.teaching.currentStep||1, Math.min(n,8));
    Storage.save();
    this.render();
  },

  /* Navigates to the previous step. Cached generated content (state.stepXData) and
     typed input values (state.inputs) are preserved; word.teaching.currentStep only
     ever tracks the furthest step reached, so stepping back never re-opens skipping. */
  goBack(){
    if(!this.state || this.state.step<=1) return;
    this.goStep(this.state.step-1);
  },

  /* Restores a cached value into an input/textarea (if any was saved for `key`) and
     wires it to keep caching on every keystroke, so Back → Forward restores the text. */
  _cacheInput(el, key){
    if(!el) return;
    if(this.state.inputs[key]!=null) el.value = this.state.inputs[key];
    el.addEventListener('input', ()=>{ this.state.inputs[key] = el.value; });
  },

  finishWord(){
    const word = this.state.word;
    word.teaching.completed = true;
    word.teaching.currentStep = 8;
    word.srs.nextReview = Utils.todayISO();
    // Phase C: teaching.completed just flipped true, which is a precondition computeMastery
    // checks first -- in practice a freshly-taught word still has no non-teaching history
    // yet, so this will almost always no-op (checkFirstMastery reads the flag, doesn't
    // change the mastery math), but a word re-taught after already having retrieval history
    // could legitimately already qualify, so the check belongs here regardless.
    WordModel.checkFirstMastery(word);
    // Not bumping DailyActivity.teaching here: the backfill counts one `teaching` unit per
    // history entry with phase==='teaching' (each of the 8 teaching steps logs its own
    // attempt via WordModel.logAttempt at several call sites inside the Teaching module,
    // none of which are finishWord). Bumping +1 here instead would count "one word finished
    // teaching today" -- a different, incompatible unit -- and silently mix the two
    // definitions in the same field. Left unwired going forward; see the Phase C report.
    Achievements.evaluate(Analytics.buildAchievementContext());
    App.updateDueBadge(); // word.srs.nextReview was just moved to today, above
    Storage.save();
    Utils.toast('"'+word.word+'" is ready for retrieval practice.');
    this.state = null;
    this.queueIdx++;
    this._next();
  },

  render(){
    showTeachingView();
    const el = document.getElementById('view-teaching');
    const s = this.state, word = s.word;
    const pct = Math.round(((Math.min(s.step,8)-1)/7)*100);
    let body = '';
    if(s.step===1) body = this.renderStep1();
    else if(s.step===2) body = this.renderStep2();
    else if(s.step===3) body = this.renderStep3();
    else if(s.step===4) body = this.renderStep4();
    else if(s.step===5) body = this.renderStep5();
    else if(s.step===6) body = this.renderStep6();
    else if(s.step===7) body = this.renderStep7();
    else body = this.renderCompletion();

    const queueNote = this.queue.length>1 ? ' · word '+(this.queueIdx+1)+' of '+this.queue.length : '';
    const showBack = s.step>1;
    const backRow = showBack ? '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button type="button" class="btn ghost small" id="teachBackBtn">← Back</button></div>' : '';
    el.innerHTML = '<div class="practice-wrap">' +
      '<div class="step-progress-wrap"><div class="practice-progress">Teaching &ldquo;'+Utils.escapeHtml(word.word)+'&rdquo;'+queueNote+' — Step '+Math.min(s.step,8)+' of 8: '+STEP_NAMES[Math.min(s.step,8)]+'</div>' +
      '<div class="step-progress-track"><div class="step-progress-fill" style="width:'+pct+'%"></div></div></div>' +
      '<div class="practice-card" id="teachCard">' + body + backRow + '</div></div>';
    this._wireCurrentStep();
    if(showBack){
      const backBtn = document.getElementById('teachBackBtn');
      if(backBtn) backBtn.addEventListener('click', ()=>this.goBack());
    }
  },

  /* ---- Step 1: Introduce ---- */
  renderStep1(){
    const word = this.state.word;
    let note = '';
    if(word.wordType==='concreteNoun') note = '<div class="teach-note">🖼️ Before continuing, picture a typical example of "'+Utils.escapeHtml(word.word)+'" in your mind.</div>';
    else if(word.wordType==='polysemous') note = '<div class="teach-note">This word has more than one sense. This lesson focuses on one specific sense — others exist but aren\'t the focus here.</div>';
    else if(word.wordType==='nearSynonym') note = '<div class="teach-note">This word has close near-synonyms — pay special attention to the Contrast in the next step.</div>';
    return '<div class="teach-step-label">Step 1 · Introduce the Word</div>' +
      '<div class="teach-headword-row">' +
      '<div class="teach-headword">'+Utils.escapeHtml(word.word)+'</div>' +
      (word.pronunciation ? '<span class="pronunciation">('+Utils.escapeHtml(word.pronunciation)+')</span>' : '') +
      '<button type="button" class="speak-btn" data-word="'+Utils.escapeHtml(word.word)+'" title="Listen">🔊</button>' +
      '</div>' +
      '<div class="teach-sub">'+Utils.escapeHtml(word.form||'(part of speech / word family not recorded)')+'</div>' +
      note +
      '<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn primary" id="nextBtn">Continue</button></div>';
  },

  /* ---- Step 2: Core meaning ---- */
  renderStep2(){
    const word = this.state.word;
    const contrastBox = word.contrast ? '<div class="teach-box contrast"><h4>Contrast</h4><div>'+Utils.escapeHtml(word.contrast)+'</div></div>' : '';
    return '<div class="teach-step-label">Step 2 · Core Meaning</div>' +
      '<div class="teach-headword" style="font-size:20px;">'+Utils.escapeHtml(word.word)+'</div>' +
      '<div class="teach-box emph"><h4>Core Meaning</h4><div style="font-size:15px;font-weight:600;">'+Utils.escapeHtml(word.meaning)+'</div></div>' +
      contrastBox +
      (word.wordType==='abstractVerb' ? '<div class="teach-note">Abstract words like this are learned through definition + contrast + grammar, not imagery — focus on the boundary above.</div>' : '') +
      '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="nextBtn">Continue</button></div>';
  },

  /* ---- Step 3: Contextual examples ---- */
  renderStep3(){
    const word = this.state.word;
    const contexts = word.contexts.map(c=>'<li>'+Utils.escapeHtml(c)+'</li>').join('');
    const colloc = word.collocations.length ? '<div class="teach-box"><h4>Collocations</h4><div>'+word.collocations.map(c=>'<span class="badge" style="margin:2px;">'+Utils.escapeHtml(c)+'</span>').join(' ')+'</div></div>' : '';
    const sentences = (word.cloze||[]).concat(word.production ? [word.production] : []).filter(Boolean);
    // See renderBank's identical fix: matched against the escaped form of the word, since
    // the sentence is escaped below before this regex runs against it.
    const wb = new RegExp('\\b'+Utils.escapeRegex(Utils.escapeHtml(word.word))+'\\b','ig');
    const examples = sentences.length ? '<div class="teach-box"><h4>Example Sentences</h4><ul class="teach-list">' +
      sentences.map(s=>'<li>'+Utils.escapeHtml(s).replace(wb, m=>'<b>'+m+'</b>')+'</li>').join('') + '</ul></div>' : '';
    return '<div class="teach-step-label">Step 3 · Contextual Examples</div>' +
      '<div class="teach-box"><h4>Typical Contexts</h4><ul class="teach-list">'+contexts+'</ul>' +
      '<div class="field-hint" style="margin-top:6px;">Grammar pattern: '+Utils.escapeHtml(word.grammar||'—')+'</div></div>' +
      colloc +
      examples +
      '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="nextBtn">Continue</button></div>';
  },

  /* ---- Step 4: Guided processing ---- */
  genStep4(){
    if(this.state.step4Data) return this.state.step4Data;
    const word = this.state.word;
    const types = ['mcq','explain'];
    // getClozeSentence mutates word.lastClozeIndex, so a second call can hand back a different
    // (possibly unblankable, null) candidate than the one that qualified 'cloze' above -- call
    // it once and reuse the result instead of re-deriving it when 'cloze' is picked.
    const prevClozeIdx = word.lastClozeIndex;
    const clozeCandidate = WordModel.getClozeSentence(word);
    if(clozeCandidate) types.push('cloze');
    const type = Utils.pick(types);
    // The mutation above only earns its keep when the cloze branch is actually used -- an
    // mcq/explain draw shouldn't rotate the cloze index just because it was checked.
    if(type!=='cloze') word.lastClozeIndex = prevClozeIdx;
    const data = { type };
    if(type==='mcq'){
      const others = Storage.state.words.filter(w=>w.id!==word.id && w.production);
      let incorrectText = null;
      if(others.length){
        const other = Utils.pick(others);
        const re = new RegExp('\\b'+Utils.escapeRegex(other.word)+'\\b','i');
        if(re.test(other.production)) incorrectText = other.production.replace(re, word.word);
      }
      if(!incorrectText) incorrectText = 'Yesterday she decided to ' + word.word + ' the ' + (word.form.toLowerCase().includes('noun')?'idea':'meeting') + ' without any reason.';
      data.options = Utils.shuffle([{ text: word.production, correct:true }, { text: incorrectText, correct:false }]);
    } else if(type==='cloze'){
      data.cloze = clozeCandidate;
      // Same flush Practice.genCloze does right after the same getClozeSentence call -- only
      // needed here, not in the mcq/explain branch above, since that branch already restored
      // prevClozeIdx and left no mutation to lose.
      Storage.save();
    }
    this.state.step4Data = data;
    return data;
  },
  renderStep4(){
    const word = this.state.word;
    const data = this.genStep4();
    let inner;
    if(data.type==='mcq'){
      inner = '<div class="practice-sub">Which sentence uses "'+Utils.escapeHtml(word.word)+'" correctly?</div>' +
        '<div class="mcq-options" id="mcqOptions">' + data.options.map(o=>'<button>'+Utils.escapeHtml(o.text)+'</button>').join('') + '</div>';
    } else if(data.type==='explain'){
      inner = '<div class="practice-sub">Explain "'+Utils.escapeHtml(word.word)+'" in your own words.</div>' +
        '<div class="answer-input"><textarea id="explainInput" rows="2" placeholder="Your explanation…"></textarea>' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="explainSubmit">Check My Understanding</button></div></div>';
    } else {
      inner = '<div class="practice-sub">Complete the sentence:</div>' +
        '<div class="practice-prompt">'+Utils.escapeHtml(data.cloze.display).replace('_____','<span class="blank">_____</span>')+'</div>' +
        '<div class="answer-input"><input type="text" id="clozeInput" autocomplete="off" spellcheck="false" placeholder="Type the missing word…">' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="clozeSubmit">Check</button></div></div>';
    }
    return '<div class="teach-step-label">Step 4 · Guided Processing</div>' + inner + '<div id="teachFeedback"></div>';
  },
  wireStep4(){
    const data = this.state.step4Data;
    const word = this.state.word;
    if(data.type==='mcq'){
      const btns = Array.from(document.querySelectorAll('#mcqOptions button'));
      btns.forEach((btn,i)=>{
        btn.addEventListener('click', ()=>{
          btns.forEach(b=>b.disabled=true);
          const opt = data.options[i];
          btn.classList.add(opt.correct?'correct':'incorrect');
          if(!opt.correct){
            const correctIdx = data.options.findIndex(o=>o.correct);
            btns[correctIdx].classList.add('correct');
          }
          this.handleStepOutcome(opt.correct, { dims:['meaningRecognition','contextualComprehension'], correctAnswerText: data.options.find(o=>o.correct).text });
        });
      });
    } else if(data.type==='explain'){
      this._cacheInput(document.getElementById('explainInput'), 'step4_explain');
      document.getElementById('explainSubmit').addEventListener('click', ()=>{
        const feedbackEl = document.getElementById('teachFeedback');
        feedbackEl.innerHTML = '<div class="teach-box"><h4>Core Meaning (compare)</h4><div>'+Utils.escapeHtml(word.meaning)+'</div></div>' +
          '<div class="practice-sub">Did your explanation capture this correctly?</div>' +
          '<div class="rating-row"><button class="btn good" id="selfYes">Yes</button><button class="btn bad" id="selfNo">Not quite</button></div>';
        const selfYes = feedbackEl.querySelector('#selfYes'), selfNo = feedbackEl.querySelector('#selfNo');
        selfYes.addEventListener('click', ()=>{ selfYes.disabled=true; selfNo.disabled=true; this.handleStepOutcome(true, { dims:['meaningRecall','semanticDiscrimination'], successMsg:'Good — that matches the core meaning.' }); });
        selfNo.addEventListener('click', ()=>{ selfYes.disabled=true; selfNo.disabled=true; this.handleStepOutcome(false, { correctAnswerText: word.meaning }); });
      });
    } else {
      const input = document.getElementById('clozeInput');
      this._cacheInput(input, 'step4_cloze');
      const submit = ()=>{
        const val = input.value.trim();
        if(!val) return;
        input.disabled = true; document.getElementById('clozeSubmit').disabled = true;
        const correct = Utils.normalize(val)===Utils.normalize(data.cloze.answer);
        this.handleStepOutcome(correct, { dims:['contextualComprehension','meaningRecognition'], correctAnswerText: data.cloze.answer });
      };
      document.getElementById('clozeSubmit').addEventListener('click', submit);
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
      input.focus();
    }
  },

  /* ---- Step 5: Supported retrieval ---- */
  genStep5(){
    if(this.state.step5Data) return this.state.step5Data;
    const word = this.state.word;
    const cueOptions = ['Meaning: ' + word.meaning];
    if(word.contexts.length) cueOptions.push('Context: ' + Utils.pick(word.contexts));
    const cue = Utils.pick(cueOptions);
    this.state.step5Data = { cue, hintLevel: 0 };
    return this.state.step5Data;
  },
  renderStep5(){
    const word = this.state.word;
    const needsSpellFirst = word.wordType==='difficultSpelling' && !this.state.spellDone;
    if(needsSpellFirst){
      return '<div class="teach-step-label">Step 5 · Supported Retrieval — Spelling Check</div>' +
        '<div class="practice-sub">This word has tricky spelling. Study it, then type it from memory.</div>' +
        '<div class="teach-headword">'+Utils.escapeHtml(word.word)+'</div>' +
        '<div class="answer-input"><input type="text" id="spellInput" autocomplete="off" spellcheck="false" placeholder="Now type it from memory…">' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="spellSubmit">Check Spelling</button></div></div>' +
        '<div id="teachFeedback"></div>';
    }
    const data = this.genStep5();
    return '<div class="teach-step-label">Step 5 · Supported Retrieval</div>' +
      '<div class="practice-sub">Cue — '+Utils.escapeHtml(data.cue)+'</div>' +
      '<div class="answer-input"><input type="text" id="retrieveInput" autocomplete="off" spellcheck="false" placeholder="Type the word…">' +
      '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="retrieveSubmit">Check</button></div></div>' +
      '<div id="teachFeedback"></div>';
  },
  wireStep5(){
    const word = this.state.word;
    if(!word?.word) return;
    if(word.wordType==='difficultSpelling' && !this.state.spellDone){
      const input = document.getElementById('spellInput');
      this._cacheInput(input, 'step5_spell');
      document.getElementById('spellSubmit').addEventListener('click', ()=>{
        input.disabled = true; document.getElementById('spellSubmit').disabled = true;
        const val = input.value.trim();
        const correct = Utils.normalize(val)===Utils.normalize(word.word);
        this.state.spellDone = true;
        // 'spell' is a distinct stepLogged key from the plain step-5 retrieve key below it in
        // this same render cycle -- both fire while this.state.step===5, so sharing one key
        // would let the spelling write's flag silently swallow the retrieve attempt's own log.
        if(!this.state.stepLogged.has('spell')){
          DimModel.record(word, 'formRecall', correct);
          // skipDimRecord: CATEGORY_TO_DIM['Spelling'] is 'formRecall' -- without this, the same
          // wrong spelling would double-increment formRecall.fail, once here via DimModel.record
          // above and once via logError's own category-to-dim write. Same shape as the Practice
          // handleGraded double-count fixed earlier, just unreached by that fix's scope.
          if(!correct) WordModel.logError(word, 'Spelling', 0, { skipDimRecord: true });
          WordModel.logAttempt(word, 0, correct, { phase:'teaching', step:5, part:'spelling' });
          Storage.save();
          this.state.stepLogged.add('spell');
        }
        const feedbackEl = document.getElementById('teachFeedback');
        feedbackEl.innerHTML = (correct ? '<div class="feedback correct">✓ Spelled correctly.</div>' : '<div class="feedback incorrect">Correct spelling: <b>'+Utils.escapeHtml(word.word)+'</b></div>') +
          '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="spellContinueBtn">Continue</button></div>';
        document.getElementById('spellContinueBtn').addEventListener('click', ()=>this.render());
      });
      input.focus();
      return;
    }
    const data = this.state.step5Data;
    const input = document.getElementById('retrieveInput');
    this._cacheInput(input, 'step5_retrieve');
    const submit = document.getElementById('retrieveSubmit');
    const feedbackEl = document.getElementById('teachFeedback');
    const hints = [
      'Grammatical clue: ' + (word.grammar || '(no grammar note available)'),
      'Semantic clue: ' + word.meaning,
      'First letter: ' + word.word[0].toUpperCase(),
      'Partial form: ' + word.word[0] + '_'.repeat(Math.max(1, word.word.length-2)) + word.word.slice(-1),
      'Answer: ' + word.word
    ];
    const doCheck = ()=>{
      const val = input.value.trim();
      if(!val) return;
      const correct = Utils.normalize(val)===Utils.normalize(word.word);
      if(correct){
        input.disabled = true; submit.disabled = true;
        this.handleStepOutcome(true, { dims:['formRecall','meaningRecall'], successMsg:'Retrieved successfully.', askCategoryOnSuccess: data.hintLevel>0 });
      } else {
        if(data.hintLevel < hints.length) data.hintLevel++;
        // Same dims the success branch above records (dims:['formRecall','meaningRecall']) --
        // this is the failed half of the same retrieval attempt, so it must count against both
        // just as reaching them would have. Deliberately checks stepLogged but never sets it:
        // each wrong try up the hint ladder is a genuinely new failed attempt within this same
        // visit and must keep counting: only the eventual success (or a stale replay after this
        // step was already resolved -- see handleStepOutcome) should be gated to log once.
        if(!this.state.stepLogged.has(this.state.step)){
          DimModel.record(word, 'formRecall', false);
          DimModel.record(word, 'meaningRecall', false);
          WordModel.logAttempt(word, 0, false, { phase:'teaching', step:5 });
          Storage.save();
        }
        const ladder = '<div class="hint-ladder">' + hints.slice(0, data.hintLevel).map(h=>'<div class="hint-line">'+Utils.escapeHtml(h)+'</div>').join('') + '</div>';
        const more = data.hintLevel>=hints.length ? '<div class="practice-sub">Now type it once more to lock it in.</div>' : '';
        feedbackEl.innerHTML = '<div class="feedback incorrect">Not yet — here\'s a hint:</div>' + ladder + more;
        input.value = ''; input.focus();
      }
    };
    submit.addEventListener('click', doCheck);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') doCheck(); });
    input.focus();
  },

  /* ---- Step 6: Constrained production ---- */
  genStep6(){
    if(this.state.step6Data) return this.state.step6Data;
    const word = this.state.word;
    let prompt;
    if(word.collocations.length && Math.random()<0.5) prompt = 'Write a sentence using "'+word.word+'" together with "'+Utils.pick(word.collocations)+'".';
    else if(word.contexts.length) prompt = 'Write a sentence about "'+Utils.pick(word.contexts)+'" using "'+word.word+'".';
    else prompt = 'Write a sentence using "'+word.word+'".';
    this.state.step6Data = { prompt };
    return this.state.step6Data;
  },
  renderStep6(){
    const data = this.genStep6();
    return '<div class="teach-step-label">Step 6 · Constrained Production</div>' +
      '<div class="practice-prompt">'+Utils.escapeHtml(data.prompt)+'</div>' +
      '<div class="answer-input"><textarea id="constrainedInput" rows="2" placeholder="Write your sentence…"></textarea>' +
      '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="constrainedSubmit">Check My Sentence</button></div></div>' +
      '<div id="teachFeedback"></div>';
  },
  wireStep6(){
    const word = this.state.word;
    this._cacheInput(document.getElementById('constrainedInput'), 'step6_constrained');
    document.getElementById('constrainedSubmit').addEventListener('click', ()=>{
      const val = document.getElementById('constrainedInput').value.trim();
      const feedbackEl = document.getElementById('teachFeedback');
      feedbackEl.innerHTML = '<div class="feedback"><b>Your sentence:</b><div style="margin-top:4px;">'+Utils.escapeHtml(val||'(empty)')+'</div></div>' +
        '<div class="self-check"><div><b>Grammar:</b> '+Utils.escapeHtml(word.grammar||'—')+'</div><div><b>Collocations:</b> '+Utils.escapeHtml(word.collocations.join(', ')||'—')+'</div></div>' +
        '<div class="practice-sub" style="margin-top:10px;">Did it satisfy the constraint and use the word correctly?</div>' +
        '<div class="rating-row"><button class="btn good" id="selfYes">Yes</button><button class="btn bad" id="selfNo">No, needs work</button></div>';
      const selfYes = feedbackEl.querySelector('#selfYes'), selfNo = feedbackEl.querySelector('#selfNo');
      selfYes.addEventListener('click', ()=>{ selfYes.disabled=true; selfNo.disabled=true; this.handleStepOutcome(true, { dims:['guidedProduction','grammar','collocation'], successMsg:'Nice — constraint satisfied.' }); });
      selfNo.addEventListener('click', ()=>{ selfYes.disabled=true; selfNo.disabled=true; this.handleStepOutcome(false, { correctAnswerText: word.production }); });
    });
  },

  /* ---- Step 7: Independent production ---- */
  renderStep7(){
    return '<div class="teach-step-label">Step 7 · Independent Production</div>' +
      '<div class="practice-prompt">Write an original sentence using "'+Utils.escapeHtml(this.state.word.word)+'" — no constraints.</div>' +
      '<div class="answer-input"><textarea id="independentInput" rows="2" placeholder="Write your sentence…"></textarea>' +
      '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="independentSubmit">Check My Sentence</button></div></div>' +
      '<div id="teachFeedback"></div>';
  },
  wireStep7(){
    const word = this.state.word;
    this._cacheInput(document.getElementById('independentInput'), 'step7_independent');
    document.getElementById('independentSubmit').addEventListener('click', ()=>{
      const val = document.getElementById('independentInput').value.trim();
      const feedbackEl = document.getElementById('teachFeedback');
      feedbackEl.innerHTML = '<div class="feedback"><b>Your sentence:</b><div style="margin-top:4px;">'+Utils.escapeHtml(val||'(empty)')+'</div></div>' +
        '<div class="practice-sub" style="margin-top:10px;">Original and correct?</div>' +
        '<div class="rating-row"><button class="btn good" id="selfYes">Yes</button><button class="btn bad" id="selfNo">No, needs work</button></div>';
      const selfYes = feedbackEl.querySelector('#selfYes'), selfNo = feedbackEl.querySelector('#selfNo');
      selfYes.addEventListener('click', ()=>{ selfYes.disabled=true; selfNo.disabled=true; this.handleStepOutcome(true, { dims:['independentProduction'], successMsg:'Great — independent production achieved.' }); });
      selfNo.addEventListener('click', ()=>{ selfYes.disabled=true; selfNo.disabled=true; this.handleStepOutcome(false, { correctAnswerText: word.production }); });
    });
  },

  /* ---- Step 8: completion ---- */
  renderCompletion(){
    const word = this.state.word;
    return '<div class="teach-step-label">Step 8 · Entering Retrieval Queue</div>' +
      '<div class="teach-headword">'+Utils.escapeHtml(word.word)+'</div>' +
      '<div class="practice-sub">Teaching complete. This word now enters your spaced-retrieval schedule.</div>' +
      '<div class="dim-grid">' + DIMENSIONS.map(d=>'<div class="dim-item"><div class="name">'+d.label+'</div><span class="dim-badge '+word.dims[d.key].status.replace(' ','')+'">'+word.dims[d.key].status+'</span></div>').join('') + '</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn primary" id="finishTeachBtn">'+(this.queueIdx<this.queue.length-1?'Continue to Next Word':'Done')+'</button></div>';
  },

  /* ---- Shared outcome / diagnosis handler for steps 4, 6, 7 ---- */
  handleStepOutcome(success, opts){
    opts = opts || {};
    const word = this.state.word;
    const feedbackEl = document.getElementById('teachFeedback');
    if(success){
      if(!this.state.stepLogged.has(this.state.step)){
        (opts.dims||[]).forEach(d=>DimModel.record(word, d, true));
        WordModel.logAttempt(word, 0, true, { phase:'teaching', step:this.state.step });
        Storage.save();
        this.state.stepLogged.add(this.state.step);
      }
      if(opts.askCategoryOnSuccess){
        feedbackEl.innerHTML = '<div class="feedback correct">✓ '+(opts.successMsg||'Correct.')+'</div>' +
          '<div class="practice-sub" style="margin-top:10px;">What kind of slip was that, before it clicked?</div>' +
          '<div class="error-cats">' + ERROR_CATEGORIES.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('') + '</div>';
        const slipCatBtns = Array.from(feedbackEl.querySelectorAll('.error-cats button'));
        slipCatBtns.forEach(btn=>{
          btn.addEventListener('click', ()=>{
            slipCatBtns.forEach(b=>b.disabled=true);
            // Deliberately no skipDimRecord here, unlike wireStep5/Practice: this step already
            // passed (the dims:true write above already ran), but the user is retroactively
            // naming a real slip they made getting there -- logError's category-to-dim write
            // records that as a fail on CATEGORY_TO_DIM[category], which can downgrade that
            // dim's status from Achieved to Developing even though the retrieval itself
            // succeeded. That's intentional: "passed, but only after a slip" is exactly the
            // signal this diagnostic exists to capture, not a double-count of the same failure.
            WordModel.logError(word, btn.dataset.c, 0);
            word.teaching.errorHistory.push({ ts: Date.now(), step: this.state.step, category: btn.dataset.c });
            Storage.save();
            feedbackEl.innerHTML = '<div class="feedback correct">✓ Logged.</div><div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="advanceBtn">Continue</button></div>';
            document.getElementById('advanceBtn').addEventListener('click', ()=>this.goStep(this.state.step+1));
          });
        });
      } else {
        feedbackEl.innerHTML = '<div class="feedback correct">✓ '+(opts.successMsg||'Correct.')+'</div>' +
          '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="advanceBtn">Continue</button></div>';
        document.getElementById('advanceBtn').addEventListener('click', ()=>this.goStep(this.state.step+1));
      }
    } else {
      this.state.retry = (this.state.retry||0)+1;
      // T6: log the failed attempt immediately, mirroring the success branch above. Previously
      // this only happened once a category was picked below, so clicking the global "← Back"
      // button first silently dropped the failed attempt -- no history entry, no dim fail --
      // instead of counting it like every other outcome path does.
      if(!this.state.stepLogged.has(this.state.step)){
        WordModel.logAttempt(word, 0, false, { phase:'teaching', step:this.state.step });
        Storage.save();
        this.state.stepLogged.add(this.state.step);
      }
      feedbackEl.innerHTML = '<div class="feedback incorrect">✗ Not quite.' +
        (opts.correctAnswerText ? '<div class="correct-answer">Correct: '+Utils.escapeHtml(opts.correctAnswerText)+'</div>' : '') + '</div>' +
        '<div class="practice-sub" style="margin-top:10px;">What kind of error was this?</div>' +
        '<div class="error-cats">' + ERROR_CATEGORIES.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('') + '</div>';
      const failCatBtns = Array.from(feedbackEl.querySelectorAll('.error-cats button'));
      // Distinct key from the plain step-number key above: the attempt is already logged by
      // the time these buttons exist, so gating the category diagnostic on that same key would
      // make it never fire at all -- this is a separate logical write about the same step.
      const catKey = this.state.step + '-cat';
      failCatBtns.forEach(btn=>{
        btn.addEventListener('click', ()=>{
          failCatBtns.forEach(b=>b.disabled=true);
          const cat = btn.dataset.c;
          if(!this.state.stepLogged.has(catKey)){
            WordModel.logError(word, cat, 0);
            word.teaching.errorHistory.push({ ts: Date.now(), step: this.state.step, category: cat });
            Storage.save();
            this.state.stepLogged.add(catKey);
          }
          const secondFailure = this.state.retry>=2;
          feedbackEl.innerHTML = '<div class="diag-box"><b>'+cat+' error.</b><div class="expl">'+ERROR_EXPLANATIONS[cat]+'</div></div>' +
            (secondFailure ?
              ('<div class="teach-box"><h4>Why this is correct</h4><div>'+Utils.escapeHtml(opts.correctAnswerText||word.meaning)+'</div></div>' +
               '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="advanceBtn">I understand — Continue</button></div>')
              : '<div class="btn-row" style="justify-content:center;margin-top:12px;"><button class="btn primary" id="retryBtn">Try This Step Again</button></div>');
          const adv = feedbackEl.querySelector('#advanceBtn');
          if(adv) adv.addEventListener('click', ()=>this.goStep(this.state.step+1));
          const rt = feedbackEl.querySelector('#retryBtn');
          if(rt) rt.addEventListener('click', ()=>{ this.state.step4Data=null; this.state.step6Data=null; this.state.stepLogged.delete(this.state.step); this.state.stepLogged.delete(catKey); this.render(); });
        });
      });
    }
  },

  _wireCurrentStep(){
    const s = this.state;
    if(s.step===1 || s.step===2 || s.step===3){
      const btn = document.getElementById('nextBtn');
      if(btn) btn.addEventListener('click', ()=>this.goStep(s.step+1));
    } else if(s.step===4) this.wireStep4();
    else if(s.step===5) this.wireStep5();
    else if(s.step===6) this.wireStep6();
    else if(s.step===7) this.wireStep7();
    else {
      const b = document.getElementById('finishTeachBtn');
      if(b) b.addEventListener('click', ()=>this.finishWord());
    }
  }
};

/* ============================== BOOT ============================== */
document.addEventListener('DOMContentLoaded', ()=>App.init());
})();
</script>
</body>
