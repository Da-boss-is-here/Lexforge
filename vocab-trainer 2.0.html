      fbHtml += '<div class="correct-answer">Correct: '+Utils.escapeHtml(question.correctAnswer || word.word) +
        (word.pronunciation ? ' <span class="pronunciation">('+Utils.escapeHtml(word.pronunciation)+')</span>' : '') +
        ' <button type="button" class="speak-btn small" data-word="'+Utils.escapeHtml(word.word)+'" title="Listen">🔊</button></div>';
      if(question.correctAnswer && userVal){
        const dist = Utils.levenshtein(Utils.normalize(userVal), Utils.normalize(question.correctAnswer));
        if(dist>0 && dist<=2) fbHtml += '<div class="field-hint">Close — looks like it may be a spelling slip.</div>';
      }
    }
    if(question.autoGrade){
      if(word.meaning) fbHtml += '<div class="field-hint">Meaning: '+Utils.escapeHtml(word.meaning)+'</div>';
      if(word.collocations.length) fbHtml += '<div class="field-hint">Collocations: '+Utils.escapeHtml(word.collocations.join(', '))+'</div>';
    }
    fbHtml += '</div>';

    if(!correct){
      fbHtml += '<div class="practice-sub" style="margin-top:12px;">What kind of error was this?</div>' +
        '<div class="error-cats">' + ERROR_CATEGORIES.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('') + '</div>' +
        '<div class="btn-row" style="justify-content:center;margin-top:14px;"><button class="btn primary" id="continueBtn" disabled>Continue</button></div>';
    } else {
      fbHtml += '<div class="practice-sub" style="margin-top:12px;">How did that feel?</div>' +
        '<div class="rating-row"><button class="btn warn" id="hardBtn">😅 Hard (effortful)</button><button class="btn good" id="easyBtn">⚡ Easy (fluent)</button></div>';
    }
    feedbackArea.innerHTML = fbHtml;

    if(!correct){
      let chosenCat = null;
      const contBtn = feedbackArea.querySelector('#continueBtn');
      feedbackArea.querySelectorAll('.error-cats button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          feedbackArea.querySelectorAll('.error-cats button').forEach(b=>b.classList.remove('picked'));
          btn.classList.add('picked');
          chosenCat = btn.dataset.c;
          contBtn.disabled = false;
        });
      });
      contBtn.addEventListener('click', ()=>{
        // Shared ts for this graded event -- threaded into logAttempt (history + attempts[])
        // and gradeFsrs (FSRSScheduler.grade + the fsrsReviewLog entry) so all three line up.
        const ts = Date.now();
        WordModel.logAttempt(word, question.level, false, { ts, rating:'again', errorCategory: chosenCat, hinted: !!hintWasUsed, track: question.track||'legacy', attemptsPhase:'practice', dimension: question.dimension });
        // skipDimRecord: Practice writes dims by exercised question type (recordDimForQuestion
        // below), not by error category -- without this, logError's own CATEGORY_TO_DIM write
        // double-counted the failure (e.g. a cued+Spelling miss used to write both
        // formRecall.fail and meaningRecall.fail for one event).
        WordModel.logError(word, chosenCat, question.level, { skipDimRecord: true });
        this.recordDimForQuestion(question, false);
        if(question.track==='fsrs'){
          Practice.gradeFsrs(word, question.dimension, 'again', ts);
        } else {
          WordModel.updateLadder(word, question.level, false);
          WordModel.applyRating(word, 'again');
        }
        DailyActivity.bump(Utils.todayISO(), { reviews: 1 });
        Achievements.evaluate(Analytics.buildAchievementContext());
        App.updateDueBadge();
        Storage.save();
        s.results.push({ idx: s.idx, word, question, userVal, correct:false, category: chosenCat });
        s.idx++;
        Practice.persist();
        this.renderPracticeCard();
      });
    } else {
      const finish = (rating)=>{
        const ts = Date.now();
        WordModel.logAttempt(word, question.level, true, { ts, rating, hinted: !!hintWasUsed, track: question.track||'legacy', attemptsPhase:'practice', dimension: question.dimension });
        if(question.track==='fsrs'){
          Practice.gradeFsrs(word, question.dimension, rating, ts);
        } else {
          WordModel.updateLadder(word, question.level, true);
          WordModel.applyRating(word, rating);
        }
        this.recordDimForQuestion(question, true);
        // Phase C: after the grade is written (mirrors the "write result first" ordering
        // already used by gradeFsrs, so computeMastery sees this attempt), check whether
        // this is the first time the word crosses into Stable/Exam Ready.
        WordModel.checkFirstMastery(word);
        DailyActivity.bump(Utils.todayISO(), { reviews: 1, correct: 1 });
        Achievements.evaluate(Analytics.buildAchievementContext());
        App.updateDueBadge();
        Storage.save();
        s.results.push({ idx: s.idx, word, question, userVal, correct:true, rating });
        s.idx++;
        Practice.persist();
        this.renderPracticeCard();
      };
      feedbackArea.querySelector('#hardBtn').addEventListener('click', ()=>finish('hard'));
      feedbackArea.querySelector('#easyBtn').addEventListener('click', ()=>finish('easy'));
    }
  },

  recordDimForQuestion(question, success){
    const word = question.word;
    // An explicit question.dimension on a LEGACY-track question (set only for
    // runDimensionPractice's items, see generateQuestion) names the dim it was actually meant
    // to exercise, since DIM_PRACTICE_LEVEL groups multiple dims onto the same level and the
    // type-based inference below can't tell them apart. Gated on track!=='fsrs' -- an FSRS-track
    // question also carries question.dimension (recognition/meaningRecall/production, a
    // different namespace gradeFsrs uses for word.fsrs, not word.dims), and always did before
    // this field existed on legacy items; falling through to the type-based inference for it
    // keeps that pre-existing behavior (e.g. an FSRS meaningRecall review's 'cued' question
    // still credits both meaningRecall AND formRecall here, same as a legacy cued-recall item).
    if(question.track!=='fsrs' && question.dimension){
      DimModel.record(word, question.dimension, success);
      return;
    }
    if(question.type==='recognition') DimModel.record(word, 'meaningRecognition', success);
    else if(question.type==='cued'){ DimModel.record(word, 'meaningRecall', success); DimModel.record(word, 'formRecall', success); }
    else if(question.type==='cloze') DimModel.record(word, 'contextualComprehension', success);
    else if(question.type==='drill') DimModel.record(word, 'novelApplication', success);
    else if(question.type==='production') DimModel.record(word, 'independentProduction', success);
  }
};

/* ============================== MODAL ============================== */
const Modal = {
  show(title, bodyHtml, onMount){
    const root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal"><h2>'+title+'</h2><div>'+bodyHtml+'</div></div></div>';
    if(onMount) onMount(root.querySelector('.modal'));
    root.querySelector('#modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') this.close(); });
  },
  close(){ document.getElementById('modalRoot').innerHTML=''; },
  confirm(msg, onYes){
    this.show('Confirm', '<p>'+Utils.escapeHtml(msg)+'</p><div class="btn-row"><button class="btn bad small" id="yesBtn">Yes, proceed</button><button class="btn ghost small" id="noBtn">Cancel</button></div>', (m)=>{
      m.querySelector('#yesBtn').addEventListener('click', ()=>{ this.close(); onYes(); });
      m.querySelector('#noBtn').addEventListener('click', ()=>this.close());
    });
  }
};

/* ============================== WEEKLY WRITING AUDIT ============================== */
const Audit = {
  essayText: '',
  tags: [], // {id, quoted, word, category, correction}
  container: null,

  render(container){
    this.container = container;
    this.draw();
  },

  draw(){
    const el = this.container;
    el.innerHTML =
      '<div class="card"><h2>📝 Weekly Writing Audit</h2>' +
      '<p class="field-hint">Paste an essay or paragraph you wrote. Select any weak or incorrect vocabulary usage, tag it with an error category and a corrected version, then generate targeted review items.</p>' +
      '<label>Your writing</label>' +
      '<textarea id="essayInput" rows="10" placeholder="Paste your essay or paragraph here…">'+Utils.escapeHtml(this.essayText)+'</textarea>' +
      '<div class="btn-row" style="margin-top:10px;">' +
      '<button type="button" class="btn primary small" id="tagSelBtn">🏷 Tag Selected Text</button>' +
      '<button type="button" class="btn ghost small" id="clearEssayBtn">Clear</button>' +
      '</div></div>' +
      (this.tags.length ? this.renderTagList() : '') +
      '<div class="card">' +
      '<div class="btn-row"><button type="button" class="btn good" id="createReviewBtn" '+(this.tags.length?'':'disabled')+'>✓ Create Review Items ('+this.tags.length+')</button></div>' +
      '<p class="field-hint" style="margin-top:8px;">Each tagged error is classified into one of the seven categories (Meaning, Form, Spelling, Grammar, Collocation, Register, Selection) and fed into the same error-diagnosis system and mastery dimensions used by Practice and the Teaching Phase.</p>' +
      '</div>';

    const textarea = el.querySelector('#essayInput');
    textarea.addEventListener('input', ()=>{ this.essayText = textarea.value; });
    el.querySelector('#tagSelBtn').addEventListener('click', ()=>{
      const start = textarea.selectionStart, end = textarea.selectionEnd;
      if(start===end){ Utils.toast('Select some text in your writing first.'); return; }
      const quoted = textarea.value.slice(start,end);
      this.openTagModal(start,end,quoted);
    });
    el.querySelector('#clearEssayBtn').addEventListener('click', ()=>{
      if(!this.essayText && this.tags.length===0) return;
      Modal.confirm('Clear the writing and all tags?', ()=>{
        this.essayText=''; this.tags=[]; this.draw();
      });
    });
    el.querySelectorAll('.tag-remove-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        this.tags = this.tags.filter(t=>t.id!==btn.dataset.id);
        this.draw();
      });
    });
    const createBtn = el.querySelector('#createReviewBtn');
    if(createBtn) createBtn.addEventListener('click', ()=>this.createReviewItems());
  },

  renderTagList(){
    return '<div class="card"><h3>Tagged Errors ('+this.tags.length+')</h3>' +
      this.tags.map(t=>
        '<div class="tag-item">' +
        '<div><span class="quoted">'+Utils.escapeHtml(t.quoted)+'</span><span class="arrow">→</span><span class="corrected">'+Utils.escapeHtml(t.correction)+'</span></div>' +
        '<div class="meta-row"><span class="badge">'+t.category+'</span><span class="field-hint">word: '+Utils.escapeHtml(t.word)+'</span>' +
        '<button type="button" class="btn ghost small tag-remove-btn" data-id="'+t.id+'">Remove</button></div>' +
        '</div>'
      ).join('') + '</div>';
  },

  openTagModal(start,end,quoted){
    const guessWord = (quoted.trim().split(/\s+/)[0]||'').replace(/[^A-Za-z'-]/g,'');
    Modal.show('Tag Vocabulary Error',
      '<p class="field-hint">Selected: &ldquo;'+Utils.escapeHtml(quoted)+'&rdquo;</p>' +
      '<label>Vocabulary word</label><input type="text" id="tagWordInput" value="'+Utils.escapeHtml(guessWord)+'">' +
      '<label>Error category</label><div class="error-cats" id="tagCats">'+ERROR_CATEGORIES.map(c=>'<button type="button" data-c="'+c+'">'+c+'</button>').join('')+'</div>' +
      '<label>Corrected version</label><textarea id="tagCorrection" placeholder="What should it have said?"></textarea>' +
      '<div id="tagModalErr" class="field-error"></div>' +
      '<div class="btn-row" style="margin-top:14px;"><button type="button" class="btn primary small" id="saveTagBtn">Save Tag</button><button type="button" class="btn ghost small" id="cancelTagBtn">Cancel</button></div>',
      (m)=>{
        let cat = null;
        m.querySelectorAll('#tagCats button').forEach(b=>{
          b.addEventListener('click', ()=>{
            m.querySelectorAll('#tagCats button').forEach(x=>x.classList.remove('picked'));
            b.classList.add('picked'); cat = b.dataset.c;
          });
        });
        m.querySelector('#cancelTagBtn').addEventListener('click', ()=>Modal.close());
        m.querySelector('#saveTagBtn').addEventListener('click', ()=>{
          const word = m.querySelector('#tagWordInput').value.trim();
          const correction = m.querySelector('#tagCorrection').value.trim();
          const errEl = m.querySelector('#tagModalErr');
          if(!word){ errEl.textContent='Enter the vocabulary word this error is about.'; return; }
          if(!cat){ errEl.textContent='Choose an error category.'; return; }
          if(!correction){ errEl.textContent='Enter the corrected version.'; return; }
          this.tags.push({ id: Utils.uid(), quoted, word, category: cat, correction });
          Modal.close();
          this.draw();
        });
      });
  },

  createReviewItems(){
    if(this.tags.length===0) return;
    const matchedCount = { n:0 };
    const unmatched = [];
    const resolved = [];
    this.tags.forEach(t=>{
      const w = WordModel.findByText(t.word);
      if(w){ ErrorIntegration.recordProductionError(w, t.category, 'audit-review'); matchedCount.n++; }
      else unmatched.push(t);
      resolved.push({ tag:t, w });
    });
    Storage.state.writingLog.push({
      ts: Date.now(), date: Utils.todayISO(), text: this.essayText,
      errors: resolved.map(({tag:t, w})=>({ quoted:t.quoted, word:t.word, wordId: w ? w.id : null, category:t.category, correction:t.correction, matched: !!w }))
    });
    Storage.save();

    this.tags = [];
    this.draw();

    Utils.toast(matchedCount.n ? (matchedCount.n+' word(s) scheduled for targeted retrieval practice.') : 'Review items processed.');

    if(unmatched.length) this.promptAddUnmatched(unmatched);
  },

  promptAddUnmatched(unmatched){
    const uniqueWords = [];
    const seen = new Set();
    unmatched.forEach(t=>{ const k=Utils.normalize(t.word); if(!seen.has(k)){ seen.add(k); uniqueWords.push(t.word); } });
    Modal.show('New Words Found',
      '<p class="field-hint">These tagged words aren\'t in your bank yet. Add one to start its Teaching Phase.</p>' +
      '<div class="btn-row" style="flex-direction:column;align-items:stretch;">' +
      uniqueWords.map(w=>'<button type="button" class="btn ghost small add-unmatched-btn" data-w="'+Utils.escapeHtml(w)+'">＋ Add "'+Utils.escapeHtml(w)+'"</button>').join('') +
      '</div><div class="btn-row" style="margin-top:10px;"><button type="button" class="btn ghost small" id="closeUnmatchedBtn">Close</button></div>',
      (m)=>{
        m.querySelectorAll('.add-unmatched-btn').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            Modal.close();
            App.showTab('add');
            Views.renderAddForm({ word: btn.dataset.w, wordType:'general', meaning:'', form:'', grammar:'', collocations:[], contrast:'', contexts:[], production:'', mnemonic:'', pronunciation:'', cloze:[] });
          });
        });
        m.querySelector('#closeUnmatchedBtn').addEventListener('click', ()=>Modal.close());
      });
  }
};

/* ============================== TIMED EXAM DEPLOYMENT ============================== */
const Exam = {
  PRESETS: [
    'Discuss the advantages and disadvantages of remote work for young professionals.',
    'Describe a time you had to make a difficult decision under pressure.',
    'Argue for or against the increasing use of social media in schools.',
    'Explain how technology has changed the way people communicate with one another.',
    'Discuss whether cities should prioritize public transportation over private cars.'
  ],
  status: 'config', // config | running | review | done
  prompt: '',
  minutes: 20,
  targetWords: [],
  text: '',
  remainingSec: 0,
  timerHandle: null,
  checklist: {}, // wordId -> {outcome, category}
  lastRecord: null,
  container: null,
  _tickCount: 0, // throttles tick()'s persist() to every 5th second -- see tick()
  _persistTimer: null, // pending debounced flush, if any -- see persist()/_cancelPendingPersist()

  render(container){
    this.container = container;
    if(!this.prompt) this.prompt = Utils.pick(this.PRESETS);
    // Idempotent -- a no-op if a 'running' exam already has a live interval (e.g. the user
    // tabbed away and back within the same page lifetime), and the only thing that starts a
    // fresh one after a reload restored status:'running' with no timerHandle (setInterval ids
    // don't survive a reload, so restore() can't recreate this itself).
    this.ensureTimer();
    if(this.status==='config') this.drawConfig();
    else if(this.status==='running') this.drawRunning();
    else if(this.status==='review') this.drawReview();
    else this.drawDone();
  },

  ensureTimer(){
    if(this.status==='running' && !this.timerHandle){
      this.timerHandle = setInterval(()=>this.tick(), 1000);
    }
  },

  // Debounced entry point for incremental edits (a textarea keystroke, a prompt keystroke) --
  // coalesces rapid-fire calls into one flush 500ms after the last one, instead of one
  // Storage.save() (which rewrites the whole state -- attempts[] alone can carry up to 15,000
  // entries) per character. State transitions need to be durable immediately, not up to 500ms
  // later, so they call _flushPersist() directly instead of going through this debounce.
  persist(){
    this._cancelPendingPersist();
    this._persistTimer = setTimeout(()=>{ this._persistTimer = null; this._flushPersist(); }, 500);
  },
  _cancelPendingPersist(){
    if(this._persistTimer){ clearTimeout(this._persistTimer); this._persistTimer = null; }
  },
  // Writes the resumable subset of exam state to Storage.state.examSession right now.
  // Deliberately clears instead of writing when status is 'done': drawDone's render depends
  // on this.lastRecord (the finished {targetWords, outcome, category} summary), which isn't
  // part of this schema -- the exam is already logged to examLog by this point, so there's
  // nothing left to resume.
  _flushPersist(){
    if(this.status==='done'){ this.clearPersisted(); return; }
    Storage.state.examSession = {
      status: this.status, prompt: this.prompt, minutes: this.minutes, text: this.text,
      remainingSec: this.remainingSec,
      // Stamped only while running -- restore() uses it as "remainingSec was accurate as of
      // this wall-clock time," to subtract elapsed real time on the next load. Meaningless
      // (and left null) for config/review, which aren't counting down.
      lastTickAt: this.status==='running' ? Date.now() : null,
      targetWordIds: this.targetWords.map(w=>w.id),
      checklist: this.checklist
    };
    Storage.save();
  },
  clearPersisted(){
    this._cancelPendingPersist();
    if(Storage.state.examSession){ Storage.state.examSession = null; Storage.save(); }
  },
  // Resets Exam's in-memory state, independent of the persisted examSession -- used by
  // Storage.importJSON('replace') alongside clearing state.examSession itself, since
  // this.targetWords holds live word object references from the state that's about to be
  // discarded (same concern Practice.session has, see importJSON's comment).
  discard(){
    this._cancelPendingPersist();
    if(this.timerHandle){ clearInterval(this.timerHandle); this.timerHandle=null; }
    this.status='config'; this.prompt=''; this.text=''; this.remainingSec=0;
    this.targetWords=[]; this.checklist={}; this.lastRecord=null;
  },
  // Called once at App.init, alongside Practice.restore(). Resolves targetWordIds back
  // against Storage.state.words -- an id that no longer resolves (the word was deleted since
  // the save) is dropped, along with its checklist entry, same as practiceSession's queue
  // dropping unresolvable word ids.
  restore(){
    const saved = Storage.state.examSession;
    if(!saved) return;
    this.status = saved.status;
    this.prompt = saved.prompt;
    this.minutes = saved.minutes;
    this.text = saved.text;
    const resolvedWords = [];
    const resolvedChecklist = {};
    // De-dupe by id -- a corrupted/hand-edited save with a repeated targetWordIds entry would
    // otherwise push the same word into targetWords twice, and submitReview (which iterates
    // targetWords) would then double-log ErrorIntegration.recordProductionSuccess/Error and
    // double-push into examLog's targetWords for that one word.
    const seenIds = new Set();
    saved.targetWordIds.forEach(id=>{
      if(seenIds.has(id)) return;
      const w = Storage.state.words.find(x=>x.id===id);
      if(!w) return;
      seenIds.add(id);
      resolvedWords.push(w);
      // Validate the checklist entry itself -- `saved.checklist[id] || {...}` only falls back
      // for a falsy value. A truthy non-object (a corrupted/hand-edited save could carry a
      // number, string, or boolean here) would be used as-is, and drawReview's click handlers
      // assign properties onto it (`this.checklist[wid].outcome = ...`) -- under "use strict"
      // that throws when the target isn't an object. Rebuild a clean {outcome,category} shape
      // instead of trusting the persisted entry, same validation drawReview/checkReady expect.
      const c = saved.checklist[id];
      const outcome = (c && typeof c==='object' && ['correct','incorrect','none'].includes(c.outcome)) ? c.outcome : null;
      const category = (c && typeof c==='object' && typeof c.category==='string' && ERROR_CATEGORIES.includes(c.category)) ? c.category : null;
      resolvedChecklist[id] = { outcome, category };
    });
    this.targetWords = resolvedWords;
    this.checklist = resolvedChecklist;
    if(this.status==='running'){
      // Wall-clock-aware and one-sided: elapsed is however much real time passed since
      // lastTickAt, floored at 0 via Math.max so a backward clock jump can't *increase*
      // remainingSec (the failure mode that matters here is losing time while away, not
      // gaining it).
      const elapsedSec = saved.lastTickAt ? Math.max(0, Math.round((Date.now()-saved.lastTickAt)/1000)) : 0;
      this.remainingSec = Math.max(0, saved.remainingSec - elapsedSec);
      // The tab was closed/away for longer than the time that was left -- don't resume a
      // countdown that's already at (or past) zero; move straight to the review checklist
      // with whatever text survived, same as tick() reaching 0 normally would.
      if(this.remainingSec<=0) this.status = 'review';
      // App.init calls restore() well before the user ever opens the Writing tab -- without
      // starting the interval here, ensureTimer() only fires on Exam.render(), so wall-clock
      // time already subtracted above then sits frozen (no further ticks, no further
      // _flushPersist) until that first navigation, effectively refunding the user that time.
      // Guarded by the reassignment above: skip if this.status just flipped to 'review'.
      if(this.status==='running') this.ensureTimer();
    } else {
      this.remainingSec = saved.remainingSec;
    }
  },

  computeTargetPool(){
    // success-successAtReset, not raw success -- see WordModel.resetDim's comment. Without
    // this, a word whose independentProduction was reset by a real production error (which
    // also logs the error and pulls the word into today's due queue -- see
    // ErrorIntegration.recordProductionError) still reads as eligible off its pre-reset
    // lifetime success count.
    const eligible = Storage.state.words.filter(w=> w.teaching && w.teaching.completed &&
      w.dims.independentProduction && (w.dims.independentProduction.success-(w.dims.independentProduction.successAtReset||0))>=1 &&
      !WordModel.hasRecentError(w,7));
    return Utils.shuffle(eligible).slice(0,8);
  },

  drawConfig(){
    // Only compute a pool when there isn't one yet -- drawConfig used to unconditionally
    // recompute on every render, so a minutes-preset click, a custom-minutes keystroke, or
    // "New Prompt" (all of which re-render config) silently reshuffled the target vocabulary
    // out from under the user while they were still configuring. "Reshuffle Words" bypasses
    // this by clearing targetWords itself before calling drawConfig (see its handler below);
    // "Start Another Exam" clears it too, so the next exam starts with a fresh pool.
    if(!this.targetWords.length) this.targetWords = this.computeTargetPool();
    const pool = this.targetWords;
    const el = this.container;
    const presetMinutes = [15,20,30,45];
    el.innerHTML = '<div class="card"><h2>⏱ Timed Exam Deployment</h2>' +
      '<p class="field-hint">Simulate exam conditions: a prompt, a time limit, and target words pulled from your stable vocabulary. You don\'t have to use every word — write naturally.</p>' +
      '<label>Writing prompt</label><textarea id="examPromptInput" rows="2">'+Utils.escapeHtml(this.prompt)+'</textarea>' +
      '<div class="btn-row" style="margin-top:6px;"><button type="button" class="btn ghost small" id="shufflePromptBtn">🎲 New Prompt</button></div>' +
      '<label>Time limit (minutes)</label>' +
      '<div class="btn-row">' + presetMinutes.map(m=>'<button type="button" class="btn '+(this.minutes===m?'primary':'ghost')+' small min-btn" data-m="'+m+'">'+m+'</button>').join('') +
      '<input type="number" id="customMinutes" min="1" max="180" placeholder="Custom" style="width:90px;" value="'+(presetMinutes.includes(this.minutes)?'':this.minutes)+'">' +
      '</div>' +
      '<label>Target vocabulary '+(pool.length? '('+pool.length+' selected — stable, no recent errors)':'')+'</label>' +
      (pool.length ? '<div>'+pool.map(w=>'<span class="target-word-chip">'+Utils.escapeHtml(w.word)+'</span>').join('')+'</div>' :
        '<div class="banner warn">⚠️ Not enough stable words yet (need Independent Production practice with no error in the last 7 days). You can still start with no target words, or teach/practice more words first.</div>') +
      (pool.length ? '<div class="btn-row" style="margin-top:6px;"><button type="button" class="btn ghost small" id="reshuffleBtn">🔄 Reshuffle Words</button></div>' : '') +
      '<div class="btn-row" style="margin-top:16px;"><button type="button" class="btn primary" id="startExamBtn">▶ Start Exam</button></div>' +
      '</div>';

    el.querySelector('#examPromptInput').addEventListener('input', (e)=>{ this.prompt = e.target.value; this.persist(); });
    el.querySelector('#shufflePromptBtn').addEventListener('click', ()=>{ this.prompt = Utils.pick(this.PRESETS); this.persist(); this.drawConfig(); });
    el.querySelectorAll('.min-btn').forEach(b=>b.addEventListener('click', ()=>{ this.minutes = +b.dataset.m; this.persist(); this.drawConfig(); }));
    el.querySelector('#customMinutes').addEventListener('input', (e)=>{ const v=+e.target.value; if(v>0){ this.minutes = v; this.persist(); } });
    const reshuffleBtn = el.querySelector('#reshuffleBtn');
    if(reshuffleBtn) reshuffleBtn.addEventListener('click', ()=>{ this.targetWords = this.computeTargetPool(); this.persist(); this.drawConfig(); });
    el.querySelector('#startExamBtn').addEventListener('click', ()=>this.start());
  },

  start(){
    if(!this.prompt.trim()){ Utils.toast('Enter a writing prompt first.'); return; }
    // A double-click on Start Exam (or any re-entry to start() while already running) used to
    // leave the previous interval ticking alongside the new one, decrementing remainingSec
    // twice per second.
    if(this.timerHandle){ clearInterval(this.timerHandle); this.timerHandle=null; }
    this.status='running';
    this.text='';
    this.remainingSec = Math.round(this.minutes*60);
    this.checklist = {};
    this.targetWords.forEach(w=>{ this.checklist[w.id] = { outcome:null, category:null }; });
    this.drawRunning();
    this.timerHandle = setInterval(()=>this.tick(), 1000);
    this._flushPersist(); // state transition -- durable immediately, not up to 500ms later
  },

  tick(){
    this.remainingSec--;
    const display = document.getElementById('examTimerDisplay');
    if(display){
      display.textContent = this.fmtTime(this.remainingSec);
      display.classList.toggle('low', this.remainingSec<=60);
    }
    // Every 5th second, not every one -- Storage.save() rewrites the whole state, and
    // attempts[] alone can carry up to 15,000 entries. Already throttled at this call site,
    // so this flushes immediately rather than going through persist()'s own 500ms debounce
    // on top. finishWriting()'s own _flushPersist() (via the 'review' transition below)
    // still catches the exact remainingSec<=0 moment.
    this._tickCount++;
    if(this._tickCount%5===0) this._flushPersist();
    if(this.remainingSec<=0){
      clearInterval(this.timerHandle); this.timerHandle=null;
      this.finishWriting();
    }
  },

  fmtTime(sec){
    sec = Math.max(0,sec);
    const m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },

  drawRunning(){
    const el = this.container;
    el.innerHTML = '<div class="card">' +
      '<div class="exam-timer" id="examTimerDisplay">'+this.fmtTime(this.remainingSec)+'</div>' +
      '<div class="teach-box"><h4>Prompt</h4><div>'+Utils.escapeHtml(this.prompt)+'</div></div>' +
      (this.targetWords.length ? '<label>Target vocabulary <span class="opt">(use naturally — not required)</span></label><div>'+this.targetWords.map(w=>'<span class="target-word-chip">'+Utils.escapeHtml(w.word)+'</span>').join('')+'</div>' : '') +
      '<label>Your writing</label><textarea id="examTextArea" rows="14" placeholder="Start writing…">'+Utils.escapeHtml(this.text)+'</textarea>' +
      '<div class="btn-row" style="margin-top:10px;"><button type="button" class="btn bad" id="finishNowBtn">Finish Now</button></div>' +
      '</div>';
    const ta = el.querySelector('#examTextArea');
    ta.addEventListener('input', ()=>{ this.text = ta.value; this.persist(); });
    ta.focus();
    el.querySelector('#finishNowBtn').addEventListener('click', ()=>{
      Modal.confirm('Finish the exam now? The timer will stop and you\'ll move to the review checklist.', ()=>{
        clearInterval(this.timerHandle); this.timerHandle=null;
        this.finishWriting();
      });
    });
  },

  finishWriting(){
    this.status='review';
    this._flushPersist(); // state transition -- durable immediately
    // Guarded: restore() starts the countdown (see its own comment) without Exam.render() ever
    // having run, so the timer can reach zero here while the user has never opened the Writing
    // tab -- container is still null. The durable half above must still run either way.
    if(this.container) this.render(this.container);
  },

  drawReview(){
    const el = this.container;
    let html = '<div class="card"><h2>Time\'s Up — Review</h2>' +
      '<p class="field-hint">Writing area is now locked. For each target word, mark how it went — "Did not use" is not an error.</p>' +
      '<div class="essay-preview">'+Utils.escapeHtml(this.text || '(nothing written)')+'</div></div>';

    if(this.targetWords.length===0){
      html += '<div class="card"><p class="field-hint">No target words were assigned to this exam.</p>' +
        '<button type="button" class="btn primary" id="submitReviewBtn">Finish</button></div>';
    } else {
      html += '<div class="card">' + this.targetWords.map(w=>{
        const c = this.checklist[w.id];
        return '<div class="checklist-item" data-id="'+w.id+'">' +
          '<div class="w">'+Utils.escapeHtml(w.word)+'</div>' +
          '<div class="checklist-row">' +
          '<button type="button" class="outcome-btn '+(c.outcome==='correct'?'picked-correct':'')+'" data-o="correct">✓ Used correctly</button>' +
          '<button type="button" class="outcome-btn '+(c.outcome==='incorrect'?'picked-incorrect':'')+'" data-o="incorrect">✗ Used incorrectly</button>' +
          '<button type="button" class="outcome-btn '+(c.outcome==='none'?'picked-none':'')+'" data-o="none">— Did not use</button>' +
          '</div>' +
          '<div class="cat-wrap" style="margin-top:10px;'+(c.outcome==='incorrect'?'':'display:none;')+'">' +
          '<div class="error-cats">' + ERROR_CATEGORIES.map(cat=>'<button type="button" data-c="'+cat+'" class="'+(c.category===cat?'picked':'')+'">'+cat+'</button>').join('') + '</div>' +
          '</div></div>';
      }).join('') +
      '<div class="btn-row" style="margin-top:10px;"><button type="button" class="btn primary" id="submitReviewBtn" disabled>Submit Review</button></div>' +
      '</div>';
    }
    el.innerHTML = html;

    const submitBtn = el.querySelector('#submitReviewBtn');
    const checkReady = ()=>{
      const ready = this.targetWords.every(w=>{
        const c = this.checklist[w.id];
        if(!c.outcome) return false;
        if(c.outcome==='incorrect' && !c.category) return false;
        return true;
      });
      if(submitBtn) submitBtn.disabled = !ready;
    };
    el.querySelectorAll('.checklist-item').forEach(item=>{
      const wid = item.dataset.id;
      item.querySelectorAll('.outcome-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          this.checklist[wid].outcome = btn.dataset.o;
          if(btn.dataset.o!=='incorrect') this.checklist[wid].category = null;
          this.persist();
          this.drawReview();
        });
      });
      item.querySelectorAll('.cat-wrap button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          this.checklist[wid].category = btn.dataset.c;
          this.persist();
          this.drawReview();
        });
      });
    });
    checkReady();
    if(this.targetWords.length===0){
      el.querySelector('#submitReviewBtn').addEventListener('click', ()=>this.submitReview());
    } else if(submitBtn){
      submitBtn.addEventListener('click', ()=>this.submitReview());
    }
  },

  submitReview(){
    const record = { ts: Date.now(), date: Utils.todayISO(), prompt: this.prompt, minutes: this.minutes, text: this.text, targetWords: [] };
    this.targetWords.forEach(w=>{
      const c = this.checklist[w.id];
      record.targetWords.push({ word: w.word, wordId: w.id, outcome: c.outcome, category: c.category||null });
      if(c.outcome==='correct') ErrorIntegration.recordProductionSuccess(w, 'timed-exam');
      else if(c.outcome==='incorrect') ErrorIntegration.recordProductionError(w, c.category, 'timed-exam');
      // 'none' (did not use): no mastery change, no error logged
    });
    Storage.state.examLog.push(record);
    this.status='done';
    // Clears examSession rather than persisting it -- status is now 'done', and _flushPersist()
    // already redirects a 'done' status here anyway (see its comment). Cancels any pending
    // debounced persist() first, so a stale timer from an in-progress edit can't fire after
    // this and resurrect an examSession for a session that's already logged to examLog. Set
    // directly (not via clearPersisted(), which has its own conditional save) so this one
    // Storage.save() below covers both the examLog push and the cleared examSession together.
    this._cancelPendingPersist();
    Storage.state.examSession = null;
    Storage.save();
    this.lastRecord = record;
    this.render(this.container);
  },

  drawDone(){
    const r = this.lastRecord;
    const correct = r.targetWords.filter(t=>t.outcome==='correct').length;
    const incorrect = r.targetWords.filter(t=>t.outcome==='incorrect').length;
    const notUsed = r.targetWords.filter(t=>t.outcome==='none').length;
    this.container.innerHTML = '<div class="card center"><h2>🎉 Exam Reviewed</h2>' +
      '<div class="grid" style="margin:14px 0;">' +
      '<div class="stat good"><div class="num">'+correct+'</div><div class="label">Used Correctly</div></div>' +
      '<div class="stat bad"><div class="num">'+incorrect+'</div><div class="label">Used Incorrectly</div></div>' +
      '<div class="stat"><div class="num">'+notUsed+'</div><div class="label">Not Used</div></div>' +
      '</div>' +
      (incorrect ? '<p class="field-hint">'+incorrect+' word(s) were scheduled for targeted retrieval practice.</p>' : '') +
      '<button type="button" class="btn primary" id="newExamBtn">Start Another Exam</button></div>';
    this.container.querySelector('#newExamBtn').addEventListener('click', ()=>{
      this.status='config'; this.prompt=''; this.text=''; this.checklist={}; this.targetWords=[];
      // Nothing to resume yet -- examSession is already null from submitReview(); this is
      // just defense in depth in case that ever changes.
      this.clearPersisted();
      this.render(this.container);
    });
  }
};

/* ============================== LEARNING HEALTH (pure aggregations) ==============================
   Five pure functions over state.fsrsReviewLog / state.words -- no DOM, no Chart.js -- so the
   Learning Health charts are testable headlessly. Chart-rendering code below calls these and
   only handles presentation (bucket labels on axes, hiding thin lines, "not enough data" gates). */

const CALIBRATION_BUCKETS = [
  { label:'0.0–0.5', min:0, max:0.5 },
  { label:'0.5–0.7', min:0.5, max:0.7 },
  { label:'0.7–0.9', min:0.7, max:0.9 },
  { label:'0.9–1.0', min:0.9, max:1.0001 } // +epsilon so predictedR===1 lands in the last bucket
];

const RETENTION_INTERVAL_BUCKETS = [
  { label:'0–1d', min:0, max:1 },
  { label:'1–3d', min:1, max:3 },
  { label:'3–7d', min:3, max:7 },
  { label:'7–14d', min:7, max:14 },
  { label:'14–30d', min:14, max:30 },
  { label:'30d+', min:30, max:Infinity }
];

function validReviewEntries(log){
  return (log||[]).filter(e=>e && typeof e.predictedR==='number' && isFinite(e.predictedR) && typeof e.outcome==='boolean');
}

// Buckets reviews by predictedR into 4 calibration bins; y is the actual (observed) success
// rate per bin, for plotting against the y=x diagonal. n is carried per bucket so a bucket
// built from 3 reviews can be styled/tooltipped differently than one built from 300.
function computeCalibration(log){
  const entries = validReviewEntries(log);
  return CALIBRATION_BUCKETS.map(b=>{
    const inBucket = entries.filter(e=>e.predictedR>=b.min && e.predictedR<b.max);
    const n = inBucket.length;
    const actual = n ? inBucket.reduce((sum,e)=>sum+(e.outcome?1:0),0)/n : null;
    return { label:b.label, min:b.min, max:b.max, n, actual };
  });
}

// Brier score: mean((predictedR - outcome)^2) over all reviews with a usable prediction.
// Lower is better (0 = perfect calibration, 1 = worst possible on a 0/1 outcome).
function computeBrier(log){
  const entries = validReviewEntries(log);
  if(entries.length===0) return { value:null, n:0 };
  const sum = entries.reduce((s,e)=>{ const o = e.outcome?1:0; return s+(e.predictedR-o)*(e.predictedR-o); }, 0);
  return { value: sum/entries.length, n: entries.length };
}

// Per dimension, orders each word's reviews chronologically and takes the median stabilityAfter
// across words at each review-index (1st review, 2nd review, ...) -- median rather than mean so
// one runaway-stability word doesn't drag the curve. Returns every index with data; the caller
// decides whether a dimension has enough points to draw (< 5 points -> hide the line entirely).
function computeStabilityGrowth(log){
  const dims = (typeof FSRSScheduler!=='undefined' && FSRSScheduler.DIMENSIONS) ? FSRSScheduler.DIMENSIONS : ['recognition','production','meaningRecall'];
  const result = {};
  dims.forEach(dim=>{
    const byWord = {};
    (log||[]).forEach(e=>{
      if(!e || e.dimension!==dim || typeof e.stabilityAfter!=='number' || !isFinite(e.stabilityAfter)) return;
      (byWord[e.wordId] = byWord[e.wordId]||[]).push(e);
    });
    Object.keys(byWord).forEach(wordId=>byWord[wordId].sort((a,b)=>a.ts-b.ts));
    const maxLen = Object.values(byWord).reduce((m,arr)=>Math.max(m,arr.length),0);
    const points = [];
    for(let i=0;i<maxLen;i++){
      const atIndex = Object.values(byWord).filter(arr=>arr.length>i).map(arr=>arr[i].stabilityAfter);
      if(atIndex.length===0) continue;
      const sorted = atIndex.slice().sort((a,b)=>a-b);
      const mid = Math.floor(sorted.length/2);
      const median = sorted.length%2 ? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
      points.push({ index:i+1, n:atIndex.length, median });
    }
    result[dim] = points;
  });
  return result;
}

// Buckets reviews by elapsedDays (time since last review) into fixed intervals; y is the
// observed success rate per bucket, n carried alongside for the same reason as calibration.
function computeRetentionByInterval(log){
  const entries = (log||[]).filter(e=>e && typeof e.elapsedDays==='number' && isFinite(e.elapsedDays) && typeof e.outcome==='boolean');
  return RETENTION_INTERVAL_BUCKETS.map(b=>{
    const inBucket = entries.filter(e=>e.elapsedDays>=b.min && e.elapsedDays<b.max);
    const n = inBucket.length;
    const rate = n ? inBucket.reduce((sum,e)=>sum+(e.outcome?1:0),0)/n : null;
    return { label:b.label, min:b.min, max:b.max, n, rate };
  });
}

// Of words that completed teaching, what fraction succeeded on their first non-teaching
// (retrieval) attempt? A word only enters the denominator once it actually HAS a non-teaching
// history entry -- a taught word that hasn't been retrieval-practiced yet doesn't count as
// either a success or a failure.
function computeFirstPostTeachingRetention(words){
  let y = 0, n = 0;
  (words||[]).forEach(w=>{
    if(!w || !w.teaching || !w.teaching.completed) return;
    // Prefer the durable firstRetrieval snapshot (set once in WordModel.logAttempt) -- the
    // history scan below is the migration path for saves made before that field existed; it
    // used to silently degrade to "oldest-surviving attempt" once the 200-entry cap trimmed
    // the genuine first one off the front of history.
    const first = w.firstRetrieval || (w.history||[]).find(h=>h && h.phase!=='teaching');
    if(!first) return;
    y++;
    if(first.correct) n++;
  });
  return { n, y, rate: y ? n/y : null };
}

/* ============================== PHASE D: "THIS WEEK" AGGREGATIONS (pure) ==============================
   All read state.dailyActivity / state.words / state.milestones as-is -- no DOM, no Chart.js. */

// Sums each of dailyActivity's four counters over [todayISO-endOffset, todayISO-startOffset]
// (inclusive, offsets in days-before-today) and returns {reviews,correct,teaching,newWords}.
function sumDailyActivityRange(dailyActivity, todayISO, startOffset, endOffset){
  const totals = { reviews:0, correct:0, teaching:0, newWords:0 };
  for(let i=startOffset; i<=endOffset; i++){
    const bucket = (dailyActivity||{})[Utils.addDays(todayISO, -i)];
    if(!bucket) continue;
    totals.reviews += bucket.reviews||0;
    totals.correct += bucket.correct||0;
    totals.teaching += bucket.teaching||0;
    totals.newWords += bucket.newWords||0;
  }
  return totals;
}

// This week (today..today-6) vs. the prior week (today-7..today-13). `deltas` is null when
// the prior week had zero activity at all -- comparing against nothing would produce a
// meaningless "+100%"/"up from 0" arrow, so the caller shows raw numbers with no arrow instead.
function computeWeekOverWeek(dailyActivity, todayISO){
  const accuracyOf = w => w.reviews ? Math.round(w.correct/w.reviews*100) : null;
  const thisWeek = sumDailyActivityRange(dailyActivity, todayISO, 0, 6);
  const priorWeek = sumDailyActivityRange(dailyActivity, todayISO, 7, 13);
  thisWeek.accuracy = accuracyOf(thisWeek);
  priorWeek.accuracy = accuracyOf(priorWeek);
  const priorWeekEmpty = !(priorWeek.reviews || priorWeek.teaching || priorWeek.newWords);
  const deltas = priorWeekEmpty ? null : {
    reviews: thisWeek.reviews - priorWeek.reviews,
    accuracy: (thisWeek.accuracy!==null && priorWeek.accuracy!==null) ? thisWeek.accuracy-priorWeek.accuracy : null,
    newWords: thisWeek.newWords - priorWeek.newWords
  };
  return { thisWeek, priorWeek, priorWeekEmpty, deltas };
}

// Current streak (consecutive days with any activity, ending today or yesterday if today
// hasn't happened yet) and longest-ever streak, both scanned directly from dailyActivity --
// a single, already-unified source (every write path bumps it) rather than piecing together
// sessionLog/word.history/writingLog/examLog by hand. This is now the only streak source in
// the app (Phase E removed the old Analytics.computeStreak/activityDates entirely) -- it
// feeds both the "This Week" display and buildAchievementContext's ctx.streak.
function computeStreakFromActivity(dailyActivity, todayISO){
  const dates = Object.keys(dailyActivity||{}).filter(d=>{
    const b = dailyActivity[d];
    return b && ((b.reviews||0)>0 || (b.teaching||0)>0 || (b.newWords||0)>0);
  }).sort();
  if(dates.length===0) return { current:0, longest:0 };
  const dateSet = new Set(dates);
  let current = 0;
  let cursor = todayISO;
  if(!dateSet.has(cursor)) cursor = Utils.addDays(cursor, -1);
  while(dateSet.has(cursor)){ current++; cursor = Utils.addDays(cursor, -1); }
  let longest = 0, run = 0, prev = null;
  dates.forEach(d=>{
    run = (prev && Utils.diffDays(prev, d)===1) ? run+1 : 1;
    longest = Math.max(longest, run);
    prev = d;
  });
  return { current, longest };
}

const HEATMAP_DAYS = 84;
// Oldest-first array of {date, count, level} for the last `days` days (level 0-3 by
// dailyActivity[date].reviews: 0 / 1-5 / 6-15 / 16+). Weekday alignment for the GitHub-style
// grid layout is a rendering concern, done where this gets turned into HTML, not here.
function computeHeatmapCells(dailyActivity, todayISO, days){
  days = days || HEATMAP_DAYS;
  const cells = [];
  for(let i=days-1; i>=0; i--){
    const date = Utils.addDays(todayISO, -i);
    const reviews = ((dailyActivity||{})[date] && dailyActivity[date].reviews) || 0;
    const level = reviews<=0 ? 0 : reviews<=5 ? 1 : reviews<=15 ? 2 : 3;
    cells.push({ date, count: reviews, level });
  }
  return cells;
}

// The single day (if any) with the most reviews logged. Null when every day is zero --
// caller hides the "highest single day" row rather than showing a dash.
function computeHighestSingleDay(dailyActivity){
  let best = null;
  Object.keys(dailyActivity||{}).forEach(date=>{
    const reviews = ((dailyActivity||{})[date] && dailyActivity[date].reviews) || 0;
    if(reviews>0 && (!best || reviews>best.reviews)) best = { date, reviews };
  });
  return best;
}

// The word that reached Stable/Exam Ready fastest from its creation date (word.created ->
// word.firstMasteryAt). Null when no word has firstMasteryAt yet -- caller hides the row.
function computeFastestMastery(words){
  let best = null;
  (words||[]).forEach(w=>{
    if(!w || typeof w.firstMasteryAt!=='number' || !w.created) return;
    // w.created is a local YYYY-MM-DD string (like every other date string in this file) --
    // diffDays takes two of those, so firstMasteryAt (a ms timestamp) is read through
    // Utils.isoFromMs first rather than parsed as UTC midnight, which used to put the
    // baseline off by up to a day and bake that offset into the subtraction.
    const days = Utils.diffDays(w.created, Utils.isoFromMs(w.firstMasteryAt));
    if(days<0) return; // guards against clock skew rather than showing a negative duration
    if(!best || days<best.days) best = { wordId: w.id, word: w.word, days };
  });
  return best;
}

// "today" / "yesterday" / "N days/weeks/months/years ago" for the milestone wall.
function relativeDate(ts, nowMs){
  const days = Math.floor(((nowMs==null?Date.now():nowMs) - ts) / 86400000);
  if(days<=0) return 'today';
  if(days===1) return 'yesterday';
  if(days<7) return days+' days ago';
  if(days<30){ const w=Math.floor(days/7); return w+(w===1?' week ago':' weeks ago'); }
  if(days<365){ const m=Math.floor(days/30); return m+(m===1?' month ago':' months ago'); }
  const y=Math.floor(days/365); return y+(y===1?' year ago':' years ago');
}

/* ============================== PHASE E: RETENTION GAPS + COVERAGE TABLE (pure) ============== */

// Per dimension: lapsed = words that once reached 'Achieved' (everAchievedAt set) but
// aren't 'Achieved' right now; matured = words that ever reached 'Achieved' at all;
// rate = lapsed/matured, or null when matured is 0 (nothing to compute a rate over --
// the caller hides that dimension's row rather than dividing by zero).
function computeLapseRates(words){
  return DIMENSIONS.map(dim=>{
    let lapsed = 0, matured = 0;
    (words||[]).forEach(w=>{
      const d = w && w.dims && w.dims[dim.key];
      if(!d || !d.everAchievedAt) return;
      matured++;
      if(d.status!=='Achieved') lapsed++;
    });
    return { key: dim.key, label: dim.label, lapsed, matured, rate: matured ? lapsed/matured : null };
  });
}

// Total logged failures per dimension -- this is exactly what the Phase B "Weakest
// Vocabulary Dimensions" bar chart plotted (renderErrorChart), just extracted into a named,
// testable function per Phase E's instruction to keep the data available even though the
// chart itself is replaced by the coverage table below. (It wasn't a separately named
// function before Phase E -- Phase B inlined this reduce directly inside renderErrorChart.)
function computeFailuresByDimension(words){
  return DIMENSIONS.map(dim=>({
    key: dim.key, label: dim.label,
    fails: (words||[]).reduce((sum,w)=>sum+((w.dims && w.dims[dim.key] && w.dims[dim.key].fail)||0), 0)
  }));
}

// One row per dimension, straight off word.dims[k] -- "words assessed" is the count of
// words with any status beyond 'Not assessed' for that dim, and %Achieved/%Developing are
// percentages OF that assessed count (not of all words), since a dimension nobody has been
// tested on yet can't honestly report a success rate. hasFailures is exposed for the
// caller's Practice-button enable/disable check.
function computeDimensionCoverage(words){
  return DIMENSIONS.map(dim=>{
    let assessed=0, achieved=0, developing=0, fails=0, hasFailures=false;
    (words||[]).forEach(w=>{
      const d = w && w.dims && w.dims[dim.key];
      if(!d) return;
      fails += d.fail||0;
      if((d.fail||0)>0) hasFailures = true;
      if(d.status==='Not assessed') return;
      assessed++;
      if(d.status==='Achieved') achieved++;
      else if(d.status==='Developing') developing++;
    });
    return {
      key: dim.key, label: dim.label, assessed,
      pctAchieved: assessed ? Math.round(achieved/assessed*100) : 0,
      pctDeveloping: assessed ? Math.round(developing/assessed*100) : 0,
      fails, hasFailures
    };
  });
}

/* ============================== PHASE F+1: ARM COMPARISON (pure) ==============================
   Read-only aggregation over Storage.state.attempts (Phase F instrumentation) + word state.
   No writer touched, no schema change -- this section only reads.

   Pinned to FSRS-6 (FSRSScheduler.FSRS_GENERATION, ts-fsrs 5.4.2 vendored in
   lib/fsrs.umd.js). attempts[].track is 'legacy'/'fsrs'/null -- it does not encode which FSRS
   *generation* produced an 'fsrs' attempt, so if the library is ever upgraded, every existing
   'fsrs'-tracked attempt would silently become indistinguishable from new FSRS-7 attempts under
   the same tag, making the "fsrs" arm a heterogeneous mix rather than one scheduling regime. The
   version pin is recorded in the rendered section header (see Analytics.renderArmComparisonCard)
   as the actual policy: a generation change should be evaluated as its own experiment on top of
   this one's results, not folded in here.

   Eligibility: both scheduling regimes run concurrently per word from the moment teaching
   completes (FSRS grades recognition/meaningRecall/production; the legacy ladder grades
   everything else, via the same practice session) -- there is no word-level arm flip and no
   date segmentation needed. A word simply has tracked attempts in whichever arm(s) its question
   draws have actually exercised. Per-word metrics below exclude any word with zero tracked
   (track==='legacy' or 'fsrs') attempts -- untracked events (teaching/writing/exam, track:null)
   don't belong to either arm and can't inform an arm comparison. */
function computeArmComparison(words, attempts){
  attempts = attempts || [];
  const byWord = {};
  // allByWord is unfiltered (every track, including untracked teaching/writing/exam entries)
  // -- the attempts-to-Stable scan below needs the untracked ones too (they feed
  // stableOtherSum), which byWord's tracked-only entries can't provide. Building this once
  // here turns the per-word upToStable lookup from an O(attempts) re-filter of the whole
  // array into an O(that word's own attempts) slice of a pre-built index -- O(words x
  // attempts) over the full array otherwise, which gets into the millions of comparisons
  // once attempts[] is near its 15,000-entry cap and there are hundreds of taught words.
  const allByWord = {};
  attempts.forEach(a=>{
    (allByWord[a.wordId] || (allByWord[a.wordId]=[])).push(a);
    if(a.track!=='legacy' && a.track!=='fsrs') return;
    (byWord[a.wordId] || (byWord[a.wordId]=[])).push(a);
  });

  const taught = (words||[]).filter(w=>w && w.teaching && w.teaching.completed);

  let legacyIntervalSum=0, legacyIntervalN=0;
  let fsrsIntervalSum=0, fsrsIntervalN=0;
  let stableWordN=0, stableAttemptsSum=0, stableLegacySum=0, stableFsrsSum=0, stableOtherSum=0;

  taught.forEach(w=>{
    // Deliberately byWord (tracked-only), not allByWord -- a word with only untracked
    // teaching/writing/exam entries must still be excluded here (it has zero attempts in
    // either arm), and allByWord alone can't make that distinction since it also carries
    // those untracked entries.
    const tracked = byWord[w.id];
    if(!tracked || !tracked.length) return; // excluded: no tracked attempts in either arm

    // Mean interval, normalized to one value per word before averaging -- legacy has exactly
    // one interval per word (word.srs.interval); FSRS has up to three (recognition,
    // meaningRecall, production, each with their own scheduled_days). Averaging raw per-card
    // FSRS values against per-word legacy values would compare different units, so FSRS is
    // collapsed to a per-word mean across its *active* dimensions (reps>0 -- "hasn't started"
    // isn't a scheduled interval) first.
    // "Has at least one tracked attempt in this arm," not "currently scheduled by this
    // arm" -- word.srs.interval reflects the last legacy applyRating call, which may be
    // older than the word's most recent FSRS activity. Both arms run concurrently per
    // word (mergeQueues), so this is the state as of the last legacy grade, which is the
    // closest available proxy for "what the legacy scheduler currently thinks this word's
    // interval is." The FSRS side uses the same semantic (at least one attempt) plus a
    // redundant reps>0 guard per dimension.
    if(tracked.some(a=>a.track==='legacy')){
      legacyIntervalSum += w.srs.interval||0;
      legacyIntervalN++;
    }
    if(tracked.some(a=>a.track==='fsrs')){
      const dims = (typeof FSRSScheduler!=='undefined' && FSRSScheduler.DIMENSIONS) ? FSRSScheduler.DIMENSIONS : ['recognition','production','meaningRecall'];
      const activeDims = dims.filter(d=>w.fsrs && w.fsrs[d] && w.fsrs[d].reps>0);
      if(activeDims.length){
        fsrsIntervalSum += activeDims.reduce((s,d)=>s+(w.fsrs[d].scheduled_days||0), 0) / activeDims.length;
        fsrsIntervalN++;
      }
    }

    // Attempts-to-Stable: word.firstMasteryAt is the set-once timestamp of when this word
    // first reached Stable/Exam Ready (WordModel.checkFirstMastery) -- used here as the
    // boundary for "attempts logged before this word became Stable". Requires
    // computeMastery(word)==='Stable' *right now* (not Exam Ready -- see commit message on why
    // this anchor, applied identically to both arms, is valid despite being legacy-flavored)
    // and firstMasteryAt actually set; a word that's currently Stable but has no
    // firstMasteryAt (imported/repaired state, see repairWord) has no boundary to count
    // against and is excluded from this metric specifically, even though it still counts
    // toward the interval metrics above.
    // Stable OR Exam Ready -- firstMasteryAt is stamped on either transition
    // (checkFirstMastery accepts both), and Exam Ready is reached *through* Stable, so
    // excluding it here would drop exactly the words that mastered hardest.
    const m = WordModel.computeMastery(w);
    if((m==='Stable' || m==='Exam Ready') && typeof w.firstMasteryAt==='number'){
      const upToStable = (allByWord[w.id]||[]).filter(a=>a.ts<=w.firstMasteryAt);
      if(upToStable.length>0){
        stableWordN++;
        stableAttemptsSum += upToStable.length;
        stableLegacySum += upToStable.filter(a=>a.track==='legacy').length;
        stableFsrsSum += upToStable.filter(a=>a.track==='fsrs').length;
        stableOtherSum += upToStable.filter(a=>a.track!=='legacy' && a.track!=='fsrs').length;
      }
    }
  });

  return {
    fsrsGeneration: (typeof FSRSScheduler!=='undefined' && FSRSScheduler.FSRS_GENERATION) || 0,
    legacy: { meanInterval: legacyIntervalN ? legacyIntervalSum/legacyIntervalN : null, n: legacyIntervalN },
    fsrs: { meanInterval: fsrsIntervalN ? fsrsIntervalSum/fsrsIntervalN : null, n: fsrsIntervalN },
    // reviewsToStable.mean is the headline: unsegmented, mean count of ALL attempts (both
    // tracks, plus any untracked ones for that word) logged before firstMasteryAt, averaged
    // across qualifying words. legacyMean/fsrsMean/otherMean are the same qualifying-word set's
    // per-arm attempt counts, shown only as a descriptive breakdown of what the headline is
    // made of -- the app has no model that decomposes a word's progress into
    // "attributable to FSRS vs legacy scheduling" within that one word, so a causal per-arm
    // number here would be fabricated.
    reviewsToStable: {
      mean: stableWordN ? stableAttemptsSum/stableWordN : null,
      n: stableWordN,
      legacyMean: stableWordN ? stableLegacySum/stableWordN : null,
      fsrsMean: stableWordN ? stableFsrsSum/stableWordN : null,
      otherMean: stableWordN ? stableOtherSum/stableWordN : null
    }
  };
}

const Analytics = {
  charts: {},
  _milestonesExpanded: false, // transient UI toggle, not persisted
  _coverageSort: { key:'label', dir:'asc' }, // transient UI state, not persisted

  MILESTONE_META: {
    first_word: { icon:'📖', text: ()=>'Started your vocabulary journey' },
    first_mastery: { icon:'⭐', text: (m,word)=>(word?('"'+word.word+'"'):'A word')+' reached '+(m.detail||'Stable')+' mastery' }
  },

  ACHIEVEMENTS: [
    { id:'first_word', icon:'📖', name:'First Word Taught', desc:'Complete teaching for 1 word.', check: ctx=>ctx.taughtCount>=1, metric: ctx=>ctx.taughtCount, target:1, unit:'words taught' },
    { id:'vocab_builder', icon:'📚', name:'Vocabulary Builder', desc:'Complete teaching for 10 words.', check: ctx=>ctx.taughtCount>=10, metric: ctx=>ctx.taughtCount, target:10, unit:'words taught' },
    { id:'scholar', icon:'🎓', name:'Scholar', desc:'Complete teaching for 50 words.', check: ctx=>ctx.taughtCount>=50, metric: ctx=>ctx.taughtCount, target:50, unit:'words taught' },
    { id:'error_fixer', icon:'🛠️', name:'Error Fixer', desc:'Log 5 error repairs.', check: ctx=>ctx.errorLogCount>=5, metric: ctx=>ctx.errorLogCount, target:5, unit:'errors logged' },
    { id:'exam_ready', icon:'🎯', name:'Exam Ready', desc:'Get 1 word to Exam Ready.', check: ctx=>ctx.examReadyCount>=1, metric: ctx=>ctx.examReadyCount, target:1, unit:'words exam-ready' },
    { id:'exam_master', icon:'🏆', name:'Exam Master', desc:'Get 10 words to Exam Ready.', check: ctx=>ctx.examReadyCount>=10, metric: ctx=>ctx.examReadyCount, target:10, unit:'words exam-ready' },
    { id:'consistent_learner', icon:'🔥', name:'Consistent Learner', desc:'Maintain a 7-day activity streak.', check: ctx=>ctx.streak>=7, metric: ctx=>ctx.streak, target:7, unit:'day streak' },
    { id:'writing_warrior', icon:'✍️', name:'Writing Warrior', desc:'Complete 1 Timed Exam or Audit session.', check: ctx=>ctx.writingSessions>=1, metric: ctx=>ctx.writingSessions, target:1, unit:'sessions' }
  ],

  render(){
    try{
      this._renderInner();
    }catch(err){
      const el = document.getElementById('view-analytics');
      el.innerHTML = '<div class="card empty-state"><div class="big">⚠️</div><h2>Analytics failed to render</h2><p>'+String(err && err.message || err)+'</p></div>';
    }
  },

  _renderInner(){
    const el = document.getElementById('view-analytics');
    this.destroyCharts();

    // Phase D placement: "This Week" sits above achievements; the milestone wall and
    // personal bests sit below achievements, above the chart grid -- all three are plain
    // HTML/CSS (no Chart.js), so unlike the sections below they render in every branch,
    // including the Chart-unavailable and empty-word-bank early returns. Arm Comparison
    // (Phase F+1) joins them for the same reason -- it's plain HTML/CSS over
    // Storage.state.attempts, not a chart, so there's no reason to gate it behind Chart.js
    // loading or a non-empty word bank; it has its own internal "not enough data" fallbacks.
    let html = this.renderThisWeekSection() + this.renderAchievementsSection() +
      this.renderMilestoneWall() + this.renderPersonalBests() + this.renderArmComparisonCard();

    if(typeof Chart === 'undefined'){
      html += '<div class="card empty-state"><div class="big">📡</div><h2>Charts unavailable</h2>' +
        '<p>Chart.js could not be loaded (no cached copy while offline). Everything else in the app still works.</p></div>';
      el.innerHTML = html;
      this.wireSectionToggles(el);
      return;
    }

    const words = Storage.state.words;

    if(words.length===0){
      // The achievements block above (renderAchievementsSection) already renders every
      // locked card at 0/target using the same progress-bar markup regardless of word
      // count, so this empty state doesn't need its own achievement preview -- it just
      // needs to stop dead-ending and point at what adding a word actually unlocks.
      html += '<div class="card empty-state"><div class="big">📊</div><h2>No chart data yet</h2><p>Your achievement progress above is already tracking. Add and practice your first word to unlock <strong>Words Added Over Time</strong> -- the first analytics chart -- plus mastery, review-load, and dimension charts.</p></div>';
      el.innerHTML = html;
      this.wireSectionToggles(el);
      return;
    }

    html += '<div class="analytics-grid">' +
      '<div class="chart-card"><h3>Words Added vs. Learned Over Time</h3><div class="chart-sub">Cumulative added vs. cumulative reached Stable+</div><div class="chart-wrap"><canvas id="chartProgress"></canvas></div></div>' +
      '<div class="chart-card"><h3>Current Mastery Distribution</h3><div class="chart-sub">Across '+words.length+' word(s)</div><div class="chart-wrap"><canvas id="chartMastery"></canvas></div></div>' +
      '<div class="chart-card"><h3>Upcoming Review Load</h3><div class="chart-sub">Taught words due within N days (cumulative)</div><div class="chart-wrap"><canvas id="chartForecast"></canvas></div></div>' +
      this.renderCoverageTable() +
      '</div>';

    // Learning Health -- Tier-1 rigor charts read straight off state.fsrsReviewLog via the
    // pure compute* functions above. Each of the three FSRS-log charts is gated on its OWN
    // usable-entry count (< 20 -> placeholder instead of a chart, same rationale as before:
    // a raw Brier score or per-bucket rate would look far more authoritative than a sample
    // that small actually supports) -- NOT a shared count, because a State.New grade has
    // predictedR===null (nothing to calibrate against yet) while still carrying a valid
    // stabilityAfter/elapsedDays, so calibration's usable-n can lag stability/retention's by
    // a lot for a new user. The consistency heatmap (Phase D) reads dailyActivity instead, so
    // it's NOT behind any of these gates -- it renders (possibly all-empty) regardless.
    const reviewLog = Storage.state.fsrsReviewLog || [];
    const brier = computeBrier(reviewLog);
    // Each Learning Health chart needs a different field on the log entry (predictedR for
    // calibration, stabilityAfter for stability growth, elapsedDays+outcome for retention),
    // and a State.New grade legitimately has predictedR===null (no prior state to predict
    // from) while still carrying stabilityAfter/elapsedDays -- so these three counts diverge
    // for a new user and must gate their own card independently, not share one count.
    const calibrationN = brier.n;
    // Raw entry count isn't what renderStabilityGrowthChart actually needs -- it hides any
    // dimension with fewer than 5 successive review-indices (a 1-2 point "line" is noise, not
    // a trend), so the gate here must mirror that same per-dimension depth check, not a flat
    // entry count -- otherwise the canvas gets created (stabilityN looks big) while the chart
    // itself has zero qualifying dimensions to draw, i.e. an empty axes-only chart.
    const growthPreview = computeStabilityGrowth(reviewLog);
    const stabilityDimCount = Object.keys(growthPreview).filter(d=>growthPreview[d].length>=5).length;
    const retentionN = reviewLog.filter(e=>e && typeof e.elapsedDays==='number' && isFinite(e.elapsedDays) && typeof e.outcome==='boolean').length;
    const CHART_MIN = 20;
    const hasCalibrationData = calibrationN >= CHART_MIN;
    const hasStabilityData = stabilityDimCount > 0;
    const hasRetentionData = retentionN >= CHART_MIN;
    const fptr = computeFirstPostTeachingRetention(words);
    const placeholderFor = n => '<div class="chart-wrap lh-placeholder">Not enough data yet ('+n+'/'+CHART_MIN+')</div>';
    const stabilityPlaceholder = '<div class="chart-wrap lh-placeholder">Not enough data yet — needs 5+ reviews in a dimension</div>';

    html += '<h2 class="lh-section-title">📈 Learning Health</h2>' +
      '<div class="analytics-grid">' +
      '<div class="chart-card"><h3>Prediction Calibration</h3>' +
        (hasCalibrationData
          ? '<div class="chart-sub">Brier score '+(brier.value==null ? '—' : brier.value.toFixed(3))+' (lower is better, n='+brier.n+')</div><div class="chart-wrap"><canvas id="chartCalibration"></canvas></div>'
          : '<div class="chart-sub">Predicted vs. actual recall probability</div>'+placeholderFor(calibrationN)) +
        '</div>' +
      '<div class="chart-card"><h3>Stability Growth by Dimension</h3><div class="chart-sub">Median stability per review index, by FSRS dimension</div>' +
        (hasStabilityData ? '<div class="chart-wrap"><canvas id="chartStabilityGrowth"></canvas></div>' : stabilityPlaceholder) +
        '</div>' +
      '<div class="chart-card"><h3>Retention by Interval</h3><div class="chart-sub">Success rate vs. days since last review</div>' +
        (hasRetentionData ? '<div class="chart-wrap"><canvas id="chartRetentionInterval"></canvas></div>' : placeholderFor(retentionN)) +
        '</div>' +
      this.renderHeatmapCard() +
      this.renderRetentionGapsCard() +
      '</div>' +
      (fptr.y>0
        ? '<div class="card"><div class="achv-stats-grid"><div class="stat good"><div class="num">'+Math.round(fptr.rate*100)+'%</div><div class="label">First-Post-Teaching Retention ('+fptr.n+'/'+fptr.y+' words)</div></div></div></div>'
        : '');

    el.innerHTML = html;
    this.wireSectionToggles(el);

    const css = getComputedStyle(document.documentElement);
    const v = name => css.getPropertyValue(name).trim();
    const theme = {
      dim: v('--text-dim') || '#6E6E73',
      grid: v('--border') || '#E3E3E6',
      accent: v('--accent') || '#0071E3',
      accentWash: v('--accent-wash') || 'rgba(0,113,227,.16)',
      good: v('--good') || '#1FA34A',
      bad: v('--bad') || '#E0342A',
      highlight: v('--highlight') || '#FF9F0A',
      text: v('--text') || '#1D1D1F',
      bgElev: v('--bg-elev') || '#FFFFFF'
    };
    Chart.defaults.color = theme.dim;
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

    this.renderProgressChart(theme);
    this.renderMasteryChart(theme);
    this.renderForecastChart(theme);
    // renderErrorChart (Phase B's "Weakest Vocabulary Dimensions" bar chart) is no longer
    // called -- Phase E replaced its card slot above with the Dimension Coverage table.
    // Left defined, and its data (computeFailuresByDimension) is still available, per
    // instruction: "keep the data available, just stop rendering it."

    if(hasCalibrationData) this.renderCalibrationChart(theme, reviewLog);
    if(hasStabilityData) this.renderStabilityGrowthChart(theme, reviewLog, growthPreview);
    if(hasRetentionData) this.renderRetentionIntervalChart(theme, reviewLog);
  },

  destroyCharts(){
    Object.keys(this.charts).forEach(k=>{ if(this.charts[k]) this.charts[k].destroy(); });
    this.charts = {};
  },

  wireSectionToggles(el){
    const btn = el.querySelector('#milestoneToggleBtn');
    if(btn) btn.addEventListener('click', ()=>{ this._milestonesExpanded = !this._milestonesExpanded; this.render(); });

    el.querySelectorAll('.coverage-table th[data-sort-key]').forEach(th=>{
      th.addEventListener('click', ()=>{
        const key = th.dataset.sortKey;
        if(this._coverageSort.key===key) this._coverageSort.dir = this._coverageSort.dir==='asc' ? 'desc' : 'asc';
        else { this._coverageSort.key = key; this._coverageSort.dir = 'asc'; }
        this.render();
      });
    });
    el.querySelectorAll('.practice-cell-btn').forEach(pbtn=>{
      if(pbtn.disabled) return;
      pbtn.addEventListener('click', ()=>Views.runDimensionPractice(pbtn.dataset.dim));
    });
  },

  renderThisWeekSection(){

    const activity = Storage.state.dailyActivity || {};
    const wow = computeWeekOverWeek(activity, today);
    const streak = computeStreakFromActivity(activity, today);

    const deltaHtml = (value, suffix)=>{
      if(wow.priorWeekEmpty || value==null) return '';
      if(value===0) return '<span class="delta flat">— no change</span>';
      const up = value>0;
      return '<span class="delta '+(up?'up':'down')+'">'+(up?'▲':'▼')+' '+Math.abs(value)+(suffix||'')+' vs last wk</span>';
    };

    return '<div class="card">' +
      '<h3 style="margin:0 0 10px;">📅 This Week</h3>' +
      '<div class="achv-stats-grid">' +

        '<div class="stat week-stat"><div class="num">'+(wow.thisWeek.accuracy==null?'—':wow.thisWeek.accuracy+'%')+'</div><div class="label">Accuracy</div>'+deltaHtml(wow.deltas&&wow.deltas.accuracy,'pp')+'</div>' +
        '<div class="stat week-stat"><div class="num">'+wow.thisWeek.newWords+'</div><div class="label">New Words</div>'+deltaHtml(wow.deltas&&wow.deltas.newWords)+'</div>' +

  renderMilestoneWall(){

  renderPersonalBests(){
    const today = Utils.todayISO();
    const activity = Storage.state.dailyActivity || {};
    const streak = computeStreakFromActivity(activity, today);
    const highestDay = computeHighestSingleDay(activity);
    const fastest = computeFastestMastery(Storage.state.words || []);

    const rows = [];
    if(streak.longest>0) rows.push({ label:'Longest streak', value: streak.longest+' day'+(streak.longest===1?'':'s') });
    if(highestDay) rows.push({ label:'Highest single-day reviews', value: highestDay.reviews+' on '+Utils.fmtDate(highestDay.date) });
    if(fastest){
      const d = Math.round(fastest.days);
      rows.push({ label:'Fastest word to mastery', value: d+' day'+(d===1?'':'s')+' — "'+Utils.escapeHtml(fastest.word)+'"' });

      rows.map(r=>'<div class="pb-row"><span class="pb-label">'+Utils.escapeHtml(r.label)+'</span><span class="pb-value">'+r.value+'</span></div>').join('') +
      '</div>';

  // Phase F+1: read-only, computed entirely from computeArmComparison (see the pure function's
  // header comment for the eligibility/anchor/normalization rationale). Hidden entirely when no
  // taught word has any tracked (legacy or fsrs) attempt yet -- nothing to compare. Once shown,
  // each metric falls back to its own "not enough data" note rather than hiding piecemeal, so
  // the section's presence is a stable signal that the feature exists even before a given
  // number is available.
  renderArmComparisonCard(){
    const cmp = computeArmComparison(Storage.state.words || [], Storage.state.attempts || []);
    if(cmp.legacy.n===0 && cmp.fsrs.n===0) return '';

    const rts = cmp.reviewsToStable;
    const headline = rts.n>0
      ? '<div class="achv-stats-grid"><div class="stat good"><div class="num">'+rts.mean.toFixed(1)+'</div><div class="label">Mean Attempts to First Mastery ('+rts.n+' word'+(rts.n===1?'':'s')+')</div></div></div>'
      : '<p class="field-hint">Not enough data yet — no word has both reached Stable-or-better and logged attempts[] entries before doing so.</p>';
    const rtsBreakdown = rts.n>0
      ? '<p class="field-hint">Of that, legacy-tracked ≈'+rts.legacyMean.toFixed(1)+', FSRS-tracked ≈'+rts.fsrsMean.toFixed(1)+', untracked (teaching/writing/exam) ≈'+rts.otherMean.toFixed(1)+' — descriptive only. There is no model here that attributes a word\'s progress to one arm vs. the other within a single word, so this breakdown is not a per-arm outcome.</p>'
      : '';

    return '<div class="card">' +
      '<h3 style="margin:0 0 6px;">🧪 Arm Comparison — FSRS-'+cmp.fsrsGeneration+' vs Legacy</h3>' +
      '<p class="field-hint">Pinned to FSRS-'+cmp.fsrsGeneration+' (ts-fsrs vendored in lib/fsrs-scheduler.js). '+
      'attempts[].track does not encode the FSRS generation, so a future library upgrade would silently mix generations under the same tag — '+
      'treat any FSRS-'+(cmp.fsrsGeneration+1)+' migration as a new experiment on top of these results, not a continuation of them.</p>' +
      '<p class="field-hint">Both regimes run concurrently per word from the moment teaching completes — there is no word-level arm flip, and per-word metrics below exclude words with no tracked attempts in either arm.</p>' +
      headline + rtsBreakdown +
      '<div class="achv-stats-grid" style="margin-top:10px;">' +
      '<div class="stat"><div class="num">'+(cmp.legacy.n>0 ? cmp.legacy.meanInterval.toFixed(1)+'d' : '—')+'</div><div class="label">Interval at Last Legacy Grade ('+cmp.legacy.n+' word'+(cmp.legacy.n===1?'':'s')+')</div></div>' +
      '<div class="stat"><div class="num">'+(cmp.fsrs.n>0 ? cmp.fsrs.meanInterval.toFixed(1)+'d' : '—')+'</div><div class="label">FSRS Mean Interval ('+cmp.fsrs.n+' word'+(cmp.fsrs.n===1?'':'s')+')</div></div>' +
      '</div>' +
      '<p class="field-hint">Legacy intervals are capped at 30 days (WordModel.applyRating); FSRS intervals are uncapped. This is a scheduling design difference, not a finding — read the two numbers as different units, not a race.</p>' +
      '</div>';
  },

  renderHeatmapCard(){
    const today = Utils.todayISO();
    const cells = computeHeatmapCells(Storage.state.dailyActivity || {}, today, HEATMAP_DAYS);
    // GitHub-style alignment: pad the front with invisible placeholder cells so the first
    // real cell lands in its correct weekday row (grid is 7 rows, Sun=0..Sat=6).
    const firstDow = new Date(cells[0].date+'T00:00:00.000Z').getUTCDay();
    const pad = Array.from({length:firstDow}, ()=>null);
    const cellsHtml = pad.concat(cells).map(c=>{
      if(!c) return '<div class="heatmap-cell" aria-hidden="true" style="visibility:hidden;"></div>';
      return '<div class="heatmap-cell level-'+c.level+'" role="img" aria-label="'+Utils.fmtDate(c.date)+': '+c.count+' review'+(c.count===1?'':'s')+'"></div>';
    }).join('');
    return '<div class="chart-card"><h3>Consistency</h3><div class="chart-sub">Last '+HEATMAP_DAYS+' days — reviews per day</div>' +
      '<div class="heatmap-scroll"><div class="heatmap-grid">'+cellsHtml+'</div></div>' +
      '<div class="heatmap-legend">Less <div class="heatmap-cell level-0"></div><div class="heatmap-cell level-1"></div><div class="heatmap-cell level-2"></div><div class="heatmap-cell level-3"></div> More</div>' +
      '</div>';
  },

  // "Did mastery stick?" -- hidden entirely if nothing has ever reached 'Achieved' on any
  // dimension (rows.length===0 covers that case directly: with no matured>0 dimension,
  // there's nothing to build a row from), and rows with rate===0 (matured but never
  // lapsed) are omitted too rather than padding the card with "0 of N slipped back" noise.
  renderRetentionGapsCard(){
    const rows = computeLapseRates(Storage.state.words||[])
      .filter(r=>r.matured>0 && r.rate>0)
      .sort((a,b)=>b.rate-a.rate);
    if(rows.length===0) return '';
    return '<div class="chart-card"><h3>Retention Gaps</h3><div class="chart-sub">Dimensions that slipped back after being Achieved</div>' +
      rows.map(r=>'<div class="rg-row"><span class="rg-label">'+Utils.escapeHtml(r.label)+'</span><span class="rg-value">'+r.lapsed+' of '+r.matured+' slipped back — '+Math.round(r.rate*100)+'%</span></div>').join('') +
      '</div>';
  },

  renderCoverageTable(){
    const words = Storage.state.words || [];
    const rows = computeDimensionCoverage(words);
    const sort = this._coverageSort;
    const sorted = rows.slice().sort((a,b)=>{
      let av=a[sort.key], bv=b[sort.key];
      if(typeof av==='string'){ av=av.toLowerCase(); bv=bv.toLowerCase(); }
      const cmp = av<bv ? -1 : av>bv ? 1 : 0;
      return sort.dir==='asc' ? cmp : -cmp;
    });
    const cols = [
      { key:'label', label:'Dimension' },
      { key:'assessed', label:'Words Assessed' },
      { key:'pctAchieved', label:'% Achieved' },
      { key:'pctDeveloping', label:'% Developing' },
      { key:'fails', label:'Fails' }
    ];
    const headerHtml = cols.map(c=>{
      const isSorted = sort.key===c.key;
      return '<th class="'+(isSorted?'sorted '+sort.dir:'')+'" data-sort-key="'+c.key+'">'+c.label+'</th>';
    }).join('') + '<th>Practice</th>';
    const rowsHtml = sorted.map(r=>{
      const disabled = !r.hasFailures;
      return '<tr>' +
        '<td>'+Utils.escapeHtml(r.label)+'</td>' +
        '<td class="num">'+r.assessed+'</td>' +
        '<td class="num">'+r.pctAchieved+'%</td>' +
        '<td class="num">'+r.pctDeveloping+'%</td>' +
        '<td class="num">'+r.fails+'</td>' +
        '<td><button class="btn ghost small practice-cell-btn" data-dim="'+r.key+'"'+
          (disabled ? ' disabled title="No words have failed this dimension yet"' : ' title="Practice words that failed this dimension"') +
          '>Practice</button></td>' +
