      word.levelState.level = Math.max(2, word.levelState.level-1);
      return;
    }
    if(correct){
      const recentAtLevel = word.history.filter(h=>h.phase!=='teaching' && h.level===level).slice(-2);
      if(recentAtLevel.length>=2 && recentAtLevel.every(h=>h.correct) && level===word.levelState.level && word.levelState.level<4){
        word.levelState.level = Math.min(4, word.levelState.level+1);
      }
    }
  },

  applyRating(word, rating){
    const prev = word.srs.interval || 1;
    let interval;
    if(rating==='again'){ interval = 1; word.srs.easeStreak = 0; }
    else if(rating==='hard'){ interval = Utils.clamp(Math.round(prev*0.75)||1, 1, 2); word.srs.easeStreak = 0; }
    else { interval = Utils.clamp(Math.round(prev*1.75), 2, 30); word.srs.easeStreak = (word.srs.easeStreak||0)+1; }

    let nextReview = Utils.addDays(Utils.todayISO(), interval);
    const examDate = Storage.state.settings.examDate;
    if(examDate && examDate >= Utils.todayISO()){
      const stage = this.computeMastery(word);
      if(stage!=='Exam Ready' && nextReview > examDate){
        const daysToExam = Utils.diffDays(Utils.todayISO(), examDate);
        if(daysToExam>0){
          interval = Utils.clamp(Math.min(interval, Math.ceil(daysToExam/2)), 1, 30);
          nextReview = Utils.addDays(Utils.todayISO(), interval);
        }
      }
    }
    word.srs.interval = interval;
    word.srs.nextReview = nextReview;
    word.srs.lastPracticed = Utils.todayISO();
  },

  // Phase 5 micro-fix: easeStreak only advances via the legacy scheduler (WordModel.applyRating),
  // so a word learned mostly through the FSRS tracks (recognition/meaningRecall/production) could
  // never fade its mnemonic. Also fade once any FSRS-tracked dimension reaches the same stability
  // bar already used elsewhere as "well-learned" (PRODUCTION_UNLOCK_STABILITY) -- display-timing
  // only, no scheduling effect.
  mnemonicFaded(word){
    if(!word.mnemonic) return false;
    if((word.srs.easeStreak||0) >= 4) return true;
    const fsrs = word.fsrs || {};
    const dims = (typeof FSRSScheduler!=='undefined' && FSRSScheduler.DIMENSIONS) ? FSRSScheduler.DIMENSIONS : ['recognition','production','meaningRecall'];
    return dims.some(dim => fsrs[dim] && fsrs[dim].stability >= FSRSScheduler.PRODUCTION_UNLOCK_STABILITY);
  },

  computeMastery(word){
    const h = word.history;
    if(!word.teaching || !word.teaching.completed) return 'New';
    if(h.length===0) return 'New';
    const rh = h.filter(a=>a.phase!=='teaching');
    if(rh.length===0) return 'Learning';
    const last5 = rh.slice(-5);
    const last5Rate = last5.filter(a=>a.correct).length/last5.length;
    const hasRecentFail = last5.some(a=>!a.correct);
    const last3 = rh.slice(-3);
    const noRecentErrors = last3.length>=3 && last3.every(a=>a.correct);
    const dims = word.dims || {};
    // success-successAtReset ("successes since the last reset"), not raw success -- an Exam
    // Ready word whose production dims were reset by a real production error (see
    // ErrorIntegration.recordProductionError -> WordModel.resetDim) would otherwise still
    // read as Exam Ready off the pre-reset lifetime count. See resetDim's comment.
    const indepOk = dims.independentProduction && (dims.independentProduction.success-(dims.independentProduction.successAtReset||0))>=2;
    const novelOk = dims.novelApplication && (dims.novelApplication.success-(dims.novelApplication.successAtReset||0))>=1;
    const examReady = !!(indepOk && novelOk && noRecentErrors);
    const strong = last5Rate>=0.8 && !hasRecentFail && word.levelState.level>=3 && word.srs.interval>=10;
    if(examReady){
      const examDate = Storage.state.settings.examDate;
      if(!examDate) return 'Exam Ready';
      const srsOk = word.srs.nextReview && word.srs.nextReview<=examDate;
      // Phase 4: an exam-ready word shouldn't have any FSRS-scheduled dimension
      // (recognition/meaningRecall/production) currently lapsing or due past the
      // exam -- otherwise "Exam Ready" would ignore what FSRS already knows about
      // this word. A dimension that's never been reviewed yet (reps===0) doesn't
      // count against readiness -- "hasn't started" isn't "failing".
      const examEndMs = new Date(examDate+'T23:59:59.999').getTime();
      const fsrsOk = Object.keys(word.fsrs||{}).every(dim=>{
        const card = word.fsrs[dim];
        if(!card || card.reps===0) return true;
        if(card.state===FSRSScheduler.State.Relearning) return false;
        return new Date(card.due).getTime()<=examEndMs;
      });
      return (srsOk && fsrsOk) ? 'Exam Ready' : 'Stable';
    }
    if(strong) return 'Stable';
    if(rh.length<3 || word.levelState.level<=2) return 'Learning';
    if(last5Rate<0.6 || hasRecentFail) return 'Unstable';
    return 'Learning';
  },

  // Phase C: shared by Teaching.finishWord and Practice.handleGraded's success path so
  // "firstMasteryAt gets set" and "a milestone gets appended" always happen together,
  // regardless of which code path is the one that actually observes the word crossing
  // into Stable/Exam Ready for the first time -- calls computeMastery (read-only), never
  // recomputes mastery itself. Set-once: does nothing once firstMasteryAt is already set,
  // so a word that later wobbles back down to Unstable and returns to Stable keeps its
  // original date.
  checkFirstMastery(word){
    if(word.firstMasteryAt) return;
    const stage = this.computeMastery(word);
    if(stage!=='Stable' && stage!=='Exam Ready') return;
    word.firstMasteryAt = Date.now();
    Milestones.append('first_mastery', { wordId: word.id, detail: stage });
  },

  isOverdue(word){ return word.history.length>0 && word.srs.nextReview < Utils.todayISO(); },
  isDueToday(word){ return word.history.length>0 && word.srs.nextReview === Utils.todayISO(); },
  hasRetrievalHistory(word){ return word.history.some(h=>h.phase!=='teaching'); },

  findByText(text){
    const norm = Utils.normalize(text);
    if(!norm) return null;
    return Storage.state.words.find(w=>Utils.normalize(w.word)===norm) || null;
  },

  hasRecentError(word, days){
    days = days==null ? 7 : days;
    // typeof e.date==='string' guards Utils.diffDays, which calls .split('-') on both
    // arguments -- validateAndRepair now filters out dateless errorLog entries too, but this
    // stays defensive against any entry pushed straight onto Storage.state.errorLog in memory.
    return Storage.state.errorLog.some(e=>e.wordId===word.id && typeof e.date==='string' && Utils.diffDays(e.date, Utils.todayISO())<=days);
  },

  resetDim(word, dimKey){
    if(!word.dims || !word.dims[dimKey]) return;
    // Phase E: everAchievedAt is a historical "ever" marker (like word.firstMasteryAt),
    // not a mirror of current status -- preserved across a reset. Without this, a word
    // whose independentProduction/novelApplication gets reset by
    // ErrorIntegration.recordProductionError after a production error would silently drop
    // out of the Retention Gaps lapse-rate denominator (matured), even though "achieved,
    // then reset by a real error" is exactly the lapse this metric exists to surface.
    // success/fail are preserved for the same reason -- they're displayed as lifetime
    // tallies (the coverage table's Fails column, and hasFailures gating the Practice
    // button), not a mirror of current status, so zeroing them here would silently change
    // what those displayed numbers mean.
    // successAtReset snapshots the lifetime success count as of this reset, so readers that
    // need "successes since the last reset" (DimModel.record's Achieved threshold,
    // computeMastery's Exam Ready gate, Exam.computeTargetPool's eligibility check) can
    // compare (success - successAtReset) instead of the raw lifetime total -- otherwise a
    // dim with 2+ lifetime successes re-achieves after a single post-reset success, and an
    // Exam Ready word whose production dims were just reset by a real error stays Exam
    // Ready. freshDims/repairDims default this to 0, so a dim that's never been reset has
    // success - 0 === success and every one of those readers behaves exactly as before.
    const { everAchievedAt, success, fail } = word.dims[dimKey];
    word.dims[dimKey] = { status:'Not assessed', success: success||0, fail: fail||0, everAchievedAt: everAchievedAt||null, successAtReset: success||0 };
  }
};

/* ============================== WRITING ERROR INTEGRATION ==============================
   Shared bridge used by the Weekly Writing Audit and Timed Exam Deployment modules so
   they reuse the same error-diagnosis system / mastery dimensions as the Teaching Phase
   and Practice Engine, rather than keeping a separate error model. */
const ErrorIntegration = {
  /* Records a production-context vocabulary error found outside normal practice
     (a writing audit tag, or an exam "used incorrectly" mark), and schedules the
     word for targeted retrieval by resetting its production dimensions and pulling
     it into today's due queue. */
  recordProductionError(word, category, source){
    WordModel.logError(word, category, 4);
    // attempts[]-only normalization: history keeps whatever source string the caller passed
    // (e.g. 'audit-review'), but attempts[] collapses every non-exam source into 'writing' and
    // is explicitly track:null -- this track never runs through a practice track ('legacy'/'fsrs').
    WordModel.logAttempt(word, 4, false, { phase: source||'writing', errorCategory: category,
      attemptsPhase: source==='timed-exam' ? 'timed-exam' : 'writing', track: null });
    WordModel.resetDim(word, 'independentProduction');
    WordModel.resetDim(word, 'novelApplication');
    word.srs.interval = 1;
    word.srs.nextReview = Utils.todayISO();
    word.levelState.level = Utils.clamp(word.levelState.level, 2, 3);
    // Phase C: this is a graded attempt too (level 4, phase 'writing'/'exam', never
    // 'teaching'), just one that doesn't go through Practice.handleGraded -- bump the
    // same `reviews` bucket it would otherwise land in, on the caller's behalf.
    DailyActivity.bump(Utils.todayISO(), { reviews: 1 });
    Achievements.evaluate(Analytics.buildAchievementContext());
    App.updateDueBadge(); // word.srs.nextReview was just moved to today, above
  },
  /* Records a confirmed-correct production-context usage (exam "used correctly"). */
  recordProductionSuccess(word, source){
    WordModel.logAttempt(word, 4, true, { phase: source||'writing',
      attemptsPhase: source==='timed-exam' ? 'timed-exam' : 'writing', track: null });
    WordModel.updateLadder(word, 4, true);
    WordModel.applyRating(word, 'easy');
    DimModel.record(word, 'independentProduction', true);
    DimModel.record(word, 'novelApplication', true);
    WordModel.checkFirstMastery(word);
    DailyActivity.bump(Utils.todayISO(), { reviews: 1, correct: 1 });
    Achievements.evaluate(Analytics.buildAchievementContext());
    App.updateDueBadge();
  }
};

/* ============================== PRACTICE ENGINE ============================== */
const DRILL_TYPES = ['combo','confusable','rewrite'];

const Practice = {
  session: null, // {queue:[{word,level,drillType}], idx, results:[], hintUsed, mode, phase}

  buildDueQueue(opts){
    opts = opts || {};
    const words = Storage.state.words;
    let pool = words.filter(w=>w.teaching && w.teaching.completed);

    // Category-specific drilling (e.g. "practice my Collocation errors") selects directly
    // from the category pool rather than being intersected with the due/overdue/dueToday
    // buckets below -- a word with a logged error but a nextReview 20 days out is still a
    // valid target for category practice. Intersecting with SRS due-state used to silently
    // produce an empty queue (and a "Nothing to practice right now" toast) for exactly that
    // word. Legacy-only, same as before: FSRS-scheduled recognition isn't tied to an error
    // category today.
    if(opts.category){
      const categoryPool = pool.filter(w => (w.errorCounts[opts.category]||0) > 0);
      return Utils.shuffle(categoryPool).map(w=>({ track:'legacy', word:w, level: Math.max(2, w.levelState.level-1) }));
    }

    // Group by SRS priority (overdue first, then recently-failed, then due-today), but
    // shuffle within each group so the word order isn't the same every session — only
    // the exact due date should break ties, not each word's position in the word list.
    const overdue = Utils.shuffle(pool.filter(w=>WordModel.isOverdue(w))).sort((a,b)=>a.srs.nextReview.localeCompare(b.srs.nextReview));
    const failedRecent = Utils.shuffle(pool.filter(w=>{
      // Matches updateLadder/computeMastery: teaching-phase entries aren't retrieval
      // attempts, so a word whose final teaching step was wrong shouldn't be classified as
      // "recently failed" off that entry.
      const retrieval = w.history.filter(h=>h.phase!=='teaching');
      const last = retrieval[retrieval.length-1];
      return last && !last.correct && typeof last.date==='string' && Utils.diffDays(last.date, Utils.todayISO())<=1 && !overdue.includes(w);
    }));
    const dueToday = Utils.shuffle(pool.filter(w=>WordModel.isDueToday(w) && !overdue.includes(w) && !failedRecent.includes(w)));
    let queue = overdue.concat(failedRecent, dueToday);
    if(opts.includeNew){
      const newWords = Utils.shuffle(pool.filter(w=>!WordModel.hasRetrievalHistory(w)));
      queue = queue.concat(newWords.slice(0, opts.newLimit==null?newWords.length:opts.newLimit));
    }
    // dedupe
    const seen = new Set();
    queue = queue.filter(w=>{ if(seen.has(w.id)) return false; seen.add(w.id); return true; });
    const legacyItems = queue.map(w=>({ track:'legacy', word:w, level: w.levelState.level }));

    // Recognition, meaningRecall (cued recall), and production are each scheduled
    // independently by FSRS now (their own due dates, not gated by word.levelState.level),
    // so they're selected separately here and merged in — everything else above is exactly
    // the pre-FSRS logic, untouched. meaningRecall is ungated, same as recognition: cued
    // recall has no real prerequisite in this app today (every word starts at legacy ladder
    // level 2, the cued-recall level, and never falls below it), unlike production, which
    // is gated because it's genuinely downstream of climbing the ladder. Production's gate
    // is an engineering sequencing policy, not a validated learning principle, recomputed
    // live (not a persisted "unlocked" flag).
    const now = new Date();
    const recognitionItems = DueQueue.buildDimensionItems(pool, 'recognition', now);
    const meaningRecallItems = DueQueue.buildDimensionItems(pool, 'meaningRecall', now);
    const productionItems = DueQueue.buildDimensionItems(pool, 'production', now,
      w => w.fsrs.recognition.stability >= FSRSScheduler.PRODUCTION_UNLOCK_STABILITY);
    const fsrsItems = DueQueue.mergeQueues(DueQueue.mergeQueues(recognitionItems, meaningRecallItems), productionItems);
    return DueQueue.mergeQueues(fsrsItems, legacyItems);
  },

  buildProductionQueue(limit){
    const today = Utils.todayISO();
    const eligible = Storage.state.words.filter(w=>w.teaching && w.teaching.completed && w.history.length>0 &&
      !w.history.some(h=>h.date===today && h.level===4));
    const shuffled = Utils.shuffle(eligible);
    return shuffled.slice(0, limit||8).map(w=>({ word:w, level:4, drillType: Utils.pick(DRILL_TYPES) }));
  },

  generateQuestion(item){
    if(item.track==='fsrs'){
      // Reuses the existing per-dimension question generators/UI unchanged — only what
      // happens after grading (see handleGraded) differs for an FSRS-track item.
      const q = item.dimension==='production' ? this.genProduction(item.word) :
        item.dimension==='meaningRecall' ? this.genCuedRecall(item.word) :
        this.genRecognition(item.word);
      q.track = 'fsrs';
      q.dimension = item.dimension;
      return q;
    }
    const word = item.word;
    const level = item.level;
    const q = item.drillType ? this.generateDrill(item) :
      level<=1 ? this.genRecognition(word) :
      level===2 ? this.genCuedRecall(word) :
      level===3 ? this.genCloze(word) :
      this.genProduction(word);
    // Explicit, not left to callers' || 'legacy' fallbacks (Views.handleGraded/offerHint
    // already have one, but a future call site that reads q.track directly and forgets it
    // would silently mislabel attempts[].track) -- every question this generates outside the
    // fsrs branch above is legacy-track by construction.
    q.track = 'legacy';
    // Propagated the same way the fsrs branch above propagates it -- only runDimensionPractice
    // sets item.dimension on a legacy item today (to name which dim it wants credited, since
    // the level->type dispatch above is many-to-one); the normal ladder/category items never
    // set it, so this is a no-op for them.
    if(item.dimension) q.dimension = item.dimension;
    return q;
  },

  // Grades one FSRS-scheduled dimension for a word. Updates only word.fsrs[dimension] --
  // never word.srs or word.levelState, which the legacy dimensions still own exclusively.
  // ts (optional): shared event timestamp threaded in from Views.handleGraded so this
  // review's fsrsReviewLog entry lines up exactly with the same event's history/attempts[]
  // entries (attempts[].ts === fsrsReviewLog[].ts for FSRS-track events). Defaults to
  // Date.now() for any other caller that doesn't pass one.
  gradeFsrs(word, dimension, ratingKey, ts){
    ts = typeof ts==='number' ? ts : Date.now();
    const settings = Storage.state.settings.fsrs;
    const before = word.fsrs[dimension];
    const result = FSRSScheduler.grade(before, ratingKey, {
      now: new Date(ts),
      desiredRetention: settings.desiredRetention,
      maxIntervalDays: settings.maxIntervalDays || undefined,
      params: settings.params || undefined
    });
    // Write this review's result first. The "already Exam Ready?" gate below reads
    // word.fsrs[dimension] via computeMastery -- it must see the fresh grade (this
    // review may itself be what makes the word ready), not the pre-review card.
    word.fsrs[dimension] = result.card;

    const logEntry = {
      ts, wordId: word.id, dimension, rating: ratingKey,
      predictedR: result.predictedR, outcome: ratingKey!=='again',
      desiredRetentionAtSchedule: settings.desiredRetention,
      stabilityBefore: before.stability, stabilityAfter: result.card.stability,
      difficultyBefore: before.difficulty, difficultyAfter: result.card.difficulty,
      elapsedDays: result.card.elapsed_days, scheduledDays: result.card.scheduled_days
    };
    // Debug breadcrumb for the production promotion policy: what recognition's stability
    // was at the moment production got its first-ever review. Not used by any analysis
    // this app builds — just inspectable if the unlock threshold ever needs revisiting.
    if(dimension==='production' && before.state===0){
      logEntry.recognitionStabilityAtUnlock = word.fsrs.recognition.stability;
    }

    // Phase 4: exam-date compression. Gated on the word's mastery AFTER this review's
    // grade has been written (see comment above) -- computeMastery reads word.fsrs.*
    // as part of its Exam Ready check (Phase 4), so it must see this review's outcome,
    // not stale pre-grade state. No-op entirely when no exam date is set, same as the
    // legacy compression in WordModel.applyRating.
    const examDate = Storage.state.settings.examDate;
    if(examDate && examDate >= Utils.todayISO() && WordModel.computeMastery(word)!=='Exam Ready'){
      const compressed = FSRSScheduler.compressForExam(word.fsrs[dimension], examDate, new Date());
      if(compressed){
        logEntry.examCompressed = true;
        logEntry.naturalDue = word.fsrs[dimension].due;
        logEntry.naturalScheduledDays = word.fsrs[dimension].scheduled_days;
        word.fsrs[dimension] = compressed;
        logEntry.scheduledDays = compressed.scheduled_days;
      }
    }

    Storage.state.fsrsReviewLog.push(logEntry);
    if(Storage.state.fsrsReviewLog.length>FSRS_REVIEW_LOG_CAP){
      Storage.state.fsrsReviewLog = Storage.state.fsrsReviewLog.slice(-FSRS_REVIEW_LOG_CAP);
    }
  },

  genRecognition(word){
    const others = Storage.state.words.filter(w=>w.id!==word.id && w.meaning);
    const distractors = Utils.shuffle(others).slice(0,3).map(w=>w.meaning);
    const options = Utils.shuffle([word.meaning, ...distractors]);
    return { type:'recognition', word, level:1, promptTitle:'Warm-up: choose the meaning', prompt: word.word,
      options, correctAnswer: word.meaning, autoGrade:true };
  },

  genCuedRecall(word){
    const meaning = (word.meaning||'').trim();
    const contexts = (word.contexts||[]).map(c=>(c||'').trim()).filter(Boolean);
    const collocations = (word.collocations||[]).map(c=>(c||'').trim()).filter(Boolean);

    const variants = [];
    if(meaning) variants.push('Meaning: ' + meaning);
    if(contexts.length) variants.push('Context: ' + WordModel.maskWord(Utils.pick(contexts), word.word) + (meaning ? '  (Meaning: ' + meaning + ')' : ''));
    if(collocations.length && meaning){
      const masked = WordModel.maskWord(Utils.pick(collocations), word.word);
      variants.push('It often appears with "' + masked + '". Meaning: ' + meaning);
    }

    const cue = variants.length ? Utils.pick(variants) : 'No stored definition or context for this word yet — type the word from memory.';
    return { type:'cued', word, level:2, promptTitle:'Type the word', prompt: cue, correctAnswer: word.word, autoGrade:true };
  },

  genCloze(word){
    const c = WordModel.getClozeSentence(word);
    // getClozeSentence mutates word.lastClozeIndex (even on the null branch below) but doesn't
    // persist it -- flush now so a refresh before this question is answered/graded doesn't
    // lose the rotation and hand back a repeat sentence next time.
    Storage.save();
    if(!c){
      // No usable cloze sentence (empty cloze array, unblankable production sentence, no ___
      // placeholder). Falling through to genCuedRecall used to silently record this level-3
      // "contextual comprehension" ladder rung as meaningRecall/formRecall instead -- exactly
      // the dimension the ladder was trying to train. Keep type:'cloze' (self-graded, since
      // there's no sentence to auto-blank) so recordDimForQuestion still attributes the
      // attempt to contextualComprehension.
      const meaning = (word.meaning||'').trim();
      return { type:'cloze', word, level:3, promptTitle:'Use it in context', prompt: 'Recall or invent a sentence using "'+word.word+'" in context.' + (meaning ? '  (Meaning: ' + meaning + ')' : ''), autoGrade:false };
    }
    return { type:'cloze', word, level:3, promptTitle:'Fill in the blank', prompt: c.display, correctAnswer: c.answer, autoGrade:true };
  },

  genProduction(word){
    const meaning = (word.meaning||'').trim();
    const contexts = (word.contexts||[]).map(c=>(c||'').trim()).filter(Boolean);
    const collocations = (word.collocations||[]).map(c=>(c||'').trim()).filter(Boolean);
    const topic = WordModel.maskWord(contexts.length ? Utils.pick(contexts) : meaning, word.word);

    const twists = [
      'Write an original sentence using the target word.',
      'Write it as a question.',
      'Use a more formal register than usual.',
      'Use it in a casual, spoken-style sentence.'
    ];
    if(collocations.length){
      const maskedColloc = WordModel.maskWord(Utils.pick(collocations), word.word);
      twists.push('Try to naturally work in the pattern "'+maskedColloc+'".');
    }
    const twist = Utils.pick(twists);
    return { type:'production', word, level:4, promptTitle:'Free production', prompt: 'Situation: ' + topic,
      sub: twist, meaningHint: meaning, autoGrade:false };
  },

  generateDrill(item){
    const word = item.word;
    const type = item.drillType;
    const meaningHint = (word.meaning||'').trim();
    if(type==='combo'){
      const others = Storage.state.words.filter(w=>w.id!==word.id && w.history.length>0);
      const partner = others.length ? Utils.pick(others) : null;
      if(!partner) return this.genProduction(word);
      return { type:'drill', drillType:'combo', word, partner, level:4, promptTitle:'Combine two words',
        prompt: 'Write ONE natural sentence using both the target word and "'+partner.word+'".', meaningHint, autoGrade:false };
    }
    if(type==='confusable' && word.contrast){
      return { type:'drill', drillType:'confusable', word, level:4, promptTitle:'Distinguish confusables',
        prompt: 'Contrast: ' + WordModel.maskWord(word.contrast, word.word), sub: 'Write one or two sentences that clearly show the difference, using the target word.', meaningHint, autoGrade:false };
    }
    if(type==='rewrite' && word.production){
      const original = WordModel.maskWord(word.production, word.word);
      return { type:'drill', drillType:'rewrite', word, level:4, promptTitle:'Rewrite in a new register',
        prompt: 'Original: "' + original + '"', sub:'Rewrite the same idea using the target word in a different register or context.', meaningHint, autoGrade:false };
    }
    return this.genProduction(word);
  },

  grade(question, userInput){
    if(!question.autoGrade) return null;
    if(question.type==='recognition') return userInput === question.correctAnswer;
    const norm = Utils.normalize(userInput);
    const target = Utils.normalize(question.correctAnswer);
    if(norm===target) return true;
    return false;
  },

  /* View-only navigation to a previously graded card. Never mutates SRS state —
     it only points the renderer at the already-graded result for idx-1 and
     remembers where to snap back to. Refuses to move if the previous slot has no
     graded result yet (an ungraded card can never be reached this way). */
  canGoBack(){
    const s = this.session;
    if(!s || s.idx<=0) return false;
    return s.results.some(r=>r.idx===s.idx-1);
  },
  goBack(){
    const s = this.session;
    if(!this.canGoBack()) return;
    s.savedIdx = s.idx;
    s.idx = s.idx-1;
    s.reviewing = true;
  },
  returnToCurrent(){
    const s = this.session;
    if(!s || !s.reviewing) return;
    s.idx = s.savedIdx!=null ? s.savedIdx : s.idx+1;
    s.reviewing = false;
    s.savedIdx = null;
  },

  /* ---- Session persistence (survive a page refresh mid-practice) ----
     Practice.session holds live word object references, which can't go through
     JSON.stringify as-is (circular-ish, and would duplicate the whole word into
     Storage). persist() swaps those for word ids before saving into
     Storage.state.practiceSession; restore() looks the ids back up against the
     current word list on load. If a referenced word was deleted in the meantime
     it's silently dropped from the resumed queue rather than crashing. */
  serializeQuestion(q){
    if(!q) return null;
    const copy = Object.assign({}, q);
    copy.wordId = copy.word ? copy.word.id : null; delete copy.word;
    if(copy.partner){ copy.partnerId = copy.partner.id; delete copy.partner; }
    return copy;
  },
  deserializeQuestion(sq){
    if(!sq) return null;
    const copy = Object.assign({}, sq);
    copy.word = Storage.state.words.find(w=>w.id===copy.wordId) || null;
    delete copy.wordId;
    if(copy.partnerId){ copy.partner = Storage.state.words.find(w=>w.id===copy.partnerId) || null; delete copy.partnerId; }
    return copy.word ? copy : null;
  },
  persist(){
    if(!this.session){ this.clearPersisted(); return; }
    const s = this.session;
    Storage.state.practiceSession = {
      mode: s.mode,
      idx: s.idx,
      reviewing: !!s.reviewing,
      savedIdx: s.savedIdx==null ? null : s.savedIdx,
      // track/dimension identify an FSRS-track item (see generateQuestion's item.track==='fsrs'
      // branch) -- dropping them here used to regenerate every remaining FSRS item as a legacy
      // ladder question after a mid-session refresh: word.fsrs[dimension] never got updated, no
      // fsrsReviewLog row was written, and attempts[].track came out 'legacy' for what was
      // actually a recognition/meaningRecall/production review.
      queue: s.queue.map(item=>({ wordId: item.word.id, level: item.level, drillType: item.drillType||null, track: item.track||null, dimension: item.dimension||null })),
      results: s.results.map(r=>({
        idx: r.idx, wordId: r.word.id, userVal: r.userVal, correct: r.correct,
        rating: r.rating||null, category: r.category||null, question: this.serializeQuestion(r.question)
      }))
      // Session (Daily Session phase nav) state used to be piggybacked here, but that meant
      // every phase boundary (which nulls Practice.session/practiceSession via #doneBtn ->
      // clearPersisted) lost it too -- Session now carries its own durable record, see
      // Session.persist/restore/clearPersisted and Storage.state.sessionState.
    };
    Storage.save();
  },
  clearPersisted(){
    if(Storage.state.practiceSession){ Storage.state.practiceSession = null; Storage.save(); }
  },
  restore(){
    const saved = Storage.state.practiceSession;
    if(!saved) return;

    // old -> new position map. A queue item whose word no longer resolves is dropped (word
    // deleted since the save); every surviving item's ORIGINAL index maps to its NEW index.
    // results[].idx and session.idx are both positions in the ORIGINAL queue, so both must
    // go through this map.
    const originalToNew = {};
    let newI = 0;
    const queue = saved.queue.map((item, i)=>{
      // Shape-gate before touching item.wordId -- a null/malformed element (hand-edited or
      // corrupted save) would otherwise crash here before ever reaching .filter(Boolean).
      if(!item || typeof item.wordId!=='string' || typeof item.level!=='number') return null;
      // dimension must be one of the three strings DueQueue.buildDimensionItems produces (or
      // absent, for a legacy-track item) -- an invalid value here restores fine but crashes
      // later inside FSRSScheduler.grade() on word.fsrs[dimension]. An fsrs-track item with no
      // dimension at all can't be graded either, so it's rejected the same way.
      const validDim = item.dimension==null || ['recognition','meaningRecall','production'].includes(item.dimension);
      if(!validDim) return null;
      if(item.track==='fsrs' && !item.dimension) return null;
      const word = Storage.state.words.find(w=>w.id===item.wordId);
      if(!word) return null;
      originalToNew[i] = newI++;
      return { word, level: item.level, drillType: item.drillType||undefined, track: item.track||undefined, dimension: item.dimension||undefined };
    }).filter(Boolean);

    if(!queue.length){ this.clearPersisted(); return; }

    // saved.results||[] only falls back for a falsy value -- a truthy non-array (an object,
    // string, or number surviving a hand-edited/corrupted or imported save) would reach
    // .map() and throw, since validateAndRepair's practiceSession gate only shape-checks
    // .queue, not .results, before accepting the object wholesale.
    const results = Array.isArray(saved.results) ? saved.results.map(r=>{
      // Same shape-gate as the queue map above -- a null/malformed result element would
      // otherwise crash on r.wordId before the existing .filter(Boolean) chain can drop it.
      if(!r || typeof r.wordId!=='string') return null;
      const word = Storage.state.words.find(w=>w.id===r.wordId);
      if(!word) return null;
      const question = this.deserializeQuestion(r.question);
      if(!question) return null; // dropped rather than left null -- renderPracticeReviewCard reads result.question directly
      // r.idx is an ORIGINAL queue position. Remap it. If that position no longer survives in
      // the new queue (its item was dropped), drop this result too: renderPracticeReviewCard's
      // find(r=>r.idx===s.idx) would otherwise match it at a position it no longer belongs to.
      if(originalToNew[r.idx]===undefined) return null;
      return { idx:originalToNew[r.idx], word, question, userVal:r.userVal, correct:r.correct, rating:r.rating, category:r.category };
    }).filter(Boolean) : [];

    // Resume position: find the NEW index of the ORIGINAL item at saved.idx, or (if that item
    // was itself dropped) the next surviving original index at or after saved.idx. Walk forward
    // from saved.idx to find it.
    let resumeIdx = queue.length;
    for(let i = saved.idx; i < saved.queue.length; i++){
      if(originalToNew[i] !== undefined){ resumeIdx = originalToNew[i]; break; }
    }

    // savedIdx (the "Back" return point) is the same kind of ORIGINAL queue position as
    // saved.idx and results[].idx, so it needs the same remap -- mirrors the block in
    // Views._pruneDeletedWord, including the fallback: walk forward to the next surviving
    // original index, and if there is none, park at queue.length with reviewing off (that
    // pairing is what stops returnToCurrent from consuming the sentinel).
    let restoredSavedIdx = saved.savedIdx;
    let restoredReviewing = !!saved.reviewing;
    if(restoredSavedIdx!=null){
      if(originalToNew[restoredSavedIdx]!==undefined){
        restoredSavedIdx = originalToNew[restoredSavedIdx];
      } else {
        let newSavedIdx = null;
        for(let i = restoredSavedIdx; i < saved.queue.length; i++){
          if(originalToNew[i]!==undefined){ newSavedIdx = originalToNew[i]; break; }
        }
        if(newSavedIdx!==null){ restoredSavedIdx = newSavedIdx; }
        else { restoredSavedIdx = queue.length; restoredReviewing = false; }
      }
    }

    this.session = {
      queue, results, mode: saved.mode,
      idx: Utils.clamp(resumeIdx, 0, queue.length),
      reviewing: restoredReviewing,
      savedIdx: restoredSavedIdx
    };
  }
};

/* ============================== APP STATE / ROUTER ============================== */
const App = {
  currentTab: 'dashboard',
  practiceState: null,

  init(){
    Storage.load();
    this.applyTheme();
    Practice.restore();
    Session.restore();
    Exam.restore();
    document.getElementById('tabs').addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-tab]');
      if(btn) this.showTab(btn.dataset.tab);
    });
    document.getElementById('app').addEventListener('click', (e)=>{
      const btn = e.target.closest('.speak-btn');
      if(btn) Speech.speak(btn.dataset.word);
    });
    // Force-flush the exam's debounced persist() on the two moments a page can disappear
    // without warning -- a backgrounded/closed tab (visibilitychange) and an actual unload
    // (beforeunload) -- so an in-progress exam never loses more than the last keystroke
    // instead of up to persist()'s 500ms debounce window. Covers every status that debounces
    // through persist() at meaningfully-frequent input -- 'config' (prompt/custom-minutes
    // edits, Reshuffle Words), 'running' (the essay textarea), and 'review' (the
    // checklist/category buttons in drawReview); 'done' and any other status have already been
    // flushed synchronously at their own transitions.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='hidden' && (Exam.status==='config' || Exam.status==='running' || Exam.status==='review')) Exam._flushPersist();
    });
    window.addEventListener('beforeunload', ()=>{
      if(Exam.status==='config' || Exam.status==='running' || Exam.status==='review') Exam._flushPersist();
    });
    // Session.active can be true with Practice.session null (an interstitial screen, not a
    // graded queue) -- route to the practice tab for that case too, same condition showTab's
    // own tab==='practice' branch uses to choose between the phase screen and Practice Home.
    this.showTab((Practice.session || Session.active) ? 'practice' : 'dashboard');
  },

  updateDueBadge(){
    const el = document.getElementById('dueBadge');
    if(!el) return;
    // Same selection Phase 1 (Session.renderPhase) and "Quick Review" (Views.runFreePractice)
    // actually queue, not WordModel.isOverdue/isDueToday -- those only read word.srs.nextReview
    // (the legacy scheduler), while FSRS-scheduled dimensions are due via word.fsrs[d].due and
    // never touch word.srs.nextReview at all. A user whose words were mostly FSRS-tracked could
    // see "0 words due today" here while a Daily Session opened to "Item 5 of 70." Calling
    // buildDueQueue directly means this count and the queue it describes can never disagree.
    // "review(s)", not "word(s)" -- the count is now items, and a word due in two dimensions
    // (e.g. recognition and production) contributes two.
    const total = Practice.buildDueQueue({includeNew:false}).length;
    el.textContent = total + (total===1 ? ' review due today' : ' reviews due today');
  },

  applyTheme(){
    const t = Storage.state.settings.theme;
    if(t==='system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  },

  showTab(tab){
    // Covers leaving the Phase 2 Add flow via a tab-nav click instead of Session's own
    // _backToSession (e.g. the top tab bar, or any App.showTab(...) call fired while
    // Session's monkey-patch is live) -- see Session._unpatch's comment for the other call
    // sites (Session._backToSession, Session.finish). No-op when nothing is patched.
    Session._unpatch();
    this.currentTab = tab;
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+tab).classList.add('active');
    this.updateDueBadge();
    if(tab==='dashboard') Views.renderDashboard();
    // A Daily Session interstitial (between graded phases) has Session.active true with
    // Practice.session null -- Views.renderPracticeHome's own Practice.session check can't
    // route to it, so it would otherwise show Practice Home instead of the phase screen.
    else if(tab==='practice'){ (Session.active && !Practice.session) ? Session.renderPhase() : Views.renderPracticeHome(); }
    else if(tab==='add') Views.renderAddForm();
    else if(tab==='bank') Views.renderBank();
    else if(tab==='errors') Views.renderErrors();
    else if(tab==='writing') Views.renderWriting();
    else if(tab==='analytics') Analytics.render();
    else if(tab==='settings') Views.renderSettings();
  }
};

/* ============================== VIEWS ============================== */
const Views = {

  /* ---------- DASHBOARD ---------- */
  renderDashboard(){
    const words = Storage.state.words;
    const el = document.getElementById('view-dashboard');
    if(words.length===0){
      el.innerHTML = '<div class="card empty-state"><div class="big">📚</div><h2>No words yet</h2>' +
        '<p>Add your first word to start building real, production-level vocabulary knowledge.</p>' +
        '<button class="btn primary" id="goAddBtn">Add a Word</button></div>';
      el.querySelector('#goAddBtn').addEventListener('click', ()=>App.showTab('add'));
      return;
    }
    const overdue = words.filter(w=>WordModel.isOverdue(w));
    const dueToday = words.filter(w=>WordModel.isDueToday(w));
    const awaitingTeaching = words.filter(w=>!w.teaching || !w.teaching.completed);
    const stages = { New:0, Learning:0, Unstable:0, Stable:0, 'Exam Ready':0 };
    words.forEach(w=> stages[WordModel.computeMastery(w)]++ );
    const recentlyFailed = words.filter(w=>{
      // Matches updateLadder/computeMastery/buildDueQueue's failedRecent: teaching-phase
      // entries aren't retrieval attempts, so a word whose final teaching step was wrong
      // shouldn't be classified as "recently failed" off that entry.
      const retrieval = w.history.filter(h=>h.phase!=='teaching');
      const last = retrieval[retrieval.length-1];
      return last && !last.correct && typeof last.date==='string' && Utils.diffDays(last.date, Utils.todayISO())<=1;
    });
    const catTotals = {};
    ERROR_CATEGORIES.forEach(c=>catTotals[c]=0);
    Storage.state.errorLog.forEach(e=>{ if(catTotals[e.category]!=null) catTotals[e.category]++; });
    const weakest = Object.entries(catTotals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const levelDist = {1:0,2:0,3:0,4:0};
    words.forEach(w=> levelDist[w.levelState.level]++ );
    const examDate = Storage.state.settings.examDate;

    let html = '';
    if(overdue.length>15){
      html += '<div class="banner warn">⚠️ Reduce new-word intake until the review queue is clear. You have ' + overdue.length + ' overdue words.</div>';
    }
    if(examDate){
      const days = Utils.diffDays(Utils.todayISO(), examDate);
      html += '<div class="banner ' + (days<=3?'bad':'info') + '">🎯 Exam in ' + (days<0?'the past':days+' day'+(days===1?'':'s')) + ' (' + Utils.fmtDate(examDate) + ') — ' + stages['Exam Ready'] + ' word(s) exam-ready.</div>';
    }

    // Same selection Phase 1 / Quick Review actually queue -- see App.updateDueBadge's
    // comment. overdue/dueToday (isOverdue/isDueToday, legacy-scheduler only) stay as they
    // are for the Today grid's Overdue/Due Today stats below; those are explicitly
    // legacy-scheduler numbers and still correct as such. This hero card is describing "how
    // big is the session you're about to start," which is the queue, not the legacy subset
    // of it.
    const dueTotal = Practice.buildDueQueue({includeNew:false}).length;
    // ~30s/item, floored at 2 minutes -- the old static "10-15 minutes" was written for a
    // bounded legacy-only queue and reads as a lie once an FSRS-heavy word bank pushes the
    // queue into the dozens or more.
    const estMinutes = dueTotal ? Math.max(2, Math.round(dueTotal*30/60)) : 0;
    html += '<div class="card hero-card"><h2 class="mt0">'+(dueTotal ? dueTotal+' review'+(dueTotal===1?'':'s')+' ready' : 'You\'re caught up')+'</h2>' +
      '<p class="field-hint" style="margin:-6px 0 14px;">'+(dueTotal ? 'A focused session takes about ~'+estMinutes+' minute'+(estMinutes===1?'':'s')+'.' : 'Nothing due right now — add a word or get ahead on upcoming reviews.')+'</p>' +
      '<div class="btn-row">' +
      '<button class="btn primary" id="startDailyBtn">▶ Start Daily Session</button>' +
      '<button class="btn ghost" id="quickDueBtn">Quick Review (Due Only)</button>' +

    html += '<div class="card"><h2>Today</h2><div class="grid">' +
      stat(overdue.length, 'Overdue', overdue.length>0?'bad':'') +
      stat(dueToday.length, 'Due Today', '') +
      stat(awaitingTeaching.length, 'Awaiting Teaching', awaitingTeaching.length>0?'warn':'') +
      stat(recentlyFailed.length, 'Recently Failed', recentlyFailed.length>0?'warn':'') +
      '</div></div>';

    if(awaitingTeaching.length){
      html += '<div class="banner info">📖 '+awaitingTeaching.length+' word(s) are saved but have not been taught yet — they will not appear in retrieval practice until the Teaching Phase is complete. <button class="small-link" id="teachNowBtn" style="margin-left:6px;">Teach now →</button></div>';
    }

    html += '<div class="card"><h2>Mastery Stages</h2><div class="grid">' +
      Object.entries(stages).map(([k,v])=>'<div class="stat"><div class="num">'+v+'</div><div class="label">'+k+'</div></div>').join('') +
      '</div></div>';

    html += '<div class="card"><h2>Retrieval-Level Progress</h2>' +
      [1,2,3,4].map(l=>{
        const label = ['','Recognition','Cued Recall','Cloze','Free Production'][l];
        const pct = words.length ? Math.round(levelDist[l]/words.length*100) : 0;
        return '<div class="bar-row"><div style="width:120px;color:var(--text-dim)">'+label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div style="width:34px;text-align:right">'+levelDist[l]+'</div></div>';

    if(taughtWords.length){
      html += '<div class="card"><h2>Skill Dimension Coverage</h2><p class="field-hint">Across '+taughtWords.length+' taught word(s) — recognition alone is never counted as mastery.</p><div class="dim-grid">' +
        DIMENSIONS.map(d=>{
          const counts = {Achieved:0, Developing:0, 'Not assessed':0};
          taughtWords.forEach(w=>{ const st = w.dims && w.dims[d.key] ? w.dims[d.key].status : 'Not assessed'; counts[st]++; });
          const total = taughtWords.length;
          const pct = s => total ? Math.round(counts[s]/total*100) : 0;
          return '<div class="dim-item"><div class="name">'+d.label+'</div>' +
            '<div class="track">' +

            '<div class="seg" style="width:'+pct('Developing')+'%;background:var(--warn);"></div>' +

    }

    if(weakest.length){
      html += '<div class="card"><h2>Weakest Error Categories</h2>' +
        weakest.map(([c,v])=>'<div class="bar-row"><div style="width:120px">'+c+'</div><div class="bar-track"><div class="bar-fill" style="background:var(--bad);width:'+Math.min(100,v*8)+'%"></div></div><div style="width:34px;text-align:right">'+v+'</div></div>').join('') +
        '<button class="small-link" id="goErrorsBtn" style="margin-top:8px;">Review by error category →</button></div>';
    }

    const upcoming = words.filter(w=>w.history.length>0 && w.srs.nextReview>=Utils.todayISO())
      .sort((a,b)=>a.srs.nextReview.localeCompare(b.srs.nextReview)).slice(0,8);
    if(upcoming.length){
      html += '<div class="card"><h2>Upcoming Reviews</h2>' +
        upcoming.map(w=>'<div class="word-row"><div><div class="w">'+Utils.escapeHtml(w.word)+'</div><div class="meta">'+Utils.fmtDate(w.srs.nextReview)+' · interval '+w.srs.interval+'d</div></div><span class="badge '+WordModel.computeMastery(w).replace(' ','')+'">'+WordModel.computeMastery(w)+'</span></div>').join('') +
        '</div>';
    }

    el.innerHTML = html;
    el.querySelector('#startDailyBtn').addEventListener('click', ()=>Session.start());
    el.querySelector('#quickDueBtn').addEventListener('click', ()=>{ App.showTab('practice'); Views.runFreePractice({includeNew:false}); });
    el.querySelector('#addWordBtn2').addEventListener('click', ()=>App.showTab('add'));
    const goErr = el.querySelector('#goErrorsBtn');
    if(goErr) goErr.addEventListener('click', ()=>App.showTab('errors'));
    const teachNowBtn = el.querySelector('#teachNowBtn');
    if(teachNowBtn) teachNowBtn.addEventListener('click', ()=>Teaching.startQueue(awaitingTeaching, ()=>App.showTab('dashboard')));

    function stat(n,label,cls){ return '<div class="stat '+(cls||'')+'"><div class="num">'+n+'</div><div class="label">'+label+'</div></div>'; }

  handleParseFill(el){
    const textarea = el.querySelector('#pasteArea');
    const errBox = el.querySelector('#pasteErrors');
    const okBox = el.querySelector('#pasteSuccess');
    errBox.innerHTML = ''; okBox.textContent = '';

    const rawLines = textarea.value.split(/\r?\n/);
    const lines = rawLines.map((l,i)=>({ text:l, num:i+1 })).filter(l=>l.text.trim().length>0);
    if(lines.length===0){
      errBox.textContent = 'Paste at least one line of structured text first.';
      return;
    }

    if(lines.length===1){
      let data;
      try{
        data = BulkImport.parseLine(lines[0].text);
      }catch(e){
        errBox.textContent = 'Line ' + lines[0].num + ': ' + e.message;
        return;
      }
      if(Storage.state.words.some(w2=>Utils.normalize(w2.word)===Utils.normalize(data.word))){
        errBox.textContent = 'Line ' + lines[0].num + ': "' + data.word + '" already exists in your bank.';
        return;
      }
      this.renderAddForm(data, null);
      Utils.toast('Parsed — review and save below.');
      return;
    }

    // multiple lines: parse each, add valid ones directly, report failures
    const seen = new Set(Storage.state.words.map(w2=>Utils.normalize(w2.word)));
    const failures = [];
    const addedWords = [];
    lines.forEach(line=>{
      let data;
      try{
        data = BulkImport.parseLine(line.text);
      }catch(e){
        failures.push({ line, message: e.message });
        return;
      }
      const key = Utils.normalize(data.word);
      if(seen.has(key)){
        failures.push({ line, message: '"'+data.word+'" already exists or is duplicated in this batch.' });
        return;
      }
      seen.add(key);
      const w2 = WordModel.create(data);
      Storage.state.words.push(w2);
      addedWords.push(w2);
    });

    if(addedWords.length) Storage.save();
    // This path pushes straight to Storage.state.words rather than going through
    // Views.handleSaveWord, so Session's Phase 2 Add-flow patch (which only wraps
    // handleSaveWord) never sees these words -- bump the session log directly instead, same
    // as the patch's own wrapper would have done per word. Gated on Session.active, not on
    // the patch being live: reaching the Add tab from the tab bar during a session leaves
    // _origHandleSaveWord null, and those words still belong in the session's count.
    if(addedWords.length && Session.active) Session.noteWordsAdded(addedWords.length);

    if(failures.length){
      errBox.innerHTML = failures.map(f=>'Line '+f.line.num+': '+Utils.escapeHtml(f.message)).join('<br>');
      textarea.value = failures.map(f=>f.line.text).join('\n');
      okBox.textContent = addedWords.length ? ('Added ' + addedWords.length + ' word(s): ' + addedWords.map(w=>w.word).join(', ') + '. Fix the remaining line(s) above, or begin teaching the added words now.') : '';
      if(addedWords.length){
        const beginRow = document.createElement('div');
        beginRow.className = 'btn-row';
        beginRow.style.marginTop = '10px';
        beginRow.innerHTML = '<button type="button" class="btn primary small" id="beginTeachPartialBtn">▶ Begin Teaching Added Word(s)</button>';
        okBox.after(beginRow);
        beginRow.querySelector('#beginTeachPartialBtn').addEventListener('click', ()=>{
          // Calls Teaching.startQueue directly rather than through Views.renderBeginTeaching,
          // so Session's Phase 2 patch (which wraps renderBeginTeaching, not startQueue) never
          // gets a chance to redirect the completion callback -- check the patch directly here.
          Teaching.startQueue(addedWords, Session._origHandleSaveWord ? ()=>Session._backToSession() : ()=>{ App.showTab('bank'); Utils.toast('Teaching complete for all imported words.'); });
        });
      }
      return;
    }
    textarea.value = '';
    okBox.textContent = addedWords.length ? ('Added ' + addedWords.length + ' word(s): ' + addedWords.map(w=>w.word).join(', ')) : '';
    if(addedWords.length){
      this.renderBeginTeaching(addedWords, ()=>{ App.showTab('bank'); Utils.toast('Teaching complete for all imported words.'); });
    }
  },

  renderBeginTeaching(words, onAllComplete){
    if(!words || words.length===0) return;
    const el = document.getElementById('view-add');
    const list = words.map(w=>'<li>'+Utils.escapeHtml(w.word)+'</li>').join('');
    el.innerHTML = '<div class="card center">' +
      '<h2>'+(words.length>1 ? words.length+' words saved' : '"'+Utils.escapeHtml(words[0].word)+'" saved')+'</h2>' +
      '<p class="field-hint">Before these enter your spaced-review queue, each one goes through a short Teaching Phase — introduce, define, contextualize, then guided → supported → constrained → independent practice.</p>' +
      '<ul class="teach-list" style="display:inline-block;text-align:left;">'+list+'</ul>' +
      '<div class="btn-row" style="justify-content:center;margin-top:14px;">' +
      '<button class="btn primary" id="beginTeachBtn">▶ Begin Teaching'+(words.length>1?' ('+words.length+' words)':'')+'</button>' +
      '</div></div>';
    el.querySelector('#beginTeachBtn').addEventListener('click', ()=>{
      Teaching.startQueue(words, onAllComplete);
    });
  },

  handleSaveWord(form, existing){
    const fd = new FormData(form);
    const word = (fd.get('word')||'').trim();
    const meaning = (fd.get('meaning')||'').trim();
    const formField = (fd.get('form')||'').trim();
    const grammar = (fd.get('grammar')||'').trim();
    const contrast = (fd.get('contrast')||'').trim();
    const production = (fd.get('production')||'').trim();
    const mnemonic = (fd.get('mnemonic')||'').trim();
    const pronunciation = (fd.get('pronunciation')||'').trim();
    const wordType = (fd.get('wordType')||'general').trim();
    const collocations = readRepeat(form, 'collocations');
    const contexts = readRepeat(form, 'contexts');
    const cloze = readRepeatPlain(form, 'cloze');

    const errors = [];
    if(!word) errors.push('Word is required.');
    if(!meaning) errors.push('Core meaning is required.');
    if(!formField) errors.push('Form is required.');
    if(!grammar) errors.push('Grammar is required.');
    if(collocations.length<2) errors.push('At least 2 collocations are required.');
    if(!contrast) errors.push('Contrast is required.');
    if(contexts.length<2) errors.push('At least 2 typical contexts are required.');
    if(!production) errors.push('A production sentence is required.');
    // Excludes existing's own id so editing a word without changing its spelling doesn't
    // flag itself as a duplicate of itself -- but still runs when editing (not gated on
    // !existing), so renaming word B to word A's spelling is caught the same way manual add
    // and Paste import already reject it. Edit was the only remaining path that skipped this
    // check entirely.
    if(word && Storage.state.words.some(w2=>w2!==existing && Utils.normalize(w2.word)===Utils.normalize(word))){
      errors.push('This word already exists in your bank.');
    }

    const errEl = document.getElementById('formErrors');
    if(errors.length){
      errEl.innerHTML = errors.map(Utils.escapeHtml).join('<br>');
      return;
    }
    errEl.innerHTML = '';

    const finalCloze = cloze.filter(Boolean);

    if(existing){
      Object.assign(existing, { word, meaning, form: formField, grammar, collocations, contrast, contexts, production, mnemonic, pronunciation, cloze: finalCloze, wordType });
      Storage.save();
      Utils.toast('Word updated.');
      App.showTab('bank');
    } else {
      const w = WordModel.create({ word, meaning, form: formField, grammar, collocations, contrast, contexts, production, mnemonic, pronunciation, cloze: finalCloze, wordType });
      Storage.state.words.push(w);
      Storage.save();
      this.renderBeginTeaching([w], ()=>App.showTab('bank'));
    }

    function readRepeat(form, name){
      const group = form.querySelector('.repeat-group[data-name="'+name+'"]');
      return Array.from(group.querySelectorAll('input')).map(i=>i.value.trim()).filter(Boolean);
    }
    function readRepeatPlain(form, name){
      const group = form.querySelector('.repeat-group[data-name="'+name+'"]');
      return Array.from(group.querySelectorAll('input')).map(i=>i.value.trim());
    }
  },

  /* ---------- WORD BANK ---------- */
  // Deleting a word from the bank must also drop it from any LIVE in-memory holders --
  // Practice.session's queue and Exam's targetWords/checklist -- not just Storage.state.words.
  // Without this, the next persist()/_flushPersist() saves the now-stale id, and the next
  // restore() self-heals by dropping it -- but in the meantime the user still sees a card or
  // exam target for a word that no longer exists.
  _pruneDeletedWord(id){
    const s = Practice.session;
    if(s){
      const origIdx = s.idx;
      const origLen = s.queue.length;
      // Mirrors Practice.restore's old->new position map so results[].idx stays comparable to
      // the pruned queue -- canGoBack/renderPracticeReviewCard/returnToCurrent all compare
      // r.idx===s.idx, and without remapping, a stale result matches a slot that now holds a
      // different item. Duplicated here rather than shared with Practice.restore -- see
      // Practice.restore's own inline version, left untouched.
      const originalToNew = {};
      let newI = 0;
      s.queue = s.queue.filter((item, i)=>{
        if(item.word.id===id) return false;
        originalToNew[i] = newI++;
        return true;
      });
      s.results = s.results.map(r=>{
        if(originalToNew[r.idx]===undefined) return null;
        r.idx = originalToNew[r.idx];
        return r;
      }).filter(Boolean);
      if(!s.queue.length){
        Practice.session = null;
        // Sync the persisted session immediately -- otherwise a reload rehydrates from the
        // stale (still word-referencing) persisted queue and only self-heals once
        // Practice.restore's own !queue.length branch runs, showing a stale card meanwhile.
        Practice.clearPersisted();
      } else {
        let resumeIdx = s.queue.length;
        for(let i = origIdx; i < origLen; i++){
          if(originalToNew[i] !== undefined){ resumeIdx = originalToNew[i]; break; }
        }
        s.idx = Utils.clamp(resumeIdx, 0, s.queue.length);
        // s.idx was just remapped above -- s.savedIdx (the "Back" return point) is the same
        // kind of original-queue position and needs the same remap, or returning from a
        // review card after this prune lands on whatever now sits at the old numeric slot.
        if(s.savedIdx!=null){
          if(originalToNew[s.savedIdx]!==undefined){
            s.savedIdx = originalToNew[s.savedIdx];
          } else {
            let newSavedIdx = null;
            for(let i = s.savedIdx; i < origLen; i++){
              if(originalToNew[i]!==undefined){ newSavedIdx = originalToNew[i]; break; }
            }
            if(newSavedIdx!==null){ s.savedIdx = newSavedIdx; }
            else { s.savedIdx = s.queue.length; s.reviewing = false; }
          }
        }
        Practice.persist();
      }
    }
    if(Exam.targetWords && Exam.targetWords.some(w=>w.id===id)){
      Exam.targetWords = Exam.targetWords.filter(w=>w.id!==id);
      delete Exam.checklist[id];
      Exam._flushPersist();
    }
  },

  runFreePractice(opts){
    // Confirm before overwriting a live Practice.session -- reachable via a single click from
    // Dashboard's "Quick Review (Due Only)" while a different practice/production/dimension
    // session is already in progress. Wraps the entire body, including the Session.active
    // disown and the empty-queue early return, and runs before either -- cancelling must leave
    // both the live session and (if one was abandoned) the Daily Session wrapper untouched.
    const proceed = ()=>{
      // Disown any abandoned Daily Session before building a fresh standalone one.
      // Session.active is set in Session.start() and only cleared in Session.finish() -- a
      // user who starts a Session and navigates away via the tab bar leaves active=true with
      // phase wherever they left off, and nothing else reads or resets it. Completing this
      // standalone practice would otherwise hit #doneBtn's wasActive branch and run
      // finishPhase() against that abandoned Session instead of just returning to the
      // dashboard. Same class of bug as #doneBtn's own wasActive fix: reading session state
      // after a fresh flow has already mutated it.
      Session.active = false;
      // In-memory disown alone leaves Storage.state.sessionState (see Session.persist)
      // pointing at active:true -- a reload then calls Session.restore() and resurrects the
      // abandoned Daily Session even though this in-memory flag is already false.
      Session.clearPersisted();
      opts = opts || {};
      const queue = Practice.buildDueQueue(opts);
      if(queue.length===0){
        Utils.toast('Nothing to practice right now.');
        App.showTab('dashboard');
        return;
      }
      Practice.session = { queue, idx:0, results:[], mode:'free' };
      Practice.persist();
      this.renderPracticeCard();
    };
    if(Practice.session) Modal.confirm('You have a practice session in progress. Start this one instead and lose your progress on the current one?', proceed);
    else proceed();
  },

  // Phase E: the coverage table's per-dimension Practice button. Builds a legacy-track
  // queue directly (same {track:'legacy', word, level} shape buildDueQueue's
  // category-drilling branch produces) over words that have actually failed this
  // dimension at least once, at the retrieval level that exercises it (DIM_PRACTICE_LEVEL).
  // The render side disables the button when this set is empty; this guard is just defense
  // in depth against routing into a 0-item session some other way.
  runDimensionPractice(dimKey){
    // See runFreePractice's comment -- same confirm-before-overwrite and disown-on-entry
    // fixes, in the same order (confirm wraps everything, including the disown and the
    // empty-pool early return; disown itself only runs once the user has confirmed).
    const proceed = ()=>{
      Session.active = false;
      // See runFreePractice's comment -- disowning in memory only isn't enough; the persisted
      // sessionState must be cleared too, or a reload resurrects the abandoned Daily Session.
      Session.clearPersisted();
      const level = DIM_PRACTICE_LEVEL[dimKey] || 2;
      const words = Storage.state.words.filter(w=>w.dims && w.dims[dimKey] && w.dims[dimKey].fail>0);
      if(words.length===0){ Utils.toast('No words have failed this dimension yet.'); return; }
      // dimension: dimKey names which dim this queue targets -- generateQuestion's level-based
      // dispatch and recordDimForQuestion's type-based inference are both fixed many-to-one
      // (DIM_PRACTICE_LEVEL groups multiple dims per level), so without this the intended dim
      // is lost and an unrelated sibling dim gets credited instead. See KNOWN_ISSUES.md X1.
      const queue = words.map(w=>({ track:'legacy', word:w, level, dimension: dimKey }));
      Practice.session = { queue, idx:0, results:[], mode:'free' };
      Practice.persist();
      App.showTab('practice');
      this.renderPracticeCard();
    };
    if(Practice.session) Modal.confirm('You have a practice session in progress. Start this one instead and lose your progress on the current one?', proceed);
    else proceed();
  },

  runProductionDrills(){
    // See runFreePractice's comment -- same confirm-before-overwrite and disown-on-entry fixes.
    const proceed = ()=>{
      Session.active = false;
      // See runFreePractice's comment -- disowning in memory only isn't enough; the persisted
      // sessionState must be cleared too, or a reload resurrects the abandoned Daily Session.
      Session.clearPersisted();
      const queue = Practice.buildProductionQueue(8);
      if(queue.length===0){ Utils.toast('No words are ready for production drills yet.'); return; }
      Practice.session = { queue, idx:0, results:[], mode:'production' };
      Practice.persist();
      this.renderPracticeCard();
    };
    if(Practice.session) Modal.confirm('You have a practice session in progress. Start this one instead and lose your progress on the current one?', proceed);
    else proceed();
  },

  renderPracticeCard(){
    const el = document.getElementById('view-practice');
    const s = Practice.session;
    if(!s || s.idx>=s.queue.length){
      const results = s ? s.results : [];
      const correct = results.filter(r=>r.correct).length;
      const summary = results.length ? Math.round(correct/results.length*100)+'% correct ('+correct+'/'+results.length+')' : 'No items practiced.';
      el.innerHTML = '<div class="card center"><h2>Session Complete</h2><p>'+summary+'</p>' +
        '<div class="btn-row" style="justify-content:center;"><button class="btn primary" id="doneBtn">Back to Dashboard</button></div></div>';
      el.querySelector('#doneBtn').addEventListener('click', ()=>{
        // finishPhase, on the last phase, calls Session.finish() -- which sets active=false
        // and renders its own summary into view-practice. Reading Session.active *after* that
        // call was stale: it always came back false, so this used to also call
        // showTab('dashboard') and stomp the summary the user never got to see.
        const wasActive = Session.active;
        if(wasActive) Session.finishPhase(results);
        Practice.session = null;
        Practice.clearPersisted();
        if(!wasActive) App.showTab('dashboard');
      });
      return;
    }
    if(s.reviewing){ this.renderPracticeReviewCard(); return; }

    const item = s.queue[s.idx];
    // Cached on the queue item so Back -> Return to current card re-renders the exact same
    // card instead of regenerating it: several question generators are randomized (option
    // order, which cloze sentence, which hint ladder position), so a fresh call here used to
    // hand the user a different variant, silently advance lastClozeIndex's rotation, discard
    // whatever they'd typed so far, and reset hintUsed -- letting a second hint be offered on
    // an item that had already used one. Not persisted through a refresh: Practice.persist's
    // queue serialization whitelists fields and drops this one by design, and the bug this
    // fixes is in-session navigation, not surviving a reload.
    if(!item._cardState) item._cardState = { question: Practice.generateQuestion(item), hintUsed:false, typedVal:'' };
    const cs = item._cardState;
    const q = cs.question;
    s.currentQuestion = q; s.hintUsed = cs.hintUsed;
    const canGoBack = Practice.canGoBack();

    el.innerHTML =
      '<div class="practice-wrap">' +
      '<div class="practice-progress">Item '+(s.idx+1)+' of '+s.queue.length+
      ' <button type="button" class="btn ghost small" id="practiceBackBtn" style="margin-left:8px;"'+(canGoBack?'':' disabled')+'>← Back</button></div>' +
      '<div class="practice-card" id="practiceCard">' +
      '<div class="practice-level">'+trackBadge(q)+'<span>'+levelName(q.level)+(q.drillType?' · Drill: '+q.drillType:'')+'</span></div>' +
      renderMnemonic(q.word) +
      renderMeaningHint(q) +
      '<div class="practice-sub">'+Utils.escapeHtml(q.promptTitle||'')+'</div>' +
      '<div class="practice-prompt">'+renderPrompt(q)+'</div>' +
      (q.sub?'<div class="practice-sub">'+Utils.escapeHtml(q.sub)+'</div>':'') +
      '<div id="answerArea"></div>' +
      '<div id="feedbackArea"></div>' +
      '</div></div>';

    const answerArea = el.querySelector('#answerArea');
    if(q.type==='recognition'){
      answerArea.innerHTML = '<div class="mcq-options">' + q.options.map((o,i)=>'<button data-i="'+i+'">'+Utils.escapeHtml(o)+'</button>').join('') + '</div>';
      answerArea.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const val = q.options[+btn.dataset.i];
          answerArea.querySelectorAll('button').forEach(b=>b.disabled=true);
          const correct = val===q.correctAnswer;
          btn.classList.add(correct?'correct':'incorrect');
          if(!correct){
            const cb = Array.from(answerArea.querySelectorAll('button')).find(b=>b.textContent===q.correctAnswer);
            if(cb) cb.classList.add('correct');
          }
          this.handleGraded(q, correct, val);
        });
      });
    } else if(q.autoGrade){
      // A cached hintUsed means the second (post-hint) input is the one to restore, not the
      // first -- rendering the plain input here would silently let a second hint be offered
      // on an item that already used one.
      if(cs.hintUsed){
        this._renderHintUI(q, answerArea, cs.typedVal);
      } else {
        answerArea.innerHTML = '<div class="answer-input"><input type="text" id="answerInput" autocomplete="off" spellcheck="false" placeholder="Type your answer…" value="'+Utils.escapeHtml(cs.typedVal||'')+'">' +
          '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="submitBtn">Check</button></div></div>';
        const input = answerArea.querySelector('#answerInput');
        input.focus();
        input.addEventListener('input', ()=>{ cs.typedVal = input.value; });
        const submit = ()=>{
          const val = input.value.trim();
          if(!val) return;
          input.disabled = true; answerArea.querySelector('#submitBtn').disabled = true;
          const correct = Practice.grade(q, val);
          if(!correct && !s.hintUsed){
            this.offerHint(q, val, answerArea);
          } else {
            this.handleGraded(q, correct, val);
          }
        };
        answerArea.querySelector('#submitBtn').addEventListener('click', submit);
        input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
      }
    } else {
      answerArea.innerHTML = '<div class="answer-input"><textarea id="answerInput" rows="3" placeholder="Write your sentence…">'+Utils.escapeHtml(cs.typedVal||'')+'</textarea>' +
        '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="submitBtn">Reveal Self-Check</button></div></div>';
      const ta = answerArea.querySelector('#answerInput');
      ta.addEventListener('input', ()=>{ cs.typedVal = ta.value; });
      answerArea.querySelector('#submitBtn').addEventListener('click', ()=>{
        const val = ta.value.trim();
        this.showSelfCheck(q, val, answerArea);
      });
    }

    const backBtn = el.querySelector('#practiceBackBtn');
    if(backBtn && canGoBack){
      backBtn.addEventListener('click', ()=>{ Practice.goBack(); this.renderPracticeCard(); });
    }

    function levelName(l){ return ['','Recognition','Cued Recall','Cloze','Free Production'][l]; }
    function trackBadge(q){
      const cls = q.type==='drill' ? 'drill' : (q.type||'recognition');
      const label = q.type==='drill' ? 'Drill' : levelName(q.level);
      return '<span class="track-badge '+cls+'">'+label+'</span>';
    }
    function renderPrompt(q){
      if(q.type==='recognition') return 'Word: <b>'+Utils.escapeHtml(q.prompt)+'</b>';
      if(q.type==='cloze') return Utils.escapeHtml(q.prompt).replace('_____','<span class="blank">_____</span>');
      return Utils.escapeHtml(q.prompt);
    }
    function renderMnemonic(word){
      if(!word.mnemonic) return '';
      if(WordModel.mnemonicFaded(word)) return '<div class="practice-mnemonic faded">Mnemonic faded — retrieve directly.</div>';
      const safe = WordModel.maskWord(word.mnemonic, word.word);
      return '<div class="practice-mnemonic">💡 '+Utils.escapeHtml(safe)+'</div>';
    }
    function renderMeaningHint(q){
      if(!q.meaningHint) return '';
      return '<div class="practice-mnemonic">🎯 Meaning: '+Utils.escapeHtml(q.meaningHint)+'</div>';
    }
  },

  /* Read-only view of a previously graded card, reached via the practice "← Back"
     control. Reuses the exact stored question (never regenerates one, since several
     question generators are randomized) so the reveal matches what was actually
     answered. Grading is disabled here — the only action is returning to the
     current, still-in-progress card. */
  renderPracticeReviewCard(){
    const el = document.getElementById('view-practice');
    const s = Practice.session;
    const result = s.results.find(r=>r.idx===s.idx);
    if(!result){ Practice.returnToCurrent(); this.renderPracticeCard(); return; }
    const q = result.question;
    const word = result.word;

    function levelName(l){ return ['','Recognition','Cued Recall','Cloze','Free Production'][l]; }
    function renderPrompt(q){
      if(q.type==='recognition') return 'Word: <b>'+Utils.escapeHtml(q.prompt)+'</b>';
      if(q.type==='cloze') return Utils.escapeHtml(q.prompt).replace('_____','<span class="blank">_____</span>');
      return Utils.escapeHtml(q.prompt);
    }

    const gradeLine = result.correct
      ? 'Grade given: <b>'+(result.rating==='easy'?'⚡ Easy':'😅 Hard')+'</b>'
      : 'Marked as: <b>Again</b>'+(result.category?' · Error category: <b>'+Utils.escapeHtml(result.category)+'</b>':'');

    el.innerHTML =
      '<div class="practice-wrap">' +
      '<div class="practice-progress">Item '+(s.idx+1)+' of '+s.queue.length+' <span class="badge" style="margin-left:8px;">Reviewing previous card</span></div>' +
      '<div class="practice-card">' +
      '<div class="practice-level">Level '+q.level+' · '+levelName(q.level)+(q.drillType?' · Drill: '+q.drillType:'')+'</div>' +
      '<div class="reveal-word-row">'+Utils.escapeHtml(word.word)+
        (word.pronunciation ? ' <span class="pronunciation">('+Utils.escapeHtml(word.pronunciation)+')</span>' : '') +
        ' <button type="button" class="speak-btn small" data-word="'+Utils.escapeHtml(word.word)+'" title="Listen">🔊</button></div>' +
      '<div class="practice-sub">'+Utils.escapeHtml(q.promptTitle||'')+'</div>' +
      '<div class="practice-prompt">'+renderPrompt(q)+'</div>' +
      '<div class="self-check">' +
      '<div><b>Your answer:</b> '+Utils.escapeHtml(result.userVal || '(empty)')+'</div>' +
      '<div><b>Meaning:</b> '+Utils.escapeHtml(word.meaning||'—')+'</div>' +
      '<div><b>Collocations:</b> '+Utils.escapeHtml((word.collocations||[]).join(', ')||'—')+'</div>' +
      (word.contexts && word.contexts.length ? '<div><b>Context:</b> '+Utils.escapeHtml(word.contexts[0])+'</div>' : '') +
      '</div>' +
      '<div class="feedback '+(result.correct?'correct':'incorrect')+'" style="margin-top:12px;">' + (result.correct?'✓ Correct':'✗ Not quite') +
      (!result.correct ? '<div class="correct-answer">Correct: '+Utils.escapeHtml(q.correctAnswer || word.word)+'</div>' : '') +
      '</div>' +
      '<div class="practice-sub" style="margin-top:8px;">'+gradeLine+'</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn primary" id="returnCurrentBtn">Return to current card</button></div>' +
      '</div></div>';

    el.querySelector('#returnCurrentBtn').addEventListener('click', ()=>{
      Practice.returnToCurrent();
      this.renderPracticeCard();
    });
  },

  offerHint(q, wrongVal, answerArea){
    const s = Practice.session;
    s.hintUsed = true;
    const item = s.queue[s.idx];
    if(item._cardState){ item._cardState.hintUsed = true; item._cardState.typedVal = ''; }
    // Measurement fix: the first wrong submission used to be silently discarded -- only the
    // post-hint resubmission ever reached handleGraded/logAttempt, so a hinted item that got
    // corrected on try 2 logged only a single {correct:true}, biasing accuracy upward on every
    // hinted item. Log the failed first attempt through the same path as everything else so it
    // lands in both history and attempts[] before the hint is shown.
    WordModel.logAttempt(q.word, q.level, false, { rating:'again', hinted:false, track: q.track||'legacy', attemptsPhase:'practice', dimension: q.dimension });
    // Same bump handleGraded's failure branch makes for a non-hinted miss -- without this,
    // dailyActivity.reviews and attempts[] disagreed on the hinted-item count by exactly the
    // number of hints given, since this first wrong answer landed in history/attempts[] above
    // but nowhere else.
    DailyActivity.bump(Utils.todayISO(), { reviews: 1 });
    // Same reasoning as logAttempt above -- without this, the pre-hint miss landed in
    // history/attempts[]/dailyActivity but never in dims, so dimension fail counts under-
    // reported on every hinted item. Keys off question.type, so it's correct for both legacy
    // and fsrs-track questions with no extra branching needed here.
    this.recordDimForQuestion(q, false);
    // Flush the initial wrong attempt immediately -- the hint UI is ephemeral and a refresh
    // between hint and retry must not lose this measurement. (Do NOT add Practice.persist()
    // here; only the log needs to survive.)
    Storage.save();
    // Rendering-only from here -- extracted into _renderHintUI so renderPracticeCard can
    // redraw this same UI on a Back -> Return to current card round trip (with the
    // in-progress second attempt restored) without re-running the log/bump above, which must
    // fire exactly once per real wrong answer.
    this._renderHintUI(q, answerArea, '');
  },

  // Pure render + wire, no logging -- called both by offerHint (a fresh hint, prefillVal
  // always '') and by renderPracticeCard when redrawing a card whose item._cardState.hintUsed
  // is already true (prefillVal is that item's cached in-progress second attempt).
  _renderHintUI(q, answerArea, prefillVal){
    const answer = q.correctAnswer;
    const hint = answer[0] + '_'.repeat(Math.max(1,answer.length-1));
    answerArea.innerHTML = '<div class="feedback incorrect">Not quite. One more try with a hint:</div>' +
      '<div class="answer-input"><div style="font-family:var(--mono);font-size:20px;letter-spacing:3px;margin-bottom:10px;">'+Utils.escapeHtml(hint)+'</div>' +
      '<input type="text" id="answerInput2" autocomplete="off" spellcheck="false" placeholder="Type your answer…" value="'+Utils.escapeHtml(prefillVal||'')+'">' +
      '<div class="btn-row" style="justify-content:center;margin-top:10px;"><button class="btn primary" id="submitBtn2">Check</button></div></div>';
    const input = answerArea.querySelector('#answerInput2');
    input.focus();
    const s = Practice.session;
    const item = s.queue[s.idx];
    input.addEventListener('input', ()=>{ if(item._cardState) item._cardState.typedVal = input.value; });
    const submit = ()=>{
      const val = input.value.trim();
      if(!val) return;
      input.disabled = true;
      const correct = Practice.grade(q, val);
      this.handleGraded(q, correct, val, true);
    };
    answerArea.querySelector('#submitBtn2').addEventListener('click', submit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
  },

  showSelfCheck(question, userText, answerArea){
    const word = question.word;
    answerArea.innerHTML =
      '<div class="reveal-word-row">'+Utils.escapeHtml(word.word)+
      (word.pronunciation ? ' <span class="pronunciation">('+Utils.escapeHtml(word.pronunciation)+')</span>' : '') +
      ' <button type="button" class="speak-btn small" data-word="'+Utils.escapeHtml(word.word)+'" title="Listen">🔊</button></div>' +
      '<div class="feedback"><b>Your sentence:</b><div style="margin-top:4px;">'+Utils.escapeHtml(userText || '(empty)')+'</div></div>' +
      '<div class="self-check">' +
      '<div><b>Meaning:</b> '+Utils.escapeHtml(word.meaning||'—')+'</div>' +
      '<div><b>Collocations:</b> '+Utils.escapeHtml(word.collocations.join(', ')||'—')+'</div>' +
      '<div><b>Grammar:</b> '+Utils.escapeHtml(word.grammar||'—')+'</div>' +
      '<div><b>Contrast:</b> '+Utils.escapeHtml(word.contrast||'—')+'</div>' +
      '<div><b>Register/context fit:</b> does it match a typical context?</div>' +
      '</div>' +
      '<div class="practice-sub" style="margin-top:12px;">Did you use "'+Utils.escapeHtml(word.word)+'" correctly and naturally?</div>' +
      '<div class="rating-row"><button class="btn good" id="selfYesBtn">Yes, correct</button><button class="btn bad" id="selfNoBtn">No, needs work</button></div>';
    answerArea.querySelector('#selfYesBtn').addEventListener('click', ()=>this.handleGraded(question, true, userText));
    answerArea.querySelector('#selfNoBtn').addEventListener('click', ()=>this.handleGraded(question, false, userText));
  },

  handleGraded(question, correct, userVal, hintWasUsed){
    const word = question.word;
    const s = Practice.session;
    const feedbackArea = document.getElementById('feedbackArea');
    let fbHtml = '<div class="feedback '+(correct?'correct':'incorrect')+'">' + (correct?'✓ Correct':'✗ Not quite');
    if(!correct){
